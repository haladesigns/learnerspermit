          </div>
          <Segmented
            label="flex-direction"
            value={selected.styles.flexDirection}
            options={[
              { value: "row", label: "→ row" },
              { value: "row-reverse", label: "← rev" },
              { value: "column", label: "↓ col" },
              { value: "column-reverse", label: "↑ rev" },
            ]}
            onChange={(v) => setStyle({ flexDirection: v })}
            {...rp("flexDirection")}
          />
          <Segmented
            label="justify-content (main axis)"
            value={selected.styles.justifyContent}
            options={[
              { value: "flex-start", label: "start" },
              { value: "center", label: "center" },
              { value: "flex-end", label: "end" },
              { value: "space-between", label: "btwn" },
              { value: "space-around", label: "arnd" },
              { value: "space-evenly", label: "even" },
            ]}
            onChange={(v) => setStyle({ justifyContent: v })}
            {...rp("justifyContent")}
          />
          <Segmented
            label="align-items (cross axis)"
            value={selected.styles.alignItems}
            options={[
              { value: "stretch", label: "stretch" },
              { value: "flex-start", label: "start" },
              { value: "center", label: "center" },
              { value: "flex-end", label: "end" },
              { value: "baseline", label: "base" },
            ]}
            onChange={(v) => setStyle({ alignItems: v })}
            {...rp("alignItems")}
          />
          <Segmented
            label="flex-wrap"
            value={selected.styles.flexWrap}
            options={["nowrap", "wrap", "wrap-reverse"]}
            onChange={(v) => setStyle({ flexWrap: v })}
            {...rp("flexWrap")}
          />
          {/* align-content only has an effect on multi-line (wrapping) flex
              containers — it distributes the LINES along the cross axis. Hidden
              when nowrap so the control isn't a no-op. */}
          {selected.styles.flexWrap && selected.styles.flexWrap !== "nowrap" && (
            <Segmented
              label="align-content (wrapped lines)"
              value={selected.styles.alignContent ?? "stretch"}
              options={[
                { value: "stretch", label: "stretch" },
                { value: "flex-start", label: "start" },
                { value: "center", label: "center" },
                { value: "flex-end", label: "end" },
                { value: "space-between", label: "btwn" },
                { value: "space-around", label: "arnd" },
                { value: "space-evenly", label: "even" },
              ]}
              onChange={(v) => setStyle({ alignContent: v })}
              {...rp("alignContent")}
            />
          )}
          <Slider
            label="gap"
            value={selected.styles.gap ?? 0}
            min={0}
            max={64}
            onChange={(v) => setStyle({ gap: v })}
            {...rp("gap")}
          />
        </section>
      ) : (
        <section>
          <div className="fc-section-label">This element is a leaf box</div>
          <button className="fc-convert-btn" onClick={convertToContainer}>
            ▦ Make it a flex container
          </button>
        </section>
      )}

      {isFlexItem && (
        <section style={{ marginTop: 22 }}>
          <div className="fc-section-label">
            As a flex item <span className="fc-tag-pill">parent is flex</span>
          </div>
          <Slider
            label="flex-grow"
            value={selected.styles.flexGrow ?? 0}
            min={0}
            max={5}
            suffix=""
            onChange={(v) => setStyle({ flexGrow: v })}
            {...rp("flexGrow")}
          />
          <Slider
            label="flex-shrink"
            value={selected.styles.flexShrink ?? 1}
            min={0}
            max={5}
            suffix=""
            onChange={(v) => setStyle({ flexShrink: v })}
            {...rp("flexShrink")}
          />
          <Segmented
            label="align-self"
            value={selected.styles.alignSelf ?? "auto"}
            options={[
              { value: "auto", label: "auto" },
              { value: "flex-start", label: "start" },
              { value: "center", label: "center" },
              { value: "flex-end", label: "end" },
              { value: "stretch", label: "strch" },
            ]}
            onChange={(v) => setStyle({ alignSelf: v })}
            {...rp("alignSelf")}
          />
        </section>
      )}

      <section style={{ marginTop: 22 }}>
        <div className="fc-section-label">Box model</div>
        <DimInput
          label="width"
          value={selected.styles.width}
          onChange={(v) => setStyle({ width: v })}
          measuredDefault={measuredSize.w}
          {...rp("width")}
        />
        <DimInput
          label="height"
          value={selected.styles.height}
          onChange={(v) => setStyle({ height: v })}
          measuredDefault={measuredSize.h}
          {...rp("height")}
        />
        <Slider
          label="padding"
          value={selected.styles.padding ?? 0}
          min={0}
          max={80}
          onChange={(v) => setStyle({ padding: v })}
          {...rp("padding")}
        />
        <Slider
          label="margin"
          value={selected.styles.margin ?? 0}
          min={0}
          max={80}
          onChange={(v) => setStyle({ margin: v })}
          {...rp("margin")}
        />
        <Slider
          label="border width"
          value={selected.styles.borderWidth ?? 0}
          min={0}
          max={12}
          onChange={(v) => {
            if (v === 0) {
              // width 0 → clear the whole border (all three longhands)
              setStyle({ borderWidth: undefined, borderStyle: undefined, borderColor: undefined });
            } else {
              // seed style/color defaults if this is the first time enabling it
              setStyle({
                borderWidth: v,
                borderStyle: selected.styles.borderStyle || "solid",
                borderColor: selected.styles.borderColor || "blue",
              });
            }
          }}
          {...rp("borderWidth")}
        />
        {(selected.styles.borderWidth ?? 0) > 0 && (
          <>
            <Segmented
              label="border style"
              value={selected.styles.borderStyle || "solid"}
              options={[
                { value: "solid", label: "solid" },
                { value: "dashed", label: "dashed" },
                { value: "dotted", label: "dotted" },
              ]}
              onChange={(v) => setStyle({ borderStyle: v })}
              {...rp("borderStyle")}
            />
            <FieldLabel label="border color" {...rp("borderColor")}>
              <div className="fc-color-row">
                <input
                  type="color"
                  className="fc-color-swatch"
                  value={toHexColor(selected.styles.borderColor || "blue")}
                  onChange={(e) => setStyle({ borderColor: e.target.value })}
                />
                <code className="fc-color-val">{selected.styles.borderColor || "blue"}</code>
              </div>
            </FieldLabel>
          </>
        )}
      </section>
    </div>
  );

  // Enter/leave freeform edit. Entering seeds the draft from current code.
  const beginCodeEdit = () => {
    setCodeDraft(tab === "css" ? cssText : htmlText);
    setCodeEditing(true);
  };
  const applyCodeEdit = () => {
    const ok =
      tab === "css" ? onCommitCssAll(codeDraft) : onCommitHtmlAll(codeDraft);
    if (ok) setCodeEditing(false); // (c) on reject, stay in editor so work isn't lost
  };
  const cancelCodeEdit = () => setCodeEditing(false);

  const CodePanel = (
    <div className="fc-code-inner">
      <div className="fc-code-tabs">
        <button
          onClick={() => { if (!codeEditing) setTab("css"); }}
          className={"fc-code-tab" + (tab === "css" ? " is-active" : "")}
          disabled={codeEditing}
        >
          CSS
        </button>
        <button
          onClick={() => { if (!codeEditing) setTab("html"); }}
          className={"fc-code-tab" + (tab === "html" ? " is-active" : "")}
          disabled={codeEditing}
        >
          HTML
        </button>
        <span style={{ flex: 1 }} />
        {codeEditing ? (
          <>
            <span className="fc-code-editnote">
              {tab === "html" ? "rebuilds the whole layout" : "reapplies all rules"} · ⌘↵ apply · esc cancel
            </span>
            <button className="fc-copy-btn" onClick={cancelCodeEdit}>cancel</button>
            <button className="fc-copy-btn is-primary" onClick={applyCodeEdit}>apply</button>
          </>
        ) : (
          <>
            <button
              className="fc-copy-btn"
              onClick={() => navigator.clipboard?.writeText(tab === "css" ? cssText : htmlText)}
            >
              copy
            </button>
            <button className="fc-copy-btn" onClick={beginCodeEdit} title="Freeform edit (experimental)">
              ✎ edit
            </button>
          </>
        )}
      </div>
      {codeEditing ? (
        <textarea
          className="fc-code-edit fc-code-edit-full"
          value={codeDraft}
          autoFocus
          spellCheck={false}
          onChange={(e) => setCodeDraft(e.target.value)}
          onKeyDown={(e) => {
            if (e.key === "Escape") { e.preventDefault(); cancelCodeEdit(); }
            else if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) { e.preventDefault(); applyCodeEdit(); }
            e.stopPropagation();
          }}
        />
      ) : (
        <div className="fc-code-viewwrap" onDoubleClick={beginCodeEdit} title="Double-click to edit (experimental)">
          <CodeView
            segments={tab === "css" ? cssSegs : htmlSegs}
            selectedId={selectedId}
            joiner={tab === "css" ? "\n\n" : "\n"}
          />
        </div>
      )}
    </div>
  );

  const CanvasPanel = (
    <>
      <div className="fc-canvas-head">
        <span className="fc-canvas-title">Canvas</span>
        <span className="fc-canvas-hint fc-desktop-only">
          click to select · drag to reorder · drag from palette to add
        </span>
        <div className={"fc-bm-legend fc-desktop-only" + (showBoxModel ? "" : " is-hidden")} aria-hidden={!showBoxModel}>
          <span className="fc-legend-item"><span className="fc-legend-sw sw-pad" />padding</span>
          <span className="fc-legend-item"><span className="fc-legend-sw sw-mar" />margin</span>
          <span className="fc-legend-item"><span className="fc-legend-sw sw-gap" />gap</span>
        </div>
      </div>
      <div
        className="fc-canvas-scroll"
        onClick={() => setSelectedId(null)}
        onMouseMove={onCanvasHover}
        onMouseLeave={onCanvasLeave}
      >
        <CanvasNode
          node={tree}
          isRoot
          selectedId={selectedId}
          onSelect={setSelectedId}
          dropTarget={dropTarget}
          setDropTarget={setDropTarget}
          onDropNew={onDropNew}
          onDropMove={onDropMove}
          dragState={dragState}
          showBoxModel={showBoxModel}
          showLines={showLines}
          hidePills={hidePills}
          onResize={onResize}
          syncDims={syncDims}
          isDragging={isDragging}
          onText={onText}
        />
      </div>
      {showTooltip && hoverInfo && <HoverTooltip info={hoverInfo} treeRootId={tree.id} />}
    </>
  );

  return (
    <div className={"fc-app fc-theme-" + theme}>
      <style>{css}</style>
      {siteMsg && <div className="fc-toast">{siteMsg}</div>}
      {pendingExport && (
        <div className="fc-modal-backdrop" onClick={() => resolveExport("cancel")}>
          <div className="fc-modal" onClick={(e) => e.stopPropagation()}>
            <div className="fc-modal-title">Export borders</div>
            <p className="fc-modal-text">
              Give every element a <b>1px solid blue</b> border <b>in the exported file</b>?
              Your editor stays unchanged. Only elements without a border get one.
            </p>
            <div className="fc-modal-actions">
              <button className="fc-modal-btn" onClick={() => resolveExport("current")}>
                Current settings
              </button>
              <button className="fc-modal-btn is-primary" onClick={() => resolveExport("all")}>
                Border all
              </button>
            </div>
            <button className="fc-modal-cancel" onClick={() => resolveExport("cancel")}>
              Cancel
            </button>
          </div>
        </div>
      )}

      {/* ---- top toolbar ---- */}
      <header className="fc-toolbar">
        <div className="fc-brand">
          <span className="fc-brand-mark">◧</span>
          <span className="fc-brand-name">FLEXCRAFT</span>
        </div>
        <div className="fc-toolbar-actions">
          <button
            className="fc-tool-btn"
            onClick={undo}
            disabled={!history.past.length}
            title="Undo"
          >
            ↶
          </button>
          <button
            className="fc-tool-btn"
            onClick={redo}
            disabled={!history.future.length}
            title="Redo"
          >
            ↷
          </button>
          <button
            className={"fc-tool-btn" + (showBoxModel ? " is-on" : "")}
            onClick={() => setShowBoxModel((v) => !v)}
            title="Show box model (padding / margin) on selected element"
          >
            ▣
          </button>
          <button
            className={"fc-tool-btn" + (showLines ? " is-on" : "")}
            onClick={() => setShowLines((v) => !v)}
            title="Show flex lines & main axis on selected container"
          >
            ☰
          </button>
          <button
            className={"fc-tool-btn" + (hidePills ? " is-on" : "")}
            onClick={() => setHidePills((v) => !v)}
            title={hidePills ? "Show name pills" : "Minimize name pills"}
          >
            🏷
          </button>
          <button
            className={"fc-tool-btn" + (syncDims ? " is-on" : "")}
            onClick={() => setSyncDims((v) => !v)}
            title={syncDims ? "Resize: width & height synced (square)" : "Resize: sync width & height"}
          >
            ⊞
          </button>
          <button
            className={"fc-tool-btn" + (showTooltip ? " is-on" : "")}
            onClick={() => setShowTooltip((v) => !v)}
            title={showTooltip ? "Hide hover info" : "Show hover info (dimensions & metadata)"}
          >
            ⓘ
          </button>
          <span className="fc-tool-sep" />
          <button
            className="fc-tool-btn fc-tool-text"
            onClick={() => importInputRef.current && importInputRef.current.click()}
            title="Import a FlexCraft-exported .html (or .html + .css)"
          >
            ↑ Import
          </button>
          <input
            ref={importInputRef}
            type="file"
            accept=".html,.htm,.css"
            multiple
            style={{ display: "none" }}
            onChange={onImportPick}
          />
          <button
            className="fc-tool-btn fc-tool-text"
            onClick={exportSite}
            title="Download a runnable .html of this layout"
          >
            ↓ Export
          </button>
          <button
            className="fc-tool-btn"
            onClick={copySite}
            title="Copy the full runnable HTML document to clipboard"
          >
            ⧉
          </button>
          <span className="fc-tool-sep" />
          <button
            className="fc-tool-btn"
            onClick={() => setTheme((t) => (t === "dark" ? "light" : "dark"))}
            title="Toggle theme"
          >
            {theme === "dark" ? "\u2600" : "\u263e"}
          </button>
        </div>
      </header>

      {/* ---- body: desktop = 3 panes; mobile = one pane at a time ---- */}
      <div className="fc-body">
        {leftCollapsed ? (
          <button
            className="fc-rail fc-rail-left fc-desktop-only"
            onClick={() => setLeftCollapsed(false)}
            title="Expand elements panel"
          >
            ›
          </button>
        ) : (
          <aside
            className="fc-palette fc-desktop-only"
            style={{ width: leftWidth }}
          >
            <button
              className="fc-panel-collapse fc-collapse-left"
              onClick={() => setLeftCollapsed(true)}
              title="Collapse panel"
            >
              ‹
            </button>
            {PalettePanel}
            <div
              className="fc-panel-grip fc-panel-grip-right"
              onPointerDown={startLeftResize}
              title="Drag to resize panel"
            />
          </aside>
        )}

        <main className="fc-canvas-wrap">
          {/* mobile shows whichever pane is active; desktop always canvas+code */}
          <div className="fc-mobile-only fc-mobile-pane">
            {mobilePane === "canvas" && CanvasPanel}
            {mobilePane === "add" && <div className="fc-scroll-pane">{PalettePanel}</div>}
            {mobilePane === "style" && <div className="fc-scroll-pane">{PropsPanel}</div>}
            {mobilePane === "code" && CodePanel}
          </div>
          <div className="fc-desktop-only fc-desktop-canvas">
            {CanvasPanel}
            <div
              className="fc-code-drawer"
              style={{ height: drawerHeight, maxHeight: "none" }}
            >
              {/* Drag this bar to grow/shrink the code drawer. Pointer-driven so
                  it works the same way the resize handles do. */}
              <div
                className="fc-drawer-grip"
                onPointerDown={startDrawerResize}
                title="Drag to resize the code panel"
              >
                <span className="fc-drawer-grip-bar" />
              </div>
              {CodePanel}
            </div>
          </div>
        </main>

        {rightCollapsed ? (
          <button
            className="fc-rail fc-rail-right fc-desktop-only"
            onClick={() => setRightCollapsed(false)}
            title="Expand properties panel"
          >
            ‹
          </button>
        ) : (
          <aside
            className="fc-props fc-desktop-only"
            style={{ width: rightWidth }}
          >
            <div
              className="fc-panel-grip fc-panel-grip-left"
              onPointerDown={startRightResize}
              title="Drag to resize panel"
            />
            <button
              className="fc-panel-collapse fc-collapse-right"
              onClick={() => setRightCollapsed(true)}
              title="Collapse panel"
            >
              ›
            </button>
            {PropsPanel}
          </aside>
        )}
      </div>

      {/* ---- mobile bottom tab bar ---- */}
      <nav className="fc-tabbar fc-mobile-only">
        {[
          { k: "canvas", label: "Canvas", icon: "\u25a6" },
          { k: "add", label: "Add", icon: "\uff0b" },
          { k: "style", label: "Style", icon: "\u2699" },
          { k: "code", label: "Code", icon: "\u27e8\u27e9" },
        ].map((t) => (
          <button
            key={t.k}
            className={"fc-tabbar-btn" + (mobilePane === t.k ? " is-active" : "")}
            onClick={() => setMobilePane(t.k)}
          >
            <span className="fc-tabbar-icon">{t.icon}</span>
            {t.label}
          </button>
        ))}
      </nav>
    </div>
  );
}

// ============================================================================
//  Styles — now a real CSS string with theme variables (the v1 inline-style
//  constants are gone; theming is just swapping the variable block).
// ============================================================================
const css = `
@import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap');

.fc-app *, .fc-app *::before, .fc-app *::after { box-sizing: border-box; }

/* ---- THEME TOKENS ---- */
.fc-theme-dark {
  --ink:#0d0f14; --panel:#14171f; --panel2:#1b1f2a; --line:rgba(255,255,255,0.08);
  --txt:#e6e8ee; --mut:#8b91a3; --accent:#e8b04b; --accent-soft:rgba(232,176,75,0.12);
  --node:rgba(255,255,255,0.05); --node-line:rgba(255,255,255,0.12);
  --dot:rgba(255,255,255,0.05); --track:#2a2f3c;
}
.fc-theme-light {
  --ink:#f3f1ea; --panel:#ffffff; --panel2:#f0ede3; --line:rgba(0,0,0,0.1);
  --txt:#1d1f26; --mut:#6c7180; --accent:#b8741a; --accent-soft:rgba(184,116,26,0.12);
  --node:rgba(0,0,0,0.03); --node-line:rgba(0,0,0,0.14);
  --dot:rgba(0,0,0,0.06); --track:#d8d4c8;
}

.fc-app {
  display:flex; flex-direction:column; height:100vh; min-height:560px;
  font-family:'Space Mono',ui-monospace,monospace; font-size:12px;
  color:var(--txt); background:var(--ink); overflow:hidden;
  transition: background 200ms, color 200ms;
}
.fc-app ::-webkit-scrollbar { width:10px; height:10px; }
.fc-app ::-webkit-scrollbar-thumb { background:var(--track); border-radius:6px; }
.fc-app ::-webkit-scrollbar-track { background:transparent; }

.fc-range{ -webkit-appearance:none;appearance:none;width:100%;height:4px;border-radius:4px;background:var(--track); }
.fc-range::-webkit-slider-thumb{ -webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--accent);cursor:pointer;box-shadow:0 0 0 3px var(--accent-soft); }
.fc-range::-moz-range-thumb{ width:14px;height:14px;border:none;border-radius:50%;background:var(--accent);cursor:pointer; }

/* ---- toolbar ---- */
.fc-toolbar{
  display:flex; align-items:center; justify-content:space-between;
  padding:8px 14px; background:var(--panel); border-bottom:1px solid var(--line);
  flex-shrink:0;
}
.fc-brand{ display:flex; align-items:center; gap:9px; }
.fc-brand-mark{ font-size:20px; color:var(--accent); }
.fc-brand-name{ font-family:'Fraunces',Georgia,serif; font-size:15px; letter-spacing:1px; }
.fc-toolbar-actions{ display:flex; gap:6px; }
.fc-tool-btn{
  width:30px; height:30px; border-radius:6px; cursor:pointer; font-size:14px;
  background:var(--panel2); border:1px solid var(--line); color:var(--txt);
}
.fc-tool-btn:disabled{ opacity:0.35; cursor:default; }
.fc-tool-btn:not(:disabled):hover{ border-color:var(--accent); color:var(--accent); }
.fc-tool-btn.is-on{ background:var(--accent); color:var(--ink); border-color:var(--accent); box-shadow:0 0 0 2px var(--accent-soft), 0 0 8px var(--accent-soft); }
.fc-tool-text{ width:auto; padding:0 10px; font-size:11px; white-space:nowrap; }
.fc-tool-sep{ width:1px; align-self:stretch; margin:4px 4px; background:var(--line); }
.fc-toast{
  position:fixed; left:50%; bottom:24px; transform:translateX(-50%);
  background:var(--accent); color:var(--ink); font-family:'Space Mono',monospace;
  font-size:12px; font-weight:700; padding:9px 16px; border-radius:8px;
  box-shadow:0 6px 24px rgba(0,0,0,0.5); z-index:10000; max-width:80vw;
  text-align:center;
}
.fc-modal-backdrop{
  position:fixed; inset:0; background:rgba(0,0,0,0.55); z-index:10001;
  display:flex; align-items:center; justify-content:center;
}
.fc-modal{
  background:var(--panel); border:1px solid var(--line); border-radius:12px;
  padding:20px; width:min(380px,90vw); box-shadow:0 12px 48px rgba(0,0,0,0.6);
}
.fc-modal-title{ font-family:'Fraunces',Georgia,serif; font-size:16px; color:var(--txt); margin-bottom:8px; }
.fc-modal-text{ font-size:12px; line-height:1.6; color:var(--mut); margin:0 0 16px; }
.fc-modal-actions{ display:flex; gap:8px; }
.fc-modal-btn{
  flex:1; padding:9px 12px; border-radius:7px; cursor:pointer; font-family:inherit;
  font-size:12px; background:var(--panel2); border:1px solid var(--line); color:var(--txt);
}
.fc-modal-btn:hover{ border-color:var(--accent); }
.fc-modal-btn.is-primary{ background:var(--accent); color:var(--ink); border-color:var(--accent); font-weight:700; }
.fc-modal-cancel{
  display:block; margin:12px auto 0; background:none; border:none; color:var(--mut);
  font-family:inherit; font-size:11px; cursor:pointer; text-decoration:underline;
}
.fc-color-row{ display:flex; align-items:center; gap:8px; }
.fc-color-swatch{
  width:30px; height:24px; padding:0; border:1px solid var(--line); border-radius:5px;
  background:none; cursor:pointer;
}
.fc-color-val{ font-size:11px; color:var(--mut); font-family:'Space Mono',monospace; }

/* ---- body layout ---- */
.fc-body{ flex:1; display:flex; min-height:0; }
.fc-palette{ flex-shrink:0; background:var(--panel); border-right:1px solid var(--line); overflow-y:auto; overflow-x:hidden; position:relative; }
.fc-props{ flex-shrink:0; background:var(--panel); border-left:1px solid var(--line); overflow-y:auto; overflow-x:hidden; position:relative; }
/* collapsed rail — thin clickable strip that re-expands the panel */
.fc-rail{
  width:20px; flex-shrink:0; background:var(--panel); border:none; cursor:pointer;
  color:var(--mut); font-size:15px; display:flex; align-items:flex-start;
  justify-content:center; padding-top:14px; font-family:inherit;
}
.fc-rail:hover{ color:var(--accent); background:var(--panel2); }
.fc-rail-left{ border-right:1px solid var(--line); }
.fc-rail-right{ border-left:1px solid var(--line); }
/* collapse button pinned to the panel's inner-top corner */
.fc-panel-collapse{
  position:absolute; top:8px; z-index:5; width:18px; height:18px; border-radius:4px;
  background:var(--panel2); border:1px solid var(--line); color:var(--mut);
  cursor:pointer; font-size:11px; line-height:1; padding:0; display:flex;
  align-items:center; justify-content:center;
}
.fc-panel-collapse:hover{ border-color:var(--accent); color:var(--accent); }
.fc-collapse-left{ right:8px; }
.fc-collapse-right{ left:8px; }
/* draggable width grip on the panel's inner edge */
.fc-panel-grip{
  position:absolute; top:0; bottom:0; width:14px; cursor:ew-resize; z-index:6;
  touch-action:none; background:transparent;
}
/* slim visible line centered in the wide (invisible) hit area, so the grab
   target is forgiving while the indicator stays thin */
.fc-panel-grip::before{
  content:""; position:absolute; top:0; bottom:0; left:50%; width:2px;
  transform:translateX(-50%); background:transparent; transition:background 100ms;
}
.fc-panel-grip:hover::before{ background:var(--accent); }
.fc-panel-grip-right{ right:-7px; }
.fc-panel-grip-left{ left:-7px; }
.fc-canvas-wrap{ flex:1; min-width:0; display:flex; flex-direction:column; }
.fc-desktop-canvas{ flex:1; display:flex; flex-direction:column; min-height:0; }

.fc-palette-inner{ padding:14px; padding-top:30px; display:flex; flex-direction:column; gap:9px; height:100%; }
.fc-palette-head{ font-size:10px; text-transform:uppercase; letter-spacing:1.5px; color:var(--mut); }
.fc-palette-item{
  display:flex; gap:10px; align-items:center; padding:10px 12px; background:var(--panel2);
  border:1px solid var(--line); border-radius:6px; cursor:grab;
}
.fc-palette-item:hover{ border-color:var(--accent); }
.fc-palette-icon{ color:var(--accent); font-size:16px; }
.fc-palette-name{ font-weight:700; }
.fc-palette-hint{ color:var(--mut); font-size:10px; }
.fc-rapid-toggle{
  display:flex; align-items:center; gap:8px; width:100%; text-align:left;
  padding:8px 10px; margin-top:2px; border-radius:6px; cursor:pointer;
  background:var(--panel2); border:1px solid var(--line); color:var(--mut);
  font-family:inherit; font-size:10.5px;
}
.fc-rapid-toggle:hover{ border-color:var(--accent); }
.fc-rapid-toggle.is-on{ background:var(--accent-soft); border-color:var(--accent); color:var(--accent); }
.fc-rapid-toggle b{ font-weight:700; }
.fc-rapid-pin{ font-size:13px; line-height:1; }
.fc-rapid-target{ display:block; font-size:9.5px; opacity:0.85; margin-top:1px; }
.fc-layers{ display:flex; flex-direction:column; gap:2px; }
.fc-layer{
  display:flex; align-items:center; gap:7px; padding:6px 8px; text-align:left;
  background:transparent; border:none; color:var(--mut); cursor:pointer;
  font-family:inherit; font-size:11px; border-radius:4px; width:100%;
}
.fc-layer:hover{ background:var(--node); color:var(--txt); }
.fc-layer.is-active{ background:var(--accent-soft); color:var(--accent); }
.fc-layer-icon{ color:var(--accent); }
.fc-palette-note{ margin-top:auto; font-size:10.5px; line-height:1.6; color:var(--mut); border-top:1px solid var(--line); padding-top:12px; }
.fc-shortcut-row{ display:flex; align-items:center; justify-content:space-between; gap:8px; padding:2px 0; }
.fc-shortcut-label{ display:flex; flex-direction:column; font-size:11px; color:var(--txt); }
.fc-shortcut-sub{ font-size:9px; color:var(--mut); margin-top:1px; }
.fc-keycap{
  font-family:'Space Mono',monospace; font-size:10.5px; color:var(--txt);
  background:var(--panel2); border:1px solid var(--line); border-bottom-width:2px;
  border-radius:5px; padding:4px 9px; cursor:pointer; white-space:nowrap;
}
.fc-keycap:hover{ border-color:var(--accent); color:var(--accent); }
.fc-keycap.is-binding{ border-color:var(--accent); color:var(--accent); background:var(--accent-soft); animation:fc-pulse 1s ease-in-out infinite; }
@keyframes fc-pulse{ 0%,100%{ opacity:1; } 50%{ opacity:0.5; } }
.fc-shortcut-list{ display:flex; flex-direction:column; gap:5px; margin-top:8px; }
.fc-shortcut-mini{ display:flex; align-items:center; gap:8px; font-size:10.5px; color:var(--mut); transition:color 120ms; }
.fc-shortcut-mini.is-on{ color:var(--accent); }
.fc-keycap-static{ cursor:default; padding:2px 7px; font-size:10px; min-width:22px; text-align:center; transition:background 120ms, color 120ms, border-color 120ms; }
.fc-keycap-static:hover{ border-color:var(--line); color:var(--txt); }
.fc-keycap-static.is-on{ background:var(--accent); color:var(--ink); border-color:var(--accent); box-shadow:0 0 0 2px var(--accent-soft); }
.fc-keycap-static.is-on:hover{ color:var(--ink); border-color:var(--accent); }

/* ---- canvas ---- */
.fc-canvas-head{ padding:11px 16px; border-bottom:1px solid var(--line); display:flex; align-items:baseline; gap:14px; background:var(--panel); }
.fc-canvas-title{ font-family:'Fraunces',Georgia,serif; font-size:15px; }
.fc-canvas-hint{ font-size:10.5px; color:var(--mut); }
.fc-canvas-scroll{
  flex:1; overflow:auto; padding:26px;
  background:radial-gradient(circle at 1px 1px, var(--dot) 1px, transparent 0) 0 0 / 22px 22px;
}

.fc-node{
  border-radius:4px; transition:background 120ms, outline-color 120ms;
  outline:1px solid var(--node-line); background:var(--node); min-width:40px; min-height:40px; cursor:grab;
}
.fc-node.is-container{ outline:1px dashed var(--accent); outline-offset:0; background:var(--accent-soft); min-width:0; min-height:0; }
.fc-node.is-selected{ outline:2px solid var(--accent) !important; outline-offset:1px; background:var(--accent-soft); }
/* When the box-model overlay is on, drop the node's own fill so the green/amber
   bands read cleanly instead of blending into the selection wash. */
.fc-node.fc-bm-active{ background:transparent !important; }
.fc-node-tag{
  position:absolute; top:-9px; left:6px; font-size:9px; letter-spacing:0.5px;
  color:var(--ink); background:var(--accent); padding:1px 6px; border-radius:3px;
  font-weight:700; pointer-events:none; white-space:nowrap; opacity:0.85;
}
.fc-node-text{
  color:var(--mut); font-size:11px; font-family:'Space Mono',monospace;
  pointer-events:none; user-select:none; white-space:nowrap;
}
.fc-node-text.is-editing{
  pointer-events:auto; user-select:text; cursor:text; color:var(--txt);
  outline:2px solid var(--accent); outline-offset:2px; border-radius:3px;
  background:var(--ink); padding:1px 4px; white-space:normal; min-width:1ch;
}
.fc-dropzone{ border-radius:3px; transition:background 80ms, box-shadow 80ms; }
.fc-dropzone.is-active{ background:var(--accent); box-shadow:0 0 12px var(--accent); }

/* ---- resize handles (selected element only) ---- */
.fc-resize{ position:absolute; z-index:30; background:var(--accent); opacity:0; transition:opacity 100ms; touch-action:none; }
.fc-node.is-selected > .fc-resize{ opacity:0.55; }
.fc-node.is-selected > .fc-resize:hover{ opacity:1; }
.fc-resize-r{ top:0; right:-3px; width:6px; height:100%; cursor:ew-resize; border-radius:3px; }
.fc-resize-b{ left:0; bottom:-3px; height:6px; width:100%; cursor:ns-resize; border-radius:3px; }
.fc-resize-br{ right:-4px; bottom:-4px; width:11px; height:11px; cursor:nwse-resize; border-radius:2px; }
.fc-resize-tip{
  background:var(--accent); color:var(--ink); font-family:'Space Mono',monospace;
  font-size:11px; font-weight:700; padding:3px 8px; border-radius:5px;
  white-space:nowrap; box-shadow:0 4px 14px rgba(0,0,0,0.45);
}

/* ---- code drawer ---- */
.fc-code-drawer{ border-top:1px solid var(--line); background:var(--panel); display:flex; flex-direction:column; flex-shrink:0; position:relative; }
.fc-drawer-grip{
  height:11px; flex-shrink:0; cursor:ns-resize; display:flex; align-items:center;
  justify-content:center; touch-action:none; background:var(--panel2);
  border-bottom:1px solid var(--line);
}
.fc-drawer-grip:hover .fc-drawer-grip-bar{ background:var(--accent); }
.fc-drawer-grip-bar{ width:34px; height:3px; border-radius:2px; background:var(--mut); transition:background 100ms; }
.fc-code-inner{ display:flex; flex-direction:column; min-height:0; height:100%; }
.fc-code-tabs{ display:flex; align-items:center; gap:4px; padding:6px 10px; border-bottom:1px solid var(--line); }
.fc-code-tab{ background:transparent; border:none; color:var(--mut); font-family:inherit; font-size:11px; padding:4px 10px; border-radius:4px; cursor:pointer; }
.fc-code-tab.is-active{ background:var(--panel2); color:var(--accent); }
.fc-copy-btn{ background:transparent; border:1px solid var(--line); color:var(--mut); font-family:inherit; font-size:10px; padding:4px 10px; border-radius:4px; cursor:pointer; }
.fc-copy-btn:hover{ border-color:var(--accent); color:var(--accent); }
.fc-code{ margin:0; padding:12px 16px; overflow:auto; min-height:0; font-size:11px; line-height:1.5; color:var(--txt); font-family:inherit; flex:1; }
/* the double-click wrapper around CodeView must be a proper flex child, or it
   grows to fit ALL the code and the <pre> never scrolls (flex min-height:auto
   trap — the vertical sibling of the min-width:0 gotcha). */
.fc-code-viewwrap{ flex:1; min-height:0; display:flex; flex-direction:column; }
/* highlighted block = the currently-selected element's CSS rule / HTML tags.
   MUST be display:inline (not inline-block) so a multi-line rule flows line by
   line inside the <pre>; box-decoration-break:clone then paints the bg+border
   on every wrapped line. inline-block collapses the lines into one box and
   makes adjacent rules overlap/stack. */
.fc-code-hl{
  display:inline; background:var(--accent-soft); color:var(--accent);
  border-left:2px solid var(--accent);
  padding-left:14px; padding-right:6px;
  box-decoration-break:clone; -webkit-box-decoration-break:clone;
}
.fc-code-hl.is-editable{ cursor:text; }
.fc-code-edit{
  display:inline-block; width:calc(100% - 4px); margin-left:-16px;
  background:var(--ink); color:var(--txt); border:1px solid var(--accent);
  border-radius:4px; padding:8px 10px; font-family:inherit; font-size:11px;
  line-height:1.5; resize:vertical; outline:none; box-sizing:border-box;
}
.fc-code-edit-full{
  width:100%; margin:0; flex:1; min-height:120px; border:none; border-radius:0;
  border-top:2px solid var(--accent); resize:none;
}
.fc-copy-btn.is-primary{ background:var(--accent); color:var(--ink); border-color:var(--accent); font-weight:700; }
.fc-code-editnote{ font-size:9.5px; color:var(--mut); margin-right:6px; white-space:nowrap; }

/* ---- props ---- */
.fc-props-inner{ padding:18px; padding-top:32px; min-width:0; max-width:100%; box-sizing:border-box; }
.fc-empty{ color:var(--mut); text-align:center; margin-top:60px; line-height:1.6; padding:20px; }
.fc-empty-mark{ font-size:34px; color:var(--accent); margin-bottom:8px; }
.fc-prop-head{ display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:18px; padding-bottom:12px; border-bottom:1px solid var(--line); }
.fc-prop-title{ font-family:'Fraunces',Georgia,serif; font-size:16px; }
.fc-prop-id{ font-size:10px; color:var(--accent); }
.fc-prop-actions{ display:flex; gap:6px; }
.fc-icon-btn{ width:28px; height:28px; border-radius:5px; cursor:pointer; background:var(--panel2); border:1px solid var(--line); color:var(--txt); font-size:13px; }
.fc-icon-btn:hover{ border-color:var(--accent); color:var(--accent); }
.fc-icon-btn.is-danger:hover{ border-color:#ff6b6b; color:#ff6b6b; }
.fc-section-label{ font-size:10px; text-transform:uppercase; letter-spacing:1.2px; color:var(--mut); margin-bottom:12px; display:flex; align-items:center; gap:8px; }
.fc-tag-pill{ font-size:9px; color:var(--accent); background:var(--accent-soft); padding:1px 6px; border-radius:3px; text-transform:none; }
.fc-convert-btn{ width:100%; background:var(--accent-soft); border:1px solid var(--accent); color:var(--accent); font-family:inherit; font-size:12px; padding:10px; border-radius:6px; cursor:pointer; }

.fc-field{ margin-bottom:16px; min-width:0; max-width:100%; }
.fc-field-label{ display:flex; justify-content:space-between; align-items:center; font-size:10.5px; color:var(--mut); margin-bottom:7px; }
.fc-label-text{ display:inline-flex; align-items:center; gap:6px; }
.fc-reset-dot{
  background:transparent; border:none; color:var(--accent); cursor:pointer;
  font-size:11px; line-height:1; padding:0; opacity:0.85;
}
.fc-reset-dot:hover{ opacity:1; transform:rotate(-45deg); transition:transform 120ms; }
.fc-field-val{ color:var(--accent); }
.fc-bm-tag{
  position:absolute; font-size:8.5px; font-weight:700; padding:1px 4px; border-radius:2px;
  white-space:nowrap; line-height:1.2; pointer-events:none; font-family:'Space Mono',monospace;
}
.fc-bm-tag-padding{ top:1px; left:50%; transform:translateX(-50%); background:rgba(104,211,145,0.9); color:#06281a; }
.fc-bm-tag-margin{ top:-12px; left:50%; transform:translateX(-50%); background:rgba(246,173,85,0.95); color:#3a2300; }

/* ---- gap overlay (violet, devtools convention) ---- */
.fc-gap-band{
  background:
    repeating-linear-gradient(45deg,
      rgba(167,139,250,0.55) 0, rgba(167,139,250,0.55) 4px,
      rgba(167,139,250,0.30) 4px, rgba(167,139,250,0.30) 8px);
  border-radius:1px;
}
/* box-model legend (only while ▣ overlay is on) */
.fc-bm-legend{
  margin-left:auto; display:inline-flex; gap:12px;
  padding:4px 10px; background:var(--panel2); border:1px solid var(--line);
  border-radius:6px; font-size:10px; color:var(--mut); align-items:center;
}
.fc-bm-legend.is-hidden{ visibility:hidden; }
.fc-legend-item{ display:inline-flex; align-items:center; gap:5px; }
.fc-legend-sw{ width:11px; height:11px; border-radius:2px; display:inline-block; }
.fc-legend-sw.sw-pad{ background:rgba(104,211,145,0.8); }
.fc-legend-sw.sw-mar{ background:rgba(246,173,85,0.85); }
.fc-legend-sw.sw-gap{ background:repeating-linear-gradient(45deg, rgba(167,139,250,0.7) 0 3px, rgba(167,139,250,0.35) 3px 6px); }

/* ---- flex-line overlay ---- */
.fc-line-band{
  border:1.5px dashed rgba(120,170,255,0.9);
  border-radius:3px;
  background:rgba(120,170,255,0.08);
}
.fc-line-tag{
  position:absolute; top:-1px; left:-1px; font-size:8.5px; font-weight:700;
  padding:1px 5px; background:rgba(120,170,255,0.95); color:#04122e;
  border-radius:2px 0 3px 0; white-space:nowrap; font-family:'Space Mono',monospace;
}
.fc-axis-arrow{
  top:2px; right:4px; font-size:9px; font-weight:700; letter-spacing:0.5px;
  color:#04122e; background:rgba(120,170,255,0.95); padding:1px 6px; border-radius:3px;
  font-family:'Space Mono',monospace;
}

/* ---- hover tooltip ---- */
.fc-tooltip{
  background:var(--panel2); border:1px solid var(--accent);
  border-radius:7px; padding:8px 10px; min-width:140px; max-width:230px;
  box-shadow:0 6px 24px rgba(0,0,0,0.5); font-family:'Space Mono',monospace;
  font-size:10.5px; line-height:1.5; color:var(--txt);
}
.fc-tip-head{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:3px; }
.fc-tip-dims{ color:var(--accent); font-weight:700; font-size:12px; }
.fc-tip-role{ font-size:9px; text-transform:uppercase; letter-spacing:0.8px; color:var(--mut); }
.fc-tip-sel{ color:var(--mut); font-size:9.5px; margin-bottom:5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.fc-tip-mode{ color:var(--accent); font-size:9px; text-transform:uppercase; letter-spacing:0.6px; margin-bottom:5px; opacity:0.85; }
.fc-tip-row{ color:var(--txt); margin-bottom:3px; }
.fc-tip-box{ display:flex; flex-wrap:wrap; gap:4px 8px; margin-top:4px; padding-top:5px; border-top:1px solid var(--line); color:var(--mut); font-size:9.5px; }
.fc-seg-wrap{ position:relative; display:flex; align-items:center; min-width:0; max-width:100%; }
.fc-segmented{
  display:flex; flex-wrap:nowrap; gap:4px; background:var(--ink); padding:3px;
  border-radius:6px; overflow-x:auto; scroll-behavior:smooth; flex:1; min-width:0;
  scrollbar-width:none; -ms-overflow-style:none;
}
.fc-segmented::-webkit-scrollbar{ display:none; height:0; }
/* edge fades hint that there's more to scroll to in that direction */
.fc-segmented.fade-l{ -webkit-mask-image:linear-gradient(to right, transparent, #000 18px); mask-image:linear-gradient(to right, transparent, #000 18px); }
.fc-segmented.fade-r{ -webkit-mask-image:linear-gradient(to left, transparent, #000 18px); mask-image:linear-gradient(to left, transparent, #000 18px); }
.fc-segmented.fade-l.fade-r{ -webkit-mask-image:linear-gradient(to right, transparent, #000 18px, #000 calc(100% - 18px), transparent); mask-image:linear-gradient(to right, transparent, #000 18px, #000 calc(100% - 18px), transparent); }
.fc-seg-btn{ flex:0 0 auto; background:transparent; border:none; color:var(--mut); font-family:inherit; font-size:10px; padding:6px 9px; border-radius:4px; cursor:pointer; white-space:nowrap; }
.fc-seg-btn.is-active{ background:var(--accent); color:var(--ink); font-weight:700; }
.fc-seg-chev{
  position:absolute; z-index:2; top:50%; transform:translateY(-50%);
  width:16px; height:22px; border:none; border-radius:4px; cursor:pointer;
  background:var(--panel2); color:var(--accent); font-size:13px; line-height:1;
  display:flex; align-items:center; justify-content:center; padding:0;
  box-shadow:0 0 6px rgba(0,0,0,0.4);
}
.fc-seg-chev-l{ left:-2px; }
.fc-seg-chev-r{ right:-2px; }
.fc-num{ width:100%; background:var(--ink); border:1px solid var(--line); color:var(--txt); font-family:inherit; font-size:12px; padding:7px 9px; border-radius:5px; }
.fc-mini-toggle{ background:var(--accent-soft); border:1px solid var(--line); color:var(--mut); font-family:inherit; font-size:9px; padding:2px 7px; border-radius:3px; cursor:pointer; }
.fc-mini-toggle.is-active{ color:var(--accent); }

/* ---- responsive: show/hide desktop vs mobile ---- */
.fc-mobile-only{ display:none; }
.fc-desktop-only{ display:flex; }
.fc-scroll-pane{ flex:1; overflow:auto; }
.fc-tabbar{ display:none; }

@media (max-width: 760px){
  .fc-desktop-only{ display:none !important; }
  .fc-mobile-only{ display:flex; }
  .fc-mobile-pane{ flex:1; flex-direction:column; min-height:0; width:100%; }
  .fc-canvas-wrap{ flex:1; }
  .fc-canvas-scroll{ padding:16px; }
  .fc-props-inner, .fc-palette-inner{ padding:14px; }

  .fc-tabbar{
    display:flex; flex-shrink:0; border-top:1px solid var(--line); background:var(--panel);
  }
  .fc-tabbar-btn{
    flex:1; display:flex; flex-direction:column; align-items:center; gap:3px;
    padding:9px 4px; background:transparent; border:none; color:var(--mut);
    font-family:inherit; font-size:9.5px; cursor:pointer; border-top:2px solid transparent;
  }
  .fc-tabbar-btn.is-active{ color:var(--accent); border-top-color:var(--accent); }
  .fc-tabbar-icon{ font-size:16px; }
}
`;



const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(React.createElement(FlexCraft));
