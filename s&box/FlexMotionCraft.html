// ── MAIN APP ──────────────────────────────────────────────────────────────────
function MotionCraft() {
  const [theme, setTheme]       = useState("dark");
  const [htmlStr, setHtmlStr]   = useState("");
  const [cssStr, setCssStr]     = useState("");
  const [htmlName, setHtmlName] = useState("");
  const [cssName, setCssName]   = useState("");
  const [elements, setElements] = useState([]);
  const [selectedUid, setSelectedUid] = useState(null);
  const [rightTab, setRightTab] = useState("transitions");
  // ── Undo/redo history stack ──────────────────────────────────────────────
  // Each entry is a snapshot of { transitions, keyframeAnims, svgAttrs }.
  // past = array of previous snapshots, future = array of undone snapshots.
  const [past,   setPast]   = useState([]);
  const [future, setFuture] = useState([]);

  const [transitions, setTransitions]     = useState({});
  const [keyframeAnims, setKeyframeAnims] = useState({});
  const [svgAttrs, setSvgAttrs]           = useState({});

  // Snapshot current state before a mutation
  const snapshot = useCallback(() => {
    setPast(p => [...p, { transitions, keyframeAnims, svgAttrs }]);
    setFuture([]); // new change clears redo stack
  }, [transitions, keyframeAnims, svgAttrs]);

  const undo = useCallback(() => {
    setPast(p => {
      if (p.length === 0) return p;
      const prev = p[p.length - 1];
      setFuture(f => [{ transitions, keyframeAnims, svgAttrs }, ...f]);
      setTransitions(prev.transitions);
      setKeyframeAnims(prev.keyframeAnims);
      setSvgAttrs(prev.svgAttrs);
      return p.slice(0, -1);
    });
  }, [transitions, keyframeAnims, svgAttrs]);

  const redo = useCallback(() => {
    setFuture(f => {
      if (f.length === 0) return f;
      const next = f[0];
      setPast(p => [...p, { transitions, keyframeAnims, svgAttrs }]);
      setTransitions(next.transitions);
      setKeyframeAnims(next.keyframeAnims);
      setSvgAttrs(next.svgAttrs);
      return f.slice(1);
    });
  }, [transitions, keyframeAnims, svgAttrs]);
  const [playing, setPlaying]   = useState(0);
  const [showImport, setShowImport] = useState(true);
  const [exported, setExported] = useState(null);
  const [showHelp, setShowHelp] = useState(false);

  // Rule clipboard for copy/paste across elements
  const [ruleClipboard, setRuleClipboard] = useState(null);
  // Keyframe animation clipboard
  const [kfClipboard, setKfClipboard] = useState(null);

  // Canvas background color and opacity controls
  const [canvasBg,      setCanvasBg]      = useState("transparent");
  const [canvasOpacity, setCanvasOpacity] = useState(1);

  // Panel widths — resizable via grip drags
  const [leftWidth,  setLeftWidth]  = useState(200);
  const [rightWidth, setRightWidth] = useState(280);

  // CSS editing state
  const [cssEditing, setCssEditing] = useState(false);
  const [cssDraft,   setCssDraft]   = useState("");

  const selected = useMemo(() =>
    elements.find(e => e.uid === selectedUid) || null,
  [elements, selectedUid]);

  // The class name of the selected element — used to highlight its CSS block
  const selectedClass = selected ? selected.className : null;

  const loadHtml = (str, name) => {
    const { isCombined, bodyHtml, extractedCss } = splitCombinedHtml(str);
    setHtmlStr(bodyHtml);
    setHtmlName(name);
    setElements(parseHtmlElements(bodyHtml));
    setSelectedUid(null);
    if (isCombined && extractedCss) {
      setCssStr(extractedCss);
      setCssName(name.replace(/\.html?$/, ".css"));
    }
    setShowImport(false);
  };

  const loadCss = (str, name) => {
    setCssStr(str);
    setCssName(name);
    setShowImport(false);
  };

  const augmentedCss = useMemo(() =>
    buildAugmentedCss(cssStr, transitions, keyframeAnims),
  [cssStr, transitions, keyframeAnims]);

  const exportFiles = () => {
    const blob = new Blob([augmentedCss], { type: "text/css" });
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement("a");
    a.href     = url;
    a.download = cssName ? cssName.replace(/\.css$/, "") + ".motion.css" : "styles.motion.css";
    a.click();
    URL.revokeObjectURL(url);
    setExported(true);
    setTimeout(() => setExported(null), 2000);
  };

  // ── Panel resize grips ───────────────────────────────────────────────────
  // Use refs for start values so the closure never goes stale mid-drag.
  // setLeftWidth/setRightWidth are stable (React guarantee) so safe to close over.
  const leftWidthRef  = useRef(leftWidth);
  const rightWidthRef = useRef(rightWidth);
  useEffect(() => { leftWidthRef.current  = leftWidth;  }, [leftWidth]);
  useEffect(() => { rightWidthRef.current = rightWidth; }, [rightWidth]);

  // Suppress text selection across the whole page during any drag
  const lockSelect   = () => { document.body.style.userSelect = "none"; };
  const unlockSelect = () => { document.body.style.userSelect = ""; document.body.style.cursor = ""; };

  const startLeftResize = useCallback((e) => {
    e.preventDefault();
    e.currentTarget.setPointerCapture(e.pointerId); // keep events even over iframe
    lockSelect();
    const startX = e.clientX;
    const startW = leftWidthRef.current;
    const onMove = ev => setLeftWidth(Math.min(420, Math.max(140, Math.round(startW + (ev.clientX - startX)))));
    const onUp   = () => { unlockSelect(); window.removeEventListener("pointermove", onMove); window.removeEventListener("pointerup", onUp); };
    window.addEventListener("pointermove", onMove);
    window.addEventListener("pointerup",   onUp);
  }, []);

  const startRightResize = useCallback((e) => {
    e.preventDefault();
    e.currentTarget.setPointerCapture(e.pointerId); // keep events even over iframe
    lockSelect();
    const startX = e.clientX;
    const startW = rightWidthRef.current;
    const onMove = ev => setRightWidth(Math.min(520, Math.max(200, Math.round(startW - (ev.clientX - startX)))));
    const onUp   = () => { unlockSelect(); window.removeEventListener("pointermove", onMove); window.removeEventListener("pointerup", onUp); };
    window.addEventListener("pointermove", onMove);
    window.addEventListener("pointerup",   onUp);
  }, []);

  // ── CSS panel vertical resize ─────────────────────────────────────────────
  const [cssHeight, setCssHeight] = useState(200);
  const cssHeightRef = useRef(200);
  useEffect(() => { cssHeightRef.current = cssHeight; }, [cssHeight]);

  const startCssResize = useCallback((e) => {
    e.preventDefault();
    e.currentTarget.setPointerCapture(e.pointerId); // keep events even over iframe
    lockSelect();
    document.body.style.cursor = "ns-resize";
    const startY = e.clientY;
    const startH = cssHeightRef.current;
    const onMove = ev => setCssHeight(Math.min(600, Math.max(80, Math.round(startH - (ev.clientY - startY)))));
    const onUp   = () => { unlockSelect(); window.removeEventListener("pointermove", onMove); window.removeEventListener("pointerup", onUp); };
    window.addEventListener("pointermove", onMove);
    window.addEventListener("pointerup",   onUp);
  }, []);

  // ── CSS edit ──────────────────────────────────────────────────────────────
  const beginCssEdit  = () => { setCssDraft(augmentedCss); setCssEditing(true); };
  const cancelCssEdit = () => setCssEditing(false);
  const applyCssEdit  = () => {
    // Split draft back into base CSS and MotionCraft additions
    const marker = "/* ── MotionCraft additions ── */";
    const idx = cssDraft.indexOf(marker);
    if (idx !== -1) {
      setCssStr(cssDraft.slice(0, idx).trim());
    } else {
      setCssStr(cssDraft.trim());
    }
    setCssEditing(false);
  };

  // ── Highlight selected element in preview via postMessage ─────────────────
  // We inject a tiny script into the iframe that listens for a class name and
  // outlines the matching element. Uses allow-scripts sandbox permission.
  const iframeRef = useRef(null);
  // Keyboard shortcuts: undo/redo + Escape clears rule clipboard
  useEffect(() => {
    const handler = (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key === "z" && !e.shiftKey) { e.preventDefault(); undo(); }
      if ((e.ctrlKey || e.metaKey) && (e.key === "y" || (e.key === "z" && e.shiftKey))) { e.preventDefault(); redo(); }
      if (e.key === "Escape" && ruleClipboard) { setRuleClipboard(null); }
      if (e.key === "Escape" && kfClipboard) { setKfClipboard(null); }
      if (e.key === "Escape") { setShowHelp(false); }
    };
    window.addEventListener("keydown", handler);
    return () => window.removeEventListener("keydown", handler);
  }, [undo, redo, ruleClipboard]);

  // Send selection highlight into iframe whenever selected element changes.
  // Also store the class on the iframe node so onLoad can re-apply it after replays.
  useEffect(() => {
    if (!iframeRef.current) return;
    const sel = selected ? selected.className.trim().split(/\s+/)[0] : null;
    iframeRef.current._mcSelectedClass = sel;
    try {
      iframeRef.current.contentWindow.postMessage({ type: "mc-select", className: sel }, "*");
    } catch(e) {}
  }, [selected]);

  // Listen for clicks from inside the iframe — select matching element in tree
  useEffect(() => {
    const handler = (e) => {
      if (!e.data || e.data.type !== "mc-click") return;
      const cls = e.data.className;
      if (!cls) return;
      // Find element in tree whose className contains any of the clicked classes
      const clickedClasses = cls.split(/\s+/);
      const match = elements.find(el =>
        el.className && clickedClasses.some(c => el.className.split(/\s+/).includes(c))
      );
      if (match) setSelectedUid(match.uid);
    };
    window.addEventListener("message", handler);
    return () => window.removeEventListener("message", handler);
  }, [elements]);

  const setTransition  = (uid, t)     => { snapshot(); setTransitions(prev => ({ ...prev, [uid]: t })); };
  const addKeyframe    = (id, anim)   => { snapshot(); setKeyframeAnims(prev => ({ ...prev, [id]: anim })); };
  const updateKeyframe = (id, anim)   => { snapshot(); setKeyframeAnims(prev => ({ ...prev, [id]: anim })); };
  const removeKeyframe = id           => { snapshot(); setKeyframeAnims(prev => { const n = {...prev}; delete n[id]; return n; }); };
  const setSvgAttr     = (uid, attrs) => { snapshot(); setSvgAttrs(prev => ({ ...prev, [uid]: attrs })); };

  return (
    <div className={"mc-app mc-theme-" + theme}>
      {/* TOOLBAR */}
      <div className="mc-toolbar">
        <div className="mc-brand">
          <span className="mc-brand-mark">◈</span>
          <span className="mc-brand-name">FlexMotionCraft</span>
          <span className="mc-brand-sub">animation designer</span>
        </div>
        <div className="mc-toolbar-center">
          {(htmlStr || cssStr) && (
            <div className="mc-file-pills">
              {htmlStr && <span className="mc-file-pill mc-pill-html">{htmlName || "document.html"}</span>}
              {cssStr  && <span className="mc-file-pill mc-pill-css">{cssName  || "styles.css"}</span>}
            </div>
          )}
        </div>
        <div className="mc-toolbar-actions">
          <button className="mc-tool-btn" title="Import files" onClick={() => setShowImport(s => !s)}>⬆</button>
          <button className="mc-tool-btn" title="Undo (Ctrl+Z)" onClick={undo} disabled={past.length === 0}>↩</button>
          <button className="mc-tool-btn" title="Redo (Ctrl+Y)" onClick={redo} disabled={future.length === 0}>↪</button>
          <button className="mc-tool-btn" title="Play / replay animations"
            onClick={() => setPlaying(p => p + 1)}>▶</button>
          <button className="mc-tool-btn" title="Export augmented CSS" onClick={exportFiles}
            style={exported ? { background:"var(--accent)", color:"var(--ink)" } : {}}
          >{exported ? "✓" : "⬇"}</button>
          <button className="mc-tool-btn" title="Help / Reference" onClick={() => setShowHelp(true)}>?</button>
          <button className="mc-tool-btn" title="Toggle light/dark"
            onClick={() => setTheme(t => t === "dark" ? "light" : "dark")}>
            {theme === "dark" ? "☀" : "☾"}
          </button>
        </div>
      </div>

      {/* HELP MODAL */}
      {showHelp && <HelpModal onClose={() => setShowHelp(false)} />}

      {/* IMPORT OVERLAY */}
      {showImport && (
        <div className="mc-import-overlay">
          <div className="mc-import-card">
            <div className="mc-import-title">Import files</div>
            <div className="mc-import-callout">
              ✦ Drop your <strong>FlexCraft export</strong> (.html) — CSS is extracted automatically.
            </div>
            <div className="mc-import-row">
              <FileDropZone label="HTML file (or FlexCraft export)" accept=".html,.htm" onLoad={loadHtml} />
              <FileDropZone label="CSS file (optional — if separate)" accept=".css" onLoad={loadCss} />
            </div>
            <div className="mc-import-hint">
              FlexCraft exports one combined .html file — just drop that.<br/>
              For other projects, drop HTML + CSS separately.
            </div>
            {(htmlStr || cssStr) && (
              <button className="mc-import-close" onClick={() => setShowImport(false)}>
                Continue →
              </button>
            )}
          </div>
        </div>
      )}

      {/* BODY */}
      <div className="mc-body">

        {/* LEFT — element tree, resizable */}
        <div className="mc-left" style={{ width: leftWidth }}>
          <div className="mc-panel-head">Elements</div>
          <ElementTree elements={elements} selectedUid={selectedUid} onSelect={setSelectedUid} />
          {/* right-edge grip */}
          <div className="mc-panel-grip mc-grip-right" onPointerDown={startLeftResize} title="Drag to resize" />
        </div>

        {/* CENTER — preview canvas */}
        <div className="mc-center">
          <div className="mc-canvas-toolbar">
            <span className="mc-canvas-title">Preview</span>
            <div className="mc-canvas-controls">
              <label className="mc-canvas-ctrl-label" title="Canvas background color">bg</label>
              <input type="color" className="mc-canvas-color"
                value={canvasBg === "transparent" ? "#1b1f2a" : canvasBg}
                onChange={e => setCanvasBg(e.target.value)}
              />
              <button className="mc-canvas-transp"
                title="Toggle transparent background"
                onClick={() => setCanvasBg(c => c === "transparent" ? "#1b1f2a" : "transparent")}
              >{canvasBg === "transparent" ? "⬜ transparent" : "◼ color"}</button>
              <label className="mc-canvas-ctrl-label">opacity</label>
              <input type="range" className="mc-range mc-canvas-opacity"
                min={0} max={1} step={0.05} value={canvasOpacity}
                onChange={e => setCanvasOpacity(Number(e.target.value))}
                title={"Opacity: " + canvasOpacity}
              />
              <span className="mc-canvas-ctrl-val">{Math.round(canvasOpacity * 100)}%</span>
            </div>
            <div style={{display:"flex",gap:6}}>
              <button className="mc-play-btn" onClick={() => setPlaying(p => p + 1)}
                title="Replay animations">▶ Play</button>
              <button className="mc-play-btn mc-pause-btn"
                title="Toggle pause all animations in preview"
                onClick={() => {
                  try {
                    const iw = iframeRef.current && iframeRef.current.contentWindow;
                    if (iw) iw.postMessage({ type: "mc-playpause" }, "*");
                  } catch(e) {}
                }}>⏸ Pause</button>
            </div>
          </div>
          <div className="mc-canvas-wrap">
            <PreviewCanvas
              htmlStr={htmlStr} cssStr={cssStr}
              augmentedCss={augmentedCss}
              playing={playing}
              iframeRef={iframeRef}
              selectedClass={selectedClass}
              canvasBg={canvasBg}
              canvasOpacity={canvasOpacity}
            />
          </div>

          {/* CSS PANEL — lives in center, vertically resizable */}
          <div className="mc-css-preview" style={{ height: cssHeight }}>
            <div className="mc-drawer-grip" onPointerDown={startCssResize} title="Drag to resize">
              <div className="mc-drawer-grip-bar" />
            </div>
            <div className="mc-css-preview-hd">
              <span>Generated CSS</span>
              <div style={{ display:"flex", gap:5 }}>
                {cssEditing ? (
                  <>
                    <span className="mc-edit-note">⌘↵ apply · esc cancel</span>
                    <button className="mc-copy-btn" onClick={cancelCssEdit}>cancel</button>
                    <button className="mc-copy-btn mc-copy-primary" onClick={applyCssEdit}>apply</button>
                  </>
                ) : (
                  <>
                    <button className="mc-copy-btn" onClick={() => navigator.clipboard?.writeText(augmentedCss)}>copy</button>
                    <button className="mc-copy-btn" onClick={beginCssEdit} title="Edit CSS directly">✎ edit</button>
                  </>
                )}
              </div>
            </div>
            {cssEditing ? (
              <textarea className="mc-css-edit"
                value={cssDraft}
                autoFocus
                spellCheck={false}
                onChange={e => setCssDraft(e.target.value)}
                onKeyDown={e => {
                  if (e.key === "Escape") { e.preventDefault(); cancelCssEdit(); }
                  if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) { e.preventDefault(); applyCssEdit(); }
                  e.stopPropagation();
                }}
              />
            ) : (
              <CssCodeView
                cssText={augmentedCss}
                selectedClass={selectedClass}
                onEdit={beginCssEdit}
                onLoadRules={rules => {
                  if (!selected) return;
                  const cur = Array.isArray(transitions[selected.uid]) ? transitions[selected.uid] : [];
                  setTransition(selected.uid, [...cur, ...rules]);
                  setRightTab("transitions");
                }}
              />
            )}
          </div>
        </div>

        {/* RIGHT — designer, resizable */}
        <div className="mc-right" style={{ width: rightWidth }}>
          {/* left-edge grip */}
          <div className="mc-panel-grip mc-grip-left" onPointerDown={startRightResize} title="Drag to resize" />

          <div className="mc-right-tabs">
            {[
              { k: "transitions", label: "Transitions" },
              { k: "keyframes",   label: "Keyframes" },
              { k: "svg",         label: "SVG" },
            ].map(t => (
              <button key={t.k}
                className={"mc-rtab" + (rightTab === t.k ? " is-active" : "")}
                onClick={() => setRightTab(t.k)}
              >{t.label}</button>
            ))}
          </div>

          <div className="mc-right-body">
            {rightTab === "transitions" && (
              <TransitionsPanel selected={selected} transitions={transitions} onChange={setTransition} elements={elements} clipboard={ruleClipboard} setClipboard={setRuleClipboard} />
            )}
            {rightTab === "keyframes" && (
              <KeyframesPanel selected={selected} keyframeAnims={keyframeAnims}
                onAdd={addKeyframe} onUpdate={updateKeyframe} onRemove={removeKeyframe} elements={elements}
                kfClipboard={kfClipboard} setKfClipboard={setKfClipboard} />
            )}
            {rightTab === "svg" && (
              <SvgPanel selected={selected} svgAttrs={svgAttrs} onChange={setSvgAttr} />
            )}
          </div>
        </div>

      </div>
    </div>
  );
}

// ── STYLES ────────────────────────────────────────────────────────────────────
const css = `

  display:flex; flex-direction:column; overflow:hidden;

/* ── CENTER ── */

.mc-canvas-toolbar {
  display:flex; align-items:center; justify-content:space-between;
  padding:8px 14px; background:var(--panel); border-bottom:1px solid var(--line); flex-shrink:0;
}
.mc-canvas-title { font-family:'Fraunces',Georgia,serif; font-size:13px; }
.mc-play-btn {
  padding:4px 14px; background:var(--accent); color:var(--ink); border:none;
  border-radius:5px; cursor:pointer; font-family:inherit; font-size:11px; font-weight:700;
  transition: opacity 120ms;
}
.mc-play-btn:hover { opacity:0.85; }
.mc-canvas-wrap { flex:1; min-height:0; background:var(--panel2); overflow:hidden; position:relative; }
.mc-iframe { width:100%; height:100%; border:none; display:block; }
.mc-canvas-empty {
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  height:100%; color:var(--mut); text-align:center; line-height:1.7;
}
.mc-canvas-empty-icon { font-size:36px; color:var(--accent); margin-bottom:10px; }

/* ── RIGHT PANEL ── */
.mc-right {
  flex-shrink:0; background:var(--panel);
  display:flex; flex-direction:column; overflow:hidden;
}
.mc-right-tabs {
  display:flex; border-bottom:1px solid var(--line); flex-shrink:0;
}
.mc-rtab {
  flex:1; padding:9px 4px; background:transparent; border:none; border-bottom:2px solid transparent;
  color:var(--mut); font-family:inherit; font-size:11px; cursor:pointer;
  transition: color 120ms, border-color 120ms;
}
.mc-rtab:hover { color:var(--txt); }
.mc-rtab.is-active { color:var(--accent); border-bottom-color:var(--accent); }
.mc-right-body { flex:1; overflow-y:auto; padding:14px; min-height:0; }

/* ── CSS PREVIEW (bottom of right) ── */
.mc-css-preview {
  border-top:2px solid var(--line); flex-shrink:0;
  display:flex; flex-direction:column; min-height:80px;
}
.mc-css-preview-hd {
  display:flex; align-items:center; justify-content:space-between;
  padding:6px 12px; border-bottom:1px solid var(--line); flex-shrink:0;
  font-size:10px; text-transform:uppercase; letter-spacing:1px; color:var(--mut);
}
.mc-copy-btn {
  background:transparent; border:1px solid var(--line); color:var(--mut);
  font-family:inherit; font-size:10px; padding:2px 8px; border-radius:3px; cursor:pointer;
}
.mc-copy-btn:hover { border-color:var(--accent); color:var(--accent); }
.mc-css-code {
  margin:0; padding:10px 12px; overflow:auto; font-size:10px; line-height:1.6;
  color:var(--txt); font-family:inherit; flex:1;
}

/* ── CONTROLS ── */
.mc-field { margin-bottom:14px; }
.mc-field-label { font-size:10.5px; color:var(--mut); margin-bottom:6px; display:flex; justify-content:space-between; }
.mc-field-val { color:var(--accent); }
.mc-range {
  -webkit-appearance:none; appearance:none; width:100%; height:4px;
  border-radius:4px; background:var(--track); cursor:pointer;
}
.mc-range::-webkit-slider-thumb {
  -webkit-appearance:none; width:14px; height:14px; border-radius:50%;
  background:var(--accent); cursor:pointer; box-shadow:0 0 0 3px var(--accent-soft);
}
.mc-range::-moz-range-thumb {
  width:14px; height:14px; border:none; border-radius:50%;
  background:var(--accent); cursor:pointer;
}
.mc-select {
  width:100%; background:var(--ink); border:1px solid var(--line); color:var(--txt);
  font-family:inherit; font-size:11px; padding:6px 8px; border-radius:5px; cursor:pointer;
}
.mc-text-input {
  width:100%; background:var(--ink); border:1px solid var(--line); color:var(--txt);
  font-family:inherit; font-size:11px; padding:6px 8px; border-radius:5px;
}
.mc-text-input:focus, .mc-select:focus {
  outline:none; border-color:var(--accent);
}
.mc-segmented { display:flex; gap:3px; background:var(--ink); padding:3px; border-radius:6px; }
.mc-seg-btn {
  flex:1; background:transparent; border:none; color:var(--mut);
  font-family:inherit; font-size:10px; padding:5px 4px; border-radius:4px; cursor:pointer;
}
.mc-seg-btn.is-active { background:var(--accent); color:var(--ink); font-weight:700; }

/* ── SECTION ── */
.mc-section { border-bottom:1px solid var(--line); }
.mc-section-first { border-top:1px solid var(--line); }
.mc-section-hd {
  width:100%; display:flex; align-items:center; gap:8px; padding:10px 14px;
  background:transparent; border:none; color:var(--txt); font-family:inherit;
  font-size:11px; cursor:pointer; text-align:left;
}
.mc-section-hd:hover { background:var(--node); }
.mc-section-arrow { color:var(--accent); font-size:9px; }
.mc-section-body { padding:14px; }

/* ── ANIMATION CARDS ── */
.mc-anim-card {
  background:var(--panel2); border:1px solid var(--line); border-radius:6px;
  margin-bottom:10px; overflow:hidden;
}
.mc-anim-card-hd {
  display:flex; align-items:center; gap:8px; padding:9px 12px; cursor:pointer;
}
.mc-anim-card-hd:hover { background:var(--node); }
.mc-anim-arrow { color:var(--accent); font-size:9px; flex-shrink:0; }
.mc-anim-name { flex:1; font-size:11px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.mc-anim-del {
  background:transparent; border:none; color:var(--mut); cursor:pointer;
  font-size:11px; padding:2px 4px; flex-shrink:0;
}
.mc-anim-del:hover { color:#ff6b6b; }
.mc-anim-body { padding:12px; border-top:1px solid var(--line); }

/* ── STOPS ── */
.mc-stops-head {
  display:flex; align-items:center; justify-content:space-between;
  font-size:10px; text-transform:uppercase; letter-spacing:1px; color:var(--mut);
  margin:14px 0 8px;
}
.mc-add-stop-btn {
  background:transparent; border:1px solid var(--line); color:var(--mut);
  font-family:inherit; font-size:10px; padding:2px 8px; border-radius:3px; cursor:pointer;
}
.mc-add-stop-btn:hover { border-color:var(--accent); color:var(--accent); }
.mc-stop {
  background:var(--ink); border:1px solid var(--line); border-radius:5px;
  padding:10px; margin-bottom:8px;
}
.mc-stop-hd { display:flex; align-items:center; gap:8px; margin-bottom:8px; }
.mc-stop-pct { font-size:11px; color:var(--accent); width:30px; flex-shrink:0; }
.mc-stop-range { flex:1; }
.mc-stop-del {
  background:transparent; border:none; color:var(--mut); cursor:pointer; font-size:10px; padding:2px;
}
.mc-stop-del:hover { color:#ff6b6b; }
.mc-stop-props { display:flex; flex-direction:column; gap:5px; }
.mc-stop-prop-row { display:flex; align-items:center; gap:5px; }
.mc-prop-name { font-size:10px; color:var(--accent); flex-shrink:0; min-width:90px; overflow:hidden; text-overflow:ellipsis; }
.mc-prop-val { flex:1; }
.mc-add-prop-row { display:flex; align-items:center; gap:5px; margin-top:4px; }
.mc-prop-sel { flex:1; }
.mc-add-prop-btn {
  width:26px; height:26px; background:var(--accent-soft); border:1px solid var(--accent);
  color:var(--accent); border-radius:4px; cursor:pointer; font-size:14px; flex-shrink:0;
}

/* ── SVG ── */
.mc-svg-grid { display:flex; flex-direction:column; gap:6px; }
.mc-svg-row { display:flex; align-items:center; gap:8px; }
.mc-svg-val { flex:1; }

/* ── MISC ── */
.mc-empty {
  color:var(--mut); text-align:center; padding:30px 16px; line-height:1.7; font-size:11px;
}
.mc-empty-icon { font-size:28px; color:var(--accent); margin-bottom:8px; }
.mc-panel-intro {
  font-size:11px; color:var(--mut); margin-bottom:14px;
  padding-bottom:10px; border-bottom:1px solid var(--line); line-height:1.6;
}
.mc-code-inline {
  background:var(--accent-soft); color:var(--accent); padding:1px 5px; border-radius:3px;
}
.mc-hint { font-size:10.5px; color:var(--mut); line-height:1.6; }
.mc-add-btn {
  width:100%; padding:9px; background:var(--accent-soft); border:1px solid var(--accent);
  color:var(--accent); font-family:inherit; font-size:11px; border-radius:5px;
  cursor:pointer; margin-bottom:14px;
}
.mc-add-btn:hover { background:var(--accent); color:var(--ink); }
.mc-pill-btn {
  padding:4px 10px; background:var(--panel2); border:1px solid var(--line);
  color:var(--mut); font-family:inherit; font-size:12px; border-radius:4px; cursor:pointer;
}
.mc-pill-btn.is-on { background:var(--accent-soft); border-color:var(--accent); color:var(--accent); }

/* ── EASING CURVE ── */
.mc-easing-preview { margin-top:8px; margin-bottom:14px; }
.mc-easing-label { font-size:10px; color:var(--mut); margin-bottom:6px; }
.mc-curve-svg { display:block; background:var(--ink); border:1px solid var(--line); border-radius:6px; }

.mc-tool-btn:disabled { opacity:0.3; cursor:default; pointer-events:none; }

/* ── RULE STATES: disabled + locked ── */
.mc-rule-disabled { opacity:0.6; }
.mc-rule-disabled .mc-anim-card-hd { border-left:3px solid var(--mut); }
.mc-rule-locked   .mc-anim-card-hd { border-left:3px solid var(--accent); }
.mc-rule-icon-btn {
  background:transparent; border:1px solid var(--line); color:var(--mut);
  font-size:11px; padding:2px 5px; border-radius:3px; cursor:pointer; flex-shrink:0;
  transition: color 100ms, border-color 100ms;
}
.mc-rule-icon-btn:hover { border-color:var(--accent); color:var(--accent); }
.mc-rule-icon-btn.is-on { background:var(--accent-soft); color:var(--accent); border-color:var(--accent); }
.mc-rule-icon-btn.is-locked { background:rgba(232,176,75,0.2); border-color:var(--accent); }

/* ── HELP MODAL ── */
.mc-help-overlay {
  position:fixed; inset:0; background:rgba(0,0,0,0.7); z-index:200;
  display:flex; align-items:center; justify-content:center;
  backdrop-filter:blur(4px);
}
.mc-help-modal {
  background:var(--panel); border:1px solid var(--line); border-radius:12px;
  width:680px; max-width:92vw; max-height:82vh; display:flex; flex-direction:column;
  overflow:hidden; box-shadow:0 24px 60px rgba(0,0,0,0.5);
}
.mc-help-header {
  display:flex; align-items:center; justify-content:space-between;
  padding:16px 20px; border-bottom:1px solid var(--line); flex-shrink:0;
}
.mc-help-title {
  font-family:'Fraunces',Georgia,serif; font-size:16px; color:var(--txt);
}
.mc-help-close {
  background:transparent; border:none; color:var(--mut); cursor:pointer;
  font-size:16px; padding:4px 8px; border-radius:4px;
}
.mc-help-close:hover { color:var(--txt); }
.mc-help-body { display:flex; flex:1; min-height:0; overflow:hidden; }
.mc-help-nav {
  width:160px; flex-shrink:0; border-right:1px solid var(--line);
  display:flex; flex-direction:column; padding:8px 0; overflow-y:auto;
}
.mc-help-nav-btn {
  text-align:left; background:transparent; border:none; color:var(--mut);
  font-family:inherit; font-size:11px; padding:8px 16px; cursor:pointer;
  border-right:2px solid transparent; transition: color 100ms, background 100ms;
}
.mc-help-nav-btn:hover { color:var(--txt); background:var(--node); }
.mc-help-nav-btn.is-active { color:var(--accent); border-right-color:var(--accent); background:var(--accent-soft); }
.mc-help-content { flex:1; overflow-y:auto; padding:16px 20px; }
.mc-help-section-title {
  font-family:'Fraunces',Georgia,serif; font-size:14px; color:var(--accent);
  margin-bottom:16px; padding-bottom:8px; border-bottom:1px solid var(--accent-soft);
}
.mc-help-item { margin-bottom:16px; }
.mc-help-term {
  display:inline-block; background:var(--accent-soft); color:var(--accent);
  padding:2px 8px; border-radius:4px; font-size:11px; margin-bottom:5px;
}
.mc-help-def { font-size:11.5px; color:var(--mut); line-height:1.7; margin:0; }
.mc-help-footer {
  padding:10px 20px; border-top:1px solid var(--line); flex-shrink:0;
  font-size:10px; color:var(--mut); text-align:center;
}

/* ── RULE COPY / PASTE ── */
.mc-trans-actions { display:flex; gap:8px; align-items:center; margin-bottom:14px; }
.mc-add-btn-inline {
  flex:1; margin-bottom:0; padding:7px;
}
.mc-rule-copy-btn {
  background:transparent; border:none; color:var(--mut); cursor:pointer;
  font-size:13px; padding:2px 5px; border-radius:3px; flex-shrink:0;
  transition: color 100ms;
}
.mc-rule-copy-btn:hover { color:var(--accent); }
.mc-paste-btn {
  flex-shrink:0; padding:5px 10px; background:var(--accent-soft);
  border:1px dashed var(--accent); color:var(--accent); border-radius:5px;
  cursor:pointer; font-family:inherit; font-size:10px;
  transition: background 120ms;
}
.mc-paste-btn:hover { background:var(--accent); color:var(--ink); }
.mc-paste-hint { font-weight:700; }

/* ── TWO-STATE EDITOR ── */
.mc-two-state {
  display:flex; align-items:flex-start; gap:8px; margin-bottom:14px;
  background:var(--ink); border:1px solid var(--line); border-radius:6px; padding:10px 8px;
}
.mc-state-col { flex:1; min-width:0; }
.mc-state-label {
  font-size:9.5px; text-transform:uppercase; letter-spacing:1px; color:var(--mut);
  margin-bottom:6px;
}
.mc-state-arrow {
  font-size:16px; color:var(--accent); align-self:center; flex-shrink:0; padding-top:14px;
}

/* ── TRANSFORM GROUPS ── */
.mc-transform-group { margin-bottom:10px; }
.mc-transform-group-label {
  font-size:9px; text-transform:uppercase; letter-spacing:1.5px;
  color:var(--accent); margin-bottom:4px; padding-bottom:3px;
  border-bottom:1px solid var(--accent-soft);
}

/* ── CUBIC-BEZIER / STEPS CUSTOM EDITOR ── */
.mc-cb-editor {
  background:var(--ink); border:1px solid var(--line); border-radius:6px;
  padding:10px; margin-top:8px;
}
.mc-cb-title {
  font-size:9.5px; color:var(--accent); text-transform:uppercase;
  letter-spacing:1px; margin-bottom:8px;
}
.mc-cb-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:10px; }
.mc-steps-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:8px; }
.mc-cb-field { display:flex; flex-direction:column; gap:4px; }
.mc-cb-label { font-size:10px; color:var(--mut); }
.mc-cb-input { padding:4px 6px !important; }
.mc-cb-preview { display:flex; align-items:center; gap:10px; }
.mc-cb-value  { font-size:9.5px; color:var(--mut); font-family:inherit; }

/* ── PAUSE BUTTON ── */
.mc-pause-btn { background:var(--panel2) !important; color:var(--mut) !important; }
.mc-pause-btn:hover { opacity:0.85; background:var(--track) !important; }

/* ── PROP VALUE EDITOR ── */
.mc-prop-value-row { display:flex; align-items:center; gap:8px; }
.mc-transform-grid { display:flex; flex-direction:column; gap:6px; margin-top:4px; }
.mc-transform-row  { display:flex; align-items:center; gap:8px; }
.mc-transform-label { font-size:10px; color:var(--mut); width:52px; flex-shrink:0; }

/* Clickable MotionCraft CSS rule lines */
.mc-css-mc-rule {
  cursor:pointer; border-radius:3px; display:block;
  transition: background 100ms;
}
.mc-css-mc-rule:hover { background:var(--accent-soft); outline:1px solid var(--accent); }

/* ── RESET BUTTONS ── */
.mc-reset-btn {
  background:transparent; border:none; color:var(--mut); cursor:pointer;
  font-size:11px; padding:1px 4px; border-radius:3px; line-height:1;
  transition: color 100ms;
}
.mc-reset-btn:hover { color:var(--accent); }
.mc-reset-all-btn {
  background:transparent; border:1px solid var(--line); color:var(--mut);
  cursor:pointer; font-family:inherit; font-size:10px; padding:2px 7px;
  border-radius:3px; float:right; transition: color 100ms, border-color 100ms;
}
.mc-reset-all-btn:hover { color:var(--accent); border-color:var(--accent); }
.mc-field-row {
  display:flex; align-items:center; justify-content:space-between; width:100%;
}

/* ── PANEL RESIZE GRIP ── */
.mc-panel-grip {
  position:absolute; top:0; bottom:0; width:6px; cursor:ew-resize; z-index:10;
  touch-action:none;
  background:var(--line);
  transition: background 120ms;
}
.mc-panel-grip:hover, .mc-panel-grip:active {
  background:var(--accent);
}
.mc-grip-right { right:0; }
.mc-grip-left  { left:0; }

/* ── CSS CODE VIEW ── */
.mc-css-code-view { cursor:text; }
.mc-css-hl { background:var(--accent-soft); border-radius:3px; outline:1px solid var(--accent); }
.mc-css-mut { color:var(--mut); }

/* ── CSS EDIT TEXTAREA ── */
.mc-css-edit {
  flex:1; width:100%; min-height:0; margin:0; padding:10px 12px;
  background:var(--ink); border:none; border-top:1px solid var(--accent);
  color:var(--txt); font-family:'Space Mono',ui-monospace,monospace;
  font-size:10px; line-height:1.6; resize:none; outline:none;
}
.mc-edit-note { font-size:9.5px; color:var(--mut); white-space:nowrap; align-self:center; }
.mc-copy-primary { background:var(--accent); color:var(--ink); border-color:var(--accent); }

/* ── LEFT/RIGHT panels need position:relative for grip positioning ── */
.mc-left  { position:relative; }
.mc-right { position:relative; }


/* ── DRAWER GRIP (vertical resize of CSS panel) ── */
.mc-drawer-grip {
  display:flex; justify-content:center; align-items:center;
  height:8px; cursor:ns-resize; flex-shrink:0;
  background:var(--line); transition: background 120ms;
}
.mc-drawer-grip:hover, .mc-drawer-grip:active { background:var(--accent); }
.mc-drawer-grip-bar { width:34px; height:3px; border-radius:2px; background:var(--mut); transition:background 100ms; }
.mc-drawer-grip:hover .mc-drawer-grip-bar { background:var(--ink); }

/* ── CANVAS CONTROLS ── */
.mc-canvas-controls {
  display:flex; align-items:center; gap:8px; flex:1;
  padding:0 12px; font-size:10.5px;
}
.mc-canvas-ctrl-label { color:var(--mut); flex-shrink:0; }
.mc-canvas-ctrl-val   { color:var(--accent); font-size:10px; min-width:28px; }
.mc-canvas-color {
  width:22px; height:22px; border:1px solid var(--line); border-radius:4px;
  padding:0; cursor:pointer; background:none; flex-shrink:0;
}
.mc-canvas-transp {
  background:var(--panel2); border:1px solid var(--line); color:var(--mut);
  font-family:inherit; font-size:10px; padding:3px 8px; border-radius:4px;
  cursor:pointer; white-space:nowrap; flex-shrink:0;
}
.mc-canvas-transp:hover { border-color:var(--accent); color:var(--accent); }
.mc-canvas-opacity { width:80px; flex-shrink:0; }

.mc-app ::-webkit-scrollbar { width:8px; height:8px; }
.mc-app ::-webkit-scrollbar-thumb { background:var(--track); border-radius:6px; }
.mc-app ::-webkit-scrollbar-track { background:transparent; }
`;

// Inject styles
const styleEl = document.createElement("style");
styleEl.textContent = css;
document.head.appendChild(styleEl);

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<MotionCraft />);
</script>
</body>
</html>
