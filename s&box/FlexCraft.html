<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>FlexCraft — flexbox WYSIWYG editor</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #0d0f14; }
  #root { height: 100%; }
  /* boot message shown until React mounts / if scripts fail to load */
  #boot {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    font-family: ui-monospace, monospace; color: #8b91a3; font-size: 13px; text-align: center;
    padding: 24px; line-height: 1.6;
  }
</style>
<!-- React + ReactDOM (development builds: readable errors) from CDN -->
<script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<!-- Babel Standalone: compiles the JSX below in-browser -->
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
<div id="root"></div>
<div id="boot">Loading FlexCraft&hellip;<br/><span style="font-size:11px">(needs internet on first load to fetch React from a CDN)</span></div>

<script type="text/babel" data-presets="react">
// Remove the boot message once this script begins executing.
document.getElementById('boot').remove();

const { useState, useRef, useCallback, useMemo, useEffect } = React;


/* ============================================================================
   FlexCraft v2 — a flexbox-first WYSIWYG layout editor
   ----------------------------------------------------------------------------
   New since v1:
     · CSS-variable theming + light/dark toggle (colors live in :root, not JS)
     · Mobile-responsive shell: 3-pane on desktop, tabbed single-pane on phones
     · Undo / redo via an immutable history stack (cheap — tree is already
       immutable, so we just keep past/future arrays of snapshots)
     · Duplicate element (deep clone with fresh ids)
     · width / height / margin controls (not just padding)

   Document model is unchanged: a tree of { id, tag, label, styles:{}, children:[] }.
   The canvas renders the tree as REAL DOM (display:flex) so it stays WYSIWYG.
   ============================================================================ */

// ---- node factory ---------------------------------------------------------
let _seq = 1;
const uid = () => `n${_seq++}`;

const makeNode = (tag, label, styles = {}, children = [], text = "") => ({
  id: uid(),
  tag,
  label,
  styles,
  children,
  text,
});

// Word pool for box content. Kept short + UI-flavored so generated boxes read
// like plausible layout content rather than lorem gibberish.
const WORD_POOL = [
  "hero", "panel", "card", "nav", "sidebar", "header", "footer", "badge",
  "avatar", "banner", "tile", "feed", "menu", "modal", "toast", "chip",
  "list", "grid", "media", "label", "field", "stack", "rail", "tray",
];
const randomWords = (n = 2) => {
  const out = [];
  const pool = [...WORD_POOL];
  for (let i = 0; i < n && pool.length; i++) {
    const idx = Math.floor(Math.random() * pool.length);
    out.push(pool.splice(idx, 1)[0]); // splice avoids repeating the same word
  }
  return out.join(" ");
};

const makeContainer = () =>
  makeNode("div", "Flex container", {
    display: "flex",
    flexDirection: "row",
    justifyContent: "flex-start",
    alignItems: "stretch",
    gap: 12,
    padding: 16,
    flexWrap: "nowrap",
  });

// Each box gets two random words as its content (passed as the `text` field).
const makeBox = () =>
  makeNode(
    "div",
    "Box",
    {
      padding: 20,
      flexGrow: 0,
      flexShrink: 1,
      flexBasis: "auto",
      alignSelf: "auto",
    },
    [],
    randomWords(2)
  );

// Default styles per element kind. Reset reads from here so "default" always
// means "what a fresh element of this type looks like" — honest, not arbitrary.
const DEFAULT_STYLES = {
  container: makeContainer().styles,
  box: makeBox().styles,
};
// Which factory's defaults apply to a given node (containers vs leaf boxes).
const defaultsFor = (node) =>
  node.styles.display === "flex" ? DEFAULT_STYLES.container : DEFAULT_STYLES.box;
// Is this property currently at its default value for this node's type?
const isDefaultValue = (node, key) => {
  const def = defaultsFor(node);
  const cur = node.styles[key];
  // Properties not in the factory default count as "default" only when absent.
  if (!(key in def)) return cur === undefined || cur === "auto" || cur === 0;
  return cur === def[key];
};

// Deep clone a subtree but with brand-new ids (for "duplicate").
const cloneWithNewIds = (node) => ({
  ...node,
  id: uid(),
  styles: { ...node.styles },
  children: node.children.map(cloneWithNewIds),
});

const initialTree = () => {
  const root = makeContainer();
  root.label = "Root";
  root.styles.minHeight = 300;
  root.children = [makeBox(), makeBox(), makeBox()];
  return root;
};

// ---- tree helpers (immutable) ---------------------------------------------
function mapTree(node, fn) {
  const next = fn(node);
  return { ...next, children: next.children.map((c) => mapTree(c, fn)) };
}
function updateStyles(tree, id, patch) {
  return mapTree(tree, (n) => {
    if (n.id !== id) return n;
    const styles = { ...n.styles, ...patch };
    // A patch value of `undefined` means "remove this property" (e.g. clearing
    // a border) — otherwise it would serialize as `prop: undefined` in CSS.
    for (const k in patch) if (patch[k] === undefined) delete styles[k];
    return { ...n, styles };
  });
}
function findNode(tree, id) {
  if (tree.id === id) return tree;
  for (const c of tree.children) {
    const f = findNode(c, id);
    if (f) return f;
  }
  return null;
}
function findParent(tree, id, parent = null) {
  if (tree.id === id) return parent;
  for (const c of tree.children) {
    const f = findParent(c, id, tree);
    if (f !== null) return f;
  }
  return null;
}
function removeNode(tree, id) {
  let removed = null;
  const walk = (node) => {
    const kept = [];
    for (const c of node.children) {
      if (c.id === id) removed = c;
      else kept.push(walk(c));
    }
    return { ...node, children: kept };
  };
  return [walk(tree), removed];
}
function insertNode(tree, parentId, idx, node) {
  return mapTree(tree, (n) => {
    if (n.id !== parentId) return n;
    const children = [...n.children];
    children.splice(idx, 0, node);
    return { ...n, children };
  });
}
// Insert a clone right after `id` within its parent.
function duplicateNode(tree, id) {
  const parent = findParent(tree, id);
  if (!parent) return [tree, null];
  const idx = parent.children.findIndex((c) => c.id === id);
  const clone = cloneWithNewIds(findNode(tree, id));
  return [insertNode(tree, parent.id, idx + 1, clone), clone.id];
}

// ---- CSS export ------------------------------------------------------------
const camelToKebab = (s) => s.replace(/[A-Z]/g, (m) => "-" + m.toLowerCase());
const UNITLESS = ["flexGrow", "flexShrink", "order", "opacity"];
const cssValue = (k, v) =>
  typeof v === "number" && !UNITLESS.includes(k) ? `${v}px` : v;
function styleToCss(styles) {
  return Object.entries(styles)
    .map(([k, v]) => `  ${camelToKebab(k)}: ${cssValue(k, v)};`)
    .join("\n");
}
function exportCss(tree) {
  const rules = [];
  const walk = (node) => {
    const body = styleToCss(node.styles);
    if (body.trim()) rules.push(`.${node.tag}-${node.id} {\n${body}\n}`);
    node.children.forEach(walk);
  };
  walk(tree);
  return rules.join("\n\n");
}
function exportHtml(tree) {
  const walk = (node, depth) => {
    const pad = "  ".repeat(depth);
    const cls = `${node.tag}-${node.id}`;
    if (node.children.length === 0)
      return `${pad}<${node.tag} class="${cls}">${node.text || ""}</${node.tag}>`;
    const inner = node.children.map((c) => walk(c, depth + 1)).join("\n");
    return `${pad}<${node.tag} class="${cls}">\n${inner}\n${pad}</${node.tag}>`;
  };
  return walk(tree, 0);
}

// ---- segment variants (for per-element highlighting in the code panels) -----
// Each returns an array of { id, text } pieces. The panel wraps the segment
// whose id === selectedId in a highlight. CSS = one rule per node. HTML keeps
// the nesting but tags each node's OWN tag-line(s) with its id so selecting a
// container lights just its tags, not its whole subtree.
function exportCssSegments(tree) {
  const segs = [];
  const walk = (node) => {
    const body = styleToCss(node.styles);
    if (body.trim()) segs.push({ id: node.id, text: `.${node.tag}-${node.id} {\n${body}\n}` });
    node.children.forEach(walk);
  };
  walk(tree);
  return segs;
}
function exportHtmlSegments(tree) {
  // Emit ordered line-segments. A node's open+close tags carry its id; the
  // children sit between them as their own segments. Leaf = a single segment.
  const segs = [];
  const walk = (node, depth) => {
    const pad = "  ".repeat(depth);
    const cls = `${node.tag}-${node.id}`;
    if (node.children.length === 0) {
      segs.push({ id: node.id, text: `${pad}<${node.tag} class="${cls}">${node.text || ""}</${node.tag}>` });
      return;
    }
    segs.push({ id: node.id, text: `${pad}<${node.tag} class="${cls}">` });
    node.children.forEach((c) => walk(c, depth + 1));
    segs.push({ id: node.id, text: `${pad}</${node.tag}>` });
  };
  walk(tree, 0);
  return segs;
}

// ---- standalone site export ------------------------------------------------
// Wrap the exported HTML body + CSS into ONE runnable .html document: font
// import, a minimal reset so it renders the same outside the tool, the layout
// CSS inlined in a <style>, and the exported markup in the <body>. No build
// step, no framework — double-click and it renders.
function buildStandaloneSite(htmlText, cssText) {
  return `<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FlexCraft layout</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap');
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; padding: 24px; font-family: 'Space Mono', ui-monospace, monospace; background: #0e1014; color: #e7e9ee; }
/* --- your layout --- */
${cssText}
</style>
</head>
<body>
${htmlText}
</body>
</html>
`;
}

// ---- import: HTML(+CSS) → editable tree ------------------------------------
// Inverse of the exporters. Scoped to FlexCraft-shaped docs: a class on each
// element, flat `.class { ... }` rules. Unknown properties are collected and
// reported, not stored. Returns { tree, count, skippedProps, error }.
const KEBAB_TO_CAMEL = (s) => s.replace(/-([a-z])/g, (_, c) => c.toUpperCase());
const KNOWN_STYLE_KEYS = new Set([
  "display", "flexDirection", "justifyContent", "alignItems", "alignContent",
  "flexWrap", "gap", "flexGrow", "flexShrink", "flexBasis", "alignSelf",
  "order", "width", "height", "minHeight", "padding", "margin",
  "borderWidth", "borderStyle", "borderColor",
]);
function importValue(key, raw) {
  const v = raw.trim();
  const pxMatch = /^(-?\d+(?:\.\d+)?)px$/.exec(v);
  if (pxMatch) return Number(pxMatch[1]);
  if (/^-?\d+(?:\.\d+)?$/.test(v)) return Number(v);
  return v;
}
function parseCssRules(cssStr) {
  const map = {};
  const skipped = [];
  if (!cssStr) return { map, skipped };
  const clean = cssStr.replace(/\/\*[\s\S]*?\*\//g, "");
  const ruleRe = /\.([A-Za-z0-9_-]+)\s*\{([^}]*)\}/g;
  let m;
  while ((m = ruleRe.exec(clean))) {
    const cls = m[1];
    const styles = {};
    m[2].split(";").forEach((d) => {
      const idx = d.indexOf(":");
      if (idx === -1) return;
      const prop = d.slice(0, idx).trim();
      const val = d.slice(idx + 1).trim();
      if (!prop || !val) return;
      const camel = KEBAB_TO_CAMEL(prop);
      if (KNOWN_STYLE_KEYS.has(camel)) styles[camel] = importValue(camel, val);
      else skipped.push(prop);
    });
    map[cls] = { ...(map[cls] || {}), ...styles };
  }
  return { map, skipped };
}
// Parse just the DECLARATIONS (the lines inside the braces) into a styles
// object — KEEPING every property, including ones the tool has no control for
// (border-radius, box-shadow, transform, …). This backs the manual CSS-edit
// feature: experiment with any CSS and it becomes a real style on the node.
// Returns { styles, error }. A `null` error means it parsed cleanly.
function parseDeclsToStyles(text) {
  // tolerate the user leaving/removing the `.cls { }` wrapper: if braces are
  // present, take what's inside them; otherwise treat the whole thing as decls.
  let body = text;
  const brace = text.indexOf("{");
  if (brace !== -1) {
    const close = text.lastIndexOf("}");
    body = text.slice(brace + 1, close === -1 ? undefined : close);
  }
  const styles = {};
  let bad = 0;
  body.split(";").forEach((d) => {
    const decl = d.trim();
    if (!decl) return;
    const idx = decl.indexOf(":");
    if (idx === -1) { bad += 1; return; } // a non-empty chunk with no colon = malformed
    const prop = decl.slice(0, idx).trim();
    const val = decl.slice(idx + 1).trim();
    if (!prop || !val) { bad += 1; return; }
    styles[KEBAB_TO_CAMEL(prop)] = importValue(prop, val);
  });
  return { styles, error: bad > 0 ? `${bad} line${bad === 1 ? "" : "s"} ignored (no value)` : null };
}
function parseImport(htmlStr, cssStr) {
  if (typeof DOMParser === "undefined")
    return { tree: null, error: "DOMParser unavailable" };
  if (!htmlStr || !htmlStr.trim())
    return { tree: null, error: "No HTML content found" };

  const dom = new DOMParser().parseFromString(htmlStr, "text/html");
  let css = cssStr || "";
  if (!css) {
    css = Array.from(dom.querySelectorAll("style")).map((s) => s.textContent || "").join("\n");
  }
  const { map: classStyles, skipped } = parseCssRules(css);
  const skippedProps = [...skipped];

  const body = dom.body;
  if (!body || !body.children.length)
    return { tree: null, error: "No <body> elements to import" };

  let count = 0;
  const build = (el) => {
    count += 1;
    const firstClass = (el.getAttribute("class") || "").split(/\s+/)[0] || "";
    const styles = { ...(classStyles[firstClass] || {}) };
    const inline = el.getAttribute("style");
    if (inline) {
      inline.split(";").forEach((d) => {
        const idx = d.indexOf(":");
        if (idx === -1) return;
        const camel = KEBAB_TO_CAMEL(d.slice(0, idx).trim());
        const val = d.slice(idx + 1).trim();
        if (!val) return;
        if (KNOWN_STYLE_KEYS.has(camel)) styles[camel] = importValue(camel, val);
        else skippedProps.push(d.slice(0, idx).trim());
      });
    }
    const childEls = Array.from(el.children);
    const node = {
      id: uid(),
      tag: "div",
      label: styles.display === "flex" ? "Flex container" : "Box",
      styles,
      children: childEls.map(build),
    };
    if (!childEls.length) {
      const txt = (el.textContent || "").trim();
      if (txt) node.text = txt;
    }
    return node;
  };

  const rootEl = Array.from(body.children).find((c) => c.tagName === "DIV") || body.children[0];
  const tree = build(rootEl);
  tree.label = "Root";
  return { tree, count, skippedProps, error: null };
}

// Shared label row. Shows a "↺" reset button only when the value is non-default
// (modified !== undefined && true) and an onReset handler is provided.
function FieldLabel({ label, modified, onReset, children }) {
  return (
    <label className="fc-field-label">
      <span className="fc-label-text">
        {label}
        {modified && onReset && (
          <button
            className="fc-reset-dot"
            title="Reset to default"
            onClick={(e) => {
              e.preventDefault();
              onReset();
            }}
          >
            ↺
          </button>
        )}
      </span>
      {children}
    </label>
  );
}

function Segmented({ label, value, options, onChange, modified, onReset }) {
  const trackRef = React.useRef(null);
  // overflow state: whether content is scrollable past the left / right edges,
  // so we only show the fade + chevron affordances when there's hidden content.
  const [edges, setEdges] = React.useState({ left: false, right: false });

  // Recompute which edges have hidden content. scrollLeft>0 means stuff is
  // hidden to the left; scrollLeft+clientWidth < scrollWidth means hidden right.
  const updateEdges = React.useCallback(() => {
    const el = trackRef.current;
    if (!el) return;
    const left = el.scrollLeft > 1;
    const right = el.scrollLeft + el.clientWidth < el.scrollWidth - 1;
    setEdges((prev) =>
      prev.left === left && prev.right === right ? prev : { left, right }
    );
  }, []);

  // On mount + whenever the option set changes, measure overflow and scroll the
  // active option into view so the current value is never hidden off-edge.
  React.useLayoutEffect(() => {
    updateEdges();
    const el = trackRef.current;
    if (!el) return;
    const active = el.querySelector(".is-active");
    if (active && active.scrollIntoView) {
      active.scrollIntoView({ inline: "nearest", block: "nearest" });
    }
    updateEdges();
  }, [value, options, updateEdges]);

  // Click a chevron to nudge the row by ~70% of its visible width.
  const nudge = (dir) => () => {
    const el = trackRef.current;
    if (!el) return;
    el.scrollBy({ left: dir * el.clientWidth * 0.7, behavior: "smooth" });
  };

  return (
    <div className="fc-field">
      <FieldLabel label={label} modified={modified} onReset={onReset} />
      <div className="fc-seg-wrap">
        {edges.left && (
          <button className="fc-seg-chev fc-seg-chev-l" onClick={nudge(-1)} title="Scroll left" tabIndex={-1}>
            ‹
          </button>
        )}
        <div
          className={
            "fc-segmented" +
            (edges.left ? " fade-l" : "") +
            (edges.right ? " fade-r" : "")
          }
          ref={trackRef}
          onScroll={updateEdges}
        >
          {options.map((opt) => {
            const v = typeof opt === "string" ? opt : opt.value;
            const lbl = typeof opt === "string" ? opt : opt.label;
            return (
              <button
                key={v}
                title={v}
                onClick={() => onChange(v)}
                className={"fc-seg-btn" + (value === v ? " is-active" : "")}
              >
                {lbl}
              </button>
            );
          })}
        </div>
        {edges.right && (
          <button className="fc-seg-chev fc-seg-chev-r" onClick={nudge(1)} title="Scroll right" tabIndex={-1}>
            ›
          </button>
        )}
      </div>
    </div>
  );
}

function Slider({ label, value, min, max, step = 1, suffix = "px", onChange, modified, onReset }) {
  return (
    <div className="fc-field">
      <FieldLabel label={label} modified={modified} onReset={onReset}>
        <span className="fc-field-val">
          {value}
          {suffix}
        </span>
      </FieldLabel>
      <input
        type="range"
        min={min}
        max={max}
        step={step}
        value={value}
        onChange={(e) => onChange(Number(e.target.value))}
        className="fc-range"
      />
    </div>
  );
}

// width / height / flex-basis can be a number(px) or the keyword "auto".
function DimInput({ label, value, onChange, modified, onReset, measuredDefault }) {
  const isAuto = value === undefined || value === "auto" || value === "";
  // When flipping to "fixed", seed with the element's actual current rendered
  // size (measured by the parent) so the box doesn't visually jump — instead of
  // a meaningless constant. Falls back to 120 only if no measurement is given.
  const seed = typeof measuredDefault === "number" && measuredDefault > 0
    ? Math.round(measuredDefault)
    : 120;
  return (
    <div className="fc-field">
      <FieldLabel label={label} modified={modified} onReset={onReset}>
        <button
          className={"fc-mini-toggle" + (isAuto ? " is-active" : "")}
          onClick={() => onChange(isAuto ? seed : "auto")}
        >
          {isAuto ? "auto" : "fixed"}
        </button>
      </FieldLabel>
      {!isAuto && (
        <input
          type="number"
          value={typeof value === "number" ? value : seed}
          onChange={(e) => onChange(Number(e.target.value))}
          className="fc-num"
        />
      )}
    </div>
  );
}

// ============================================================================
//  Flex-line measurement + overlay
// ============================================================================
// Group child rectangles into flex LINES. The browser exposes no flex-line API,
// so we infer lines from laid-out geometry: in a row container, items on the
// same line share a vertical band (their rects overlap on the Y axis); in a
// column container, they share a horizontal band. Returns an array of line
// bounding boxes {left, top, width, height} in the container's local coords.
function groupIntoLines(childRects, containerRect, horizontal) {
  if (!childRects.length) return [];
  // Sort along the cross axis so consecutive items cluster into lines.
  const rects = childRects
    .map((r) => ({
      left: r.left - containerRect.left,
      top: r.top - containerRect.top,
      right: r.right - containerRect.left,
      bottom: r.bottom - containerRect.top,
    }))
    .sort((a, b) => (horizontal ? a.top - b.top : a.left - b.left));

  const lines = [];
  let cur = null;
  for (const r of rects) {
    // Cross-axis start of this item; a new line begins when an item starts
    // clearly past the current line's cross-axis extent.
    const crossStart = horizontal ? r.top : r.left;
    const crossEnd = horizontal ? r.bottom : r.right;
    if (
      cur &&
      crossStart < (horizontal ? cur.bottom : cur.right) - 1 // overlaps → same line
    ) {
      cur.left = Math.min(cur.left, r.left);
      cur.top = Math.min(cur.top, r.top);
      cur.right = Math.max(cur.right, r.right);
      cur.bottom = Math.max(cur.bottom, r.bottom);
    } else {
      cur = { left: r.left, top: r.top, right: r.right, bottom: r.bottom };
      lines.push(cur);
    }
  }
  return lines.map((l) => ({
    left: l.left,
    top: l.top,
    width: l.right - l.left,
    height: l.bottom - l.top,
  }));
}

// Compute the GAP channels — the voids between adjacent flex items. `gap` space
// belongs to the container, not to either neighbor, so it can't be tinted on an
// element; we measure the space between consecutive items and emit a band per
// channel. Items are grouped by line first (gap only exists between items on the
// SAME line — the space between lines is row-gap/align-content, handled
// separately). Returns band rects in container-local coords.
function computeGapBands(childRects, containerRect, horizontal) {
  if (childRects.length < 2) return [];
  const rects = childRects.map((r) => ({
    left: r.left - containerRect.left,
    top: r.top - containerRect.top,
    right: r.right - containerRect.left,
    bottom: r.bottom - containerRect.top,
  }));

  // Group items into lines (same cross-axis overlap rule as groupIntoLines).
  const sorted = [...rects].sort((a, b) =>
    horizontal ? a.top - b.top || a.left - b.left : a.left - b.left || a.top - b.top
  );
  const lines = [];
  let cur = null;
  for (const r of sorted) {
    const crossStart = horizontal ? r.top : r.left;
    if (cur && crossStart < (horizontal ? cur.bottom : cur.right) - 1) {
      cur.items.push(r);
      cur.bottom = Math.max(cur.bottom, r.bottom);
      cur.right = Math.max(cur.right, r.right);
    } else {
      cur = { items: [r], top: r.top, bottom: r.bottom, left: r.left, right: r.right };
      lines.push(cur);
    }
  }

  // Within each line, sort along the MAIN axis and emit a band in each channel
  // between consecutive items (only when there's actually a positive gap).
  const bands = [];
  for (const line of lines) {
    const items = [...line.items].sort((a, b) =>
      horizontal ? a.left - b.left : a.top - b.top
    );
    for (let i = 0; i < items.length - 1; i++) {
      const a = items[i];
      const b = items[i + 1];
      if (horizontal) {
        const gap = b.left - a.right;
        if (gap > 0.5) {
          bands.push({
            left: a.right,
            top: line.top,
            width: gap,
            height: line.bottom - line.top,
          });
        }
      } else {
        const gap = b.top - a.bottom;
        if (gap > 0.5) {
          bands.push({
            left: line.left,
            top: a.bottom,
            width: line.right - line.left,
            height: gap,
          });
        }
      }
    }
  }
  return bands;
}

// Overlay that measures the selected container's children and draws a band per
// flex line, plus a main-axis direction arrow. Re-measures after every render
// of the parent (cheap; layout is already done) via a layout effect + a tick.
function FlexLineOverlay({ containerRef, node }) {
  const [lines, setLines] = React.useState([]);
  const horizontal = (node.styles.flexDirection || "row").startsWith("row");

  // Serialize the layout-relevant styles so the measuring effect only re-runs
  // when something that could change line layout actually changes — NOT on every
  // render. (Re-running every render + setState in the body = infinite loop.)
  const layoutKey = JSON.stringify({
    fd: node.styles.flexDirection,
    fw: node.styles.flexWrap,
    g: node.styles.gap,
    jc: node.styles.justifyContent,
    ai: node.styles.alignItems,
    ac: node.styles.alignContent,
    n: node.children.length,
  });

  React.useLayoutEffect(() => {
    const el = containerRef.current;
    if (!el) return;

    const measure = () => {
      const cRect = el.getBoundingClientRect();
      const kids = Array.from(el.children).filter(
        (c) => c.classList && c.classList.contains("fc-node")
      );
      const rects = kids.map((k) => k.getBoundingClientRect());
      const next = groupIntoLines(rects, cRect, horizontal);
      // Only update state if the measurement changed — this is the key fix.
      setLines((prev) => {
        if (
          prev.length === next.length &&
          prev.every(
            (p, i) =>
              p.left === next[i].left &&
              p.top === next[i].top &&
              p.width === next[i].width &&
              p.height === next[i].height
          )
        ) {
          return prev; // identical → no re-render, observer can't loop
        }
        return next;
      });
    };

    measure();
    const ro = new ResizeObserver(measure);
    ro.observe(el);
    Array.from(el.children).forEach((c) => ro.observe(c));
    return () => ro.disconnect();
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [layoutKey, horizontal]);

  return (
    <>
      {lines.map((ln, i) => (
        <div
          key={i}
          className="fc-line-band"
          style={{
            position: "absolute",
            left: ln.left,
            top: ln.top,
            width: ln.width,
            height: ln.height,
            pointerEvents: "none",
            zIndex: 15,
          }}
        >
          <span className="fc-line-tag">
            line {i + 1}
          </span>
        </div>
      ))}
      {/* main-axis direction arrow, centered */}
      <span
        className={"fc-axis-arrow " + (horizontal ? "is-row" : "is-col")}
        style={{ position: "absolute", pointerEvents: "none", zIndex: 16 }}
      >
        {node.styles.flexDirection === "row"
          ? "→ main"
          : node.styles.flexDirection === "row-reverse"
          ? "← main"
          : node.styles.flexDirection === "column"
          ? "↓ main"
          : "↑ main"}
      </span>
    </>
  );
}

// Overlay that draws the GAP channels between items in violet — the third kind
// of space alongside padding (green) and margin (amber). Same measure-then-draw
// pattern as FlexLineOverlay, with the same equality guard so it can't loop.
function GapOverlay({ containerRef, node }) {
  const [bands, setBands] = React.useState([]);
  const horizontal = (node.styles.flexDirection || "row").startsWith("row");
  const layoutKey = JSON.stringify({
    fd: node.styles.flexDirection,
    fw: node.styles.flexWrap,
    g: node.styles.gap,
    jc: node.styles.justifyContent,
    ai: node.styles.alignItems,
    ac: node.styles.alignContent,
    n: node.children.length,
  });

  React.useLayoutEffect(() => {
    const el = containerRef.current;
    if (!el) return;
    const measure = () => {
      const cRect = el.getBoundingClientRect();
      const kids = Array.from(el.children).filter(
        (c) => c.classList && c.classList.contains("fc-node")
      );
      const rects = kids.map((k) => k.getBoundingClientRect());
      const next = computeGapBands(rects, cRect, horizontal);
      setBands((prev) => {
        if (
          prev.length === next.length &&
          prev.every(
            (p, i) =>
              p.left === next[i].left &&
              p.top === next[i].top &&
              p.width === next[i].width &&
              p.height === next[i].height
          )
        ) {
          return prev; // identical → no re-render (no loop)
        }
        return next;
      });
    };
    measure();
    const ro = new ResizeObserver(measure);
    ro.observe(el);
    Array.from(el.children).forEach((c) => ro.observe(c));
    return () => ro.disconnect();
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [layoutKey, horizontal]);

  return (
    <>
      {bands.map((b, i) => (
        <div
          key={i}
          className="fc-gap-band"
          style={{
            position: "absolute",
            left: b.left,
            top: b.top,
            width: b.width,
            height: b.height,
            pointerEvents: "none",
            zIndex: 19,
          }}
        />
      ))}
    </>
  );
}

// ============================================================================
//  Canvas node renderer
// ============================================================================
function CanvasNode({
  node,
  isRoot,
  selectedId,
  onSelect,
  dropTarget,
  setDropTarget,
  onDropNew,
  onDropMove,
  dragState,
  showBoxModel,
  showLines,
  hidePills,
  onResize,
  syncDims,
  isDragging,
  onText,
}) {
  const isSelected = node.id === selectedId;
  const isContainer = node.styles.display === "flex";

  // Box-model overlay: show padding (green) and margin (amber) bands on the
  // selected element when the toggle is on. We draw each band as a border on an
  // absolutely-positioned layer — a border's per-side thickness IS the band.
  const overlayOn = showBoxModel && isSelected;
  const marginVal = typeof node.styles.margin === "number" ? node.styles.margin : 0;
  const paddingVal = typeof node.styles.padding === "number" ? node.styles.padding : 0;

  // Ref to the node's DOM element so a resize drag can measure its actual
  // rendered size as the starting point (flex may have sized it, not us).
  const elRef = React.useRef(null);
  // Live readout shown next to the cursor while dragging a resize handle:
  // { x, y, text } or null. Cleared on pointer-up.
  const [resizeTip, setResizeTip] = React.useState(null);
  // Inline text editing: true while this leaf box's text is being edited via
  // contentEditable. textRef points at the editable span so we can read its
  // final text on commit (we DON'T control it keystroke-by-keystroke, which
  // would fight the cursor — we read it once when editing ends).
  const [editing, setEditing] = React.useState(false);
  const textRef = React.useRef(null);
  const isLeaf = !isContainer && node.children.length === 0;

  // When entering edit mode, focus the span and select all its text so typing
  // replaces it (and the caret is placed correctly).
  React.useEffect(() => {
    if (editing && textRef.current) {
      const el = textRef.current;
      el.focus();
      const range = document.createRange();
      range.selectNodeContents(el);
      const sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
    }
  }, [editing]);

  const commitText = () => {
    if (!editing) return;
    const next = (textRef.current?.textContent || "").trim();
    setEditing(false);
    if (next !== (node.text || "") && typeof onText === "function") {
      onText(node.id, next);
    }
  };
  const cancelText = () => {
    // Revert the DOM to the stored text, then exit without committing.
    if (textRef.current) textRef.current.textContent = node.text || "";
    setEditing(false);
  };

  // Begin an edge-resize drag. `axis` is "x" (width) or "y" (height).
  // We use POINTER events (not HTML5 drag) so this works on touch and never
  // collides with the reorder drag system, which is drag-event based.
  const startResize = (axis) => (e) => {
    e.preventDefault();
    e.stopPropagation();
    const el = elRef.current;
    if (!el) return;
    const rect = el.getBoundingClientRect();
    const startX = e.clientX;
    const startY = e.clientY;
    const startW = rect.width;
    const startH = rect.height;

    const onMove = (ev) => {
      const dx = ev.clientX - startX;
      const dy = ev.clientY - startY;
      // Honest behavior: grabbing an edge means "I want this exact size, stop
      // auto-flexing." So we zero flex-grow/shrink so the explicit dimension
      // actually takes effect instead of being overridden by the flex algorithm.
      const patch = { flexGrow: 0, flexShrink: 0 };
      if (axis === "x" || axis === "xy" || syncDims) {
        patch.width = Math.max(20, Math.round(startW + dx));
      }
      if (axis === "y" || axis === "xy" || syncDims) {
        patch.height = Math.max(20, Math.round(startH + dy));
      }
      // With sync on, a single edge drives both dims to the same value so the
      // element stays square — we key off whichever axis was grabbed.
      if (syncDims) {
        const v = axis === "y"
          ? Math.max(20, Math.round(startH + dy))
          : Math.max(20, Math.round(startW + dx));
        patch.width = v;
        patch.height = v;
      }
      onResize(node.id, patch);
      // Live readout: show the dimension(s) actually changing for this drag.
      const showW = axis === "x" || axis === "xy" || syncDims;
      const showH = axis === "y" || axis === "xy" || syncDims;
      const parts = [];
      if (showW) parts.push(`W ${patch.width}`);
      if (showH) parts.push(`H ${patch.height}`);
      setResizeTip({ x: ev.clientX, y: ev.clientY, text: parts.join("  ×  ") });
    };
    const onUp = () => {
      window.removeEventListener("pointermove", onMove);
      window.removeEventListener("pointerup", onUp);
      setResizeTip(null);
    };
    window.addEventListener("pointermove", onMove);
    window.addEventListener("pointerup", onUp);
  };

  // Only show resize handles on the selected, non-root element.
  const showHandles = isSelected && !isRoot && typeof onResize === "function";
  // Flex-line overlay only makes sense on a selected CONTAINER with items.
  const linesOn = showLines && isSelected && isContainer && node.children.length > 0;
  // Gap bands ride along with the box-model overlay (not the lines toggle), so
  // padding/margin/gap all appear together when ▣ is on.
  const gapOn = overlayOn && isContainer && node.children.length > 1;

  const dragProps = isRoot || editing
    ? {}
    : {
        draggable: true,
        onDragStart: (e) => {
          e.stopPropagation();
          dragState.current = { kind: "move", id: node.id };
          e.dataTransfer.effectAllowed = "move";
        },
        onDragEnd: () => {
          dragState.current = null;
          setDropTarget(null);
        },
      };

  const renderChildrenWithZones = () => {
    const dir = node.styles.flexDirection || "row";
    const horizontal = dir.startsWith("row");

    // When NOT dragging, render children directly — no interleaved dropzones —
    // so `gap` spacing is exactly what the user set (zones would otherwise sit
    // between items and take their own share of the gap, inflating it). Zones
    // only exist during a drag, when we need drop targets.
    const childEls = node.children.map((child) => (
      <CanvasNode
        key={child.id}
        node={child}
        isRoot={false}
        selectedId={selectedId}
        onSelect={onSelect}
        dropTarget={dropTarget}
        setDropTarget={setDropTarget}
        onDropNew={onDropNew}
        onDropMove={onDropMove}
        dragState={dragState}
        showBoxModel={showBoxModel}
        showLines={showLines}
        hidePills={hidePills}
        onResize={onResize}
        syncDims={syncDims}
        isDragging={isDragging}
        onText={onText}
      />
    ));

    if (!isDragging) return childEls;

    // Dragging: interleave drop zones (zone, child, zone, child, …, zone).
    const zones = [];
    for (let i = 0; i <= node.children.length; i++) {
      const active =
        dropTarget && dropTarget.parentId === node.id && dropTarget.index === i;
      zones.push(
        <DropZone
          key={`z${i}`}
          horizontal={horizontal}
          active={active}
          dragging={isDragging}
          onDragOver={(e) => {
            e.preventDefault();
            e.stopPropagation();
            setDropTarget({ parentId: node.id, index: i });
          }}
          onDrop={(e) => {
            e.preventDefault();
            e.stopPropagation();
            const ds = dragState.current;
            if (!ds) return;
            if (ds.kind === "new") onDropNew(node.id, i, ds.factory);
            else if (ds.kind === "move") onDropMove(node.id, i, ds.id);
            setDropTarget(null);
          }}
        />
      );
      if (i < node.children.length) zones.push(childEls[i]);
    }
    return zones;
  };

  return (
    <div
      {...dragProps}
      onClick={(e) => {
        e.stopPropagation();
        onSelect(node.id);
      }}
      onDoubleClick={(e) => {
        // Double-click a leaf box → edit its text inline. Containers ignore it
        // (their "content" is their children, not text).
        if (isLeaf) {
          e.stopPropagation();
          onSelect(node.id);
          setEditing(true);
        }
      }}
      className={
        "fc-node" +
        (isSelected ? " is-selected" : "") +
        (isContainer ? " is-container" : "") +
        (overlayOn ? " fc-bm-active" : "")
      }
      style={{ ...node.styles, position: "relative" }}
      ref={elRef}
      data-node-id={node.id}
    >
      {/* Box-model overlays (selected element only, when toggle is on).
          Bands are opaque + high z-index so they read clearly over the node's
          own background and selection wash — devtools-style. */}
      {overlayOn && marginVal > 0 && (
        <div
          className="fc-bm-margin"
          style={{
            position: "absolute",
            top: -marginVal,
            left: -marginVal,
            right: -marginVal,
            bottom: -marginVal,
            borderStyle: "solid",
            borderColor: "rgba(246,173,85,0.85)",
            borderTopWidth: marginVal,
            borderRightWidth: marginVal,
            borderBottomWidth: marginVal,
            borderLeftWidth: marginVal,
            pointerEvents: "none",
            zIndex: 20,
          }}
        >
          <span className="fc-bm-tag fc-bm-tag-margin">margin {marginVal}</span>
        </div>
      )}
      {overlayOn && paddingVal > 0 && (
        <div
          className="fc-bm-padding"
          style={{
            position: "absolute",
            inset: 0,
            borderStyle: "solid",
            borderColor: "rgba(104,211,145,0.80)",
            borderTopWidth: paddingVal,
            borderRightWidth: paddingVal,
            borderBottomWidth: paddingVal,
            borderLeftWidth: paddingVal,
            pointerEvents: "none",
            zIndex: 21,
          }}
        >
          <span className="fc-bm-tag fc-bm-tag-padding">padding {paddingVal}</span>
        </div>
      )}
      {gapOn && <GapOverlay containerRef={elRef} node={node} />}
      {linesOn && <FlexLineOverlay containerRef={elRef} node={node} />}
      {!hidePills && (
        <span className="fc-node-tag">
          {node.label}
          {isContainer ? ` · ${node.styles.flexDirection}` : ""}
        </span>
      )}
      {/* Resize handles: right edge (width), bottom edge (height), and corner
          (both). Pointer-driven; sit above content via z-index. */}
      {showHandles && (
        <>
          <div
            className="fc-resize fc-resize-r"
            onPointerDown={startResize("x")}
            onClick={(e) => e.stopPropagation()}
            title={syncDims ? "Drag to resize (synced)" : "Drag to set width"}
          />
          <div
            className="fc-resize fc-resize-b"
            onPointerDown={startResize("y")}
            onClick={(e) => e.stopPropagation()}
            title={syncDims ? "Drag to resize (synced)" : "Drag to set height"}
          />
          <div
            className="fc-resize fc-resize-br"
            onPointerDown={startResize("xy")}
            onClick={(e) => e.stopPropagation()}
            title="Drag to resize width & height"
          />
        </>
      )}
      {resizeTip && (
        <span
          className="fc-resize-tip"
          style={{ position: "fixed", left: resizeTip.x + 16, top: resizeTip.y + 16, zIndex: 9999, pointerEvents: "none" }}
        >
          {resizeTip.text}
        </span>
      )}
      {isContainer
        ? renderChildrenWithZones()
        : node.children.length
        ? node.children.map((c) => (
            <CanvasNode
              key={c.id}
              node={c}
              isRoot={false}
              selectedId={selectedId}
              onSelect={onSelect}
              dropTarget={dropTarget}
              setDropTarget={setDropTarget}
              onDropNew={onDropNew}
              onDropMove={onDropMove}
              dragState={dragState}
              showBoxModel={showBoxModel}
              showLines={showLines}
              hidePills={hidePills}
              onResize={onResize}
              syncDims={syncDims}
              isDragging={isDragging}
              onText={onText}
            />
          ))
        : (node.text || editing)
        ? <span
            ref={textRef}
            className={"fc-node-text" + (editing ? " is-editing" : "")}
            contentEditable={editing}
            suppressContentEditableWarning
            onBlur={commitText}
            onKeyDown={(e) => {
              if (!editing) return;
              if (e.key === "Enter") { e.preventDefault(); commitText(); }
              else if (e.key === "Escape") { e.preventDefault(); cancelText(); }
              e.stopPropagation(); // keep keystrokes out of global shortcuts
            }}
            onClick={(e) => { if (editing) e.stopPropagation(); }}
          >
            {node.text}
          </span>
        : null}
    </div>
  );
}

function DropZone({ horizontal, active, dragging, onDragOver, onDrop }) {
  // Zero-size in normal flow so it never inflates the layout — the canvas then
  // renders TRUE flexbox (gap:0 is genuinely 0, no phantom 8px between items).
  // Only while a drag is in progress do the zones expand into catchable targets.
  const size = dragging
    ? {
        width: horizontal ? 8 : "auto",
        minWidth: horizontal ? 8 : undefined,
        height: horizontal ? "auto" : 8,
        minHeight: horizontal ? 40 : 8,
      }
    : {
        // collapsed: take no space, but stay in the DOM as a drop target. A hair
        // of size (0) with negative margins keeps siblings flush.
        width: 0,
        height: 0,
        minWidth: 0,
        minHeight: 0,
      };
  return (
    <div
      onDragOver={onDragOver}
      onDrop={onDrop}
      className={"fc-dropzone" + (active ? " is-active" : "")}
      style={{ ...size, alignSelf: "stretch", flex: "0 0 auto" }}
    />
  );
}

// ============================================================================
//  Layer tree (mini outline so you can select hard-to-click nodes)
// ============================================================================
function LayerRow({ node, depth, selectedId, onSelect }) {
  const isContainer = node.styles.display === "flex";
  return (
    <>
      <button
        className={"fc-layer" + (node.id === selectedId ? " is-active" : "")}
        style={{ paddingLeft: 8 + depth * 14 }}
        onClick={() => onSelect(node.id)}
      >
        <span className="fc-layer-icon">{isContainer ? "▦" : "▢"}</span>
        {node.label}
      </button>
      {node.children.map((c) => (
        <LayerRow
          key={c.id}
          node={c}
          depth={depth + 1}
          selectedId={selectedId}
          onSelect={onSelect}
        />
      ))}
    </>
  );
}

// Map a CSS color value to a hex string for <input type="color"> (which only
// accepts hex). Passes through existing hex; maps the few named colors we seed;
// falls back to a sensible default for anything else (the swatch is a
// convenience — the actual stored value can still be any CSS color string).
function toHexColor(c) {
  if (typeof c === "string" && /^#[0-9a-fA-F]{6}$/.test(c)) return c;
  const named = {
    blue: "#0000ff", red: "#ff0000", green: "#008000", black: "#000000",
    white: "#ffffff", gray: "#808080", grey: "#808080", orange: "#ffa500",
    purple: "#800080", teal: "#008080",
  };
  return named[(c || "").toLowerCase()] || "#0000ff";
}

// Display string for a keybinding descriptor (e.g. "⌃ Ctrl", "⇧ Shift", "G").
function keyLabel(tipKey) {
  if (tipKey.kind === "modifier") {
    const map = { Control: "⌃ Ctrl", Shift: "⇧ Shift", Alt: "⌥ Alt", Meta: "⌘ Meta" };
    return map[tipKey.value] || tipKey.value;
  }
  return tipKey.value.length === 1 ? tipKey.value.toUpperCase() : tipKey.value;
}

// ============================================================================
//  Code view — renders export segments, highlighting the selected element's
//  block and scrolling it into view. Plain text is kept for the copy button.
// ============================================================================
function CodeView({ segments, selectedId, joiner }) {
  const hlRef = React.useRef(null);
  // Scroll the highlighted block into view when selection (or tab) changes.
  React.useEffect(() => {
    if (hlRef.current && hlRef.current.scrollIntoView) {
      hlRef.current.scrollIntoView({ block: "nearest", behavior: "smooth" });
    }
  }, [selectedId, segments]);

  let firstHit = true;
  return (
    <pre className="fc-code">
      <code>
        {segments.map((seg, i) => {
          const isSel = seg.id === selectedId;
          const ref = isSel && firstHit ? ((firstHit = false), hlRef) : null;
          return (
            <React.Fragment key={i}>
              {i > 0 && joiner}
              <span ref={ref} className={isSel ? "fc-code-hl" : undefined}>
                {seg.text}
              </span>
            </React.Fragment>
          );
        })}
      </code>
    </pre>
  );
}

// ============================================================================
//  Hover tooltip — live readout of the element under the cursor
// ============================================================================
function HoverTooltip({ info, treeRootId }) {
  const { node, rect, x, y } = info;
  const isContainer = node.styles.display === "flex";
  const isRoot = node.id === treeRootId;
  const role = isRoot ? "root container" : isContainer ? "container" : "item";

  // Round measured size to whole px for a clean readout.
  const w = Math.round(rect.width);
  const h = Math.round(rect.height);

  // Explicit-vs-auto: is each dimension a set px value, or computed by flex/auto?
  // Knowing this explains WHY a box is the size it is (you set it vs flex did).
  const wFixed = typeof node.styles.width === "number";
  const hFixed = typeof node.styles.height === "number";
  const sizeMode =
    wFixed && hFixed ? "fixed w+h" : wFixed ? "fixed w" : hFixed ? "fixed h" : "auto size";

  // Wrapped-line count: not a style — measured from how children laid out, same
  // as the flex-line overlay. Reuse groupIntoLines on the live child rects.
  let lineCount = 0;
  if (isContainer && node.children.length > 0 && typeof document !== "undefined") {
    const el = document.querySelector(`[data-node-id="${node.id}"]`);
    if (el) {
      const horizontal = (node.styles.flexDirection || "row").startsWith("row");
      const cRect = el.getBoundingClientRect();
      const kids = Array.from(el.children).filter(
        (c) => c.classList && c.classList.contains("fc-node")
      );
      lineCount = groupIntoLines(
        kids.map((k) => k.getBoundingClientRect()),
        cRect,
        horizontal
      ).length;
    }
  }

  // Compact spacing readout (only show what's set/relevant).
  const pad = node.styles.padding;
  const mar = node.styles.margin;
  const gap = node.styles.gap;
  const wraps = node.styles.flexWrap && node.styles.flexWrap !== "nowrap";

  // Flex story: container axes, or item grow/shrink/basis + align-self.
  const containerBits = isContainer
    ? [
        node.styles.flexDirection,
        `justify:${(node.styles.justifyContent || "flex-start").replace("flex-", "")}`,
        `align:${(node.styles.alignItems || "stretch").replace("flex-", "")}`,
        wraps ? node.styles.flexWrap : null,
        // align-content only matters on multi-line (wrapping) containers.
        wraps ? `content:${(node.styles.alignContent || "stretch").replace("flex-", "")}` : null,
      ].filter(Boolean)
    : [];
  const itemBits = !isContainer
    ? [
        `flex: ${node.styles.flexGrow ?? 0} ${node.styles.flexShrink ?? 1} ${node.styles.flexBasis ?? "auto"}`,
        node.styles.alignSelf && node.styles.alignSelf !== "auto"
          ? `self:${node.styles.alignSelf.replace("flex-", "")}`
          : null,
      ].filter(Boolean)
    : [];

  // Position near cursor, flipping away from the right/bottom edges so the card
  // never clips off-screen. Offsets keep it clear of the pointer itself.
  const vw = typeof window !== "undefined" ? window.innerWidth : 1200;
  const vh = typeof window !== "undefined" ? window.innerHeight : 800;
  const flipX = x > vw - 240;
  const flipY = y > vh - 180;
  const style = {
    position: "fixed",
    left: flipX ? undefined : x + 16,
    right: flipX ? vw - x + 16 : undefined,
    top: flipY ? undefined : y + 16,
    bottom: flipY ? vh - y + 16 : undefined,
    zIndex: 9999,
    pointerEvents: "none",
  };

  return (
    <div className="fc-tooltip" style={style}>
      <div className="fc-tip-head">
        <span className="fc-tip-dims">{w} × {h}</span>
        <span className="fc-tip-role">{role}</span>
      </div>
      <div className="fc-tip-sel">{node.label + " · ." + node.tag + "-" + node.id}</div>
      <div className="fc-tip-mode">{sizeMode}</div>
      {containerBits.length > 0 && (
        <div className="fc-tip-row">{containerBits.join("  ·  ")}</div>
      )}
      {itemBits.length > 0 && (
        <div className="fc-tip-row">{itemBits.join("  ·  ")}</div>
      )}
      <div className="fc-tip-box">
        {typeof pad === "number" && <span>pad {pad}</span>}
        {typeof mar === "number" && mar > 0 && <span>mar {mar}</span>}
        {isContainer && typeof gap === "number" && <span>gap {gap}</span>}
        {isContainer && <span>{node.children.length} child{node.children.length === 1 ? "" : "ren"}</span>}
        {isContainer && wraps && lineCount > 0 && (
          <span>{lineCount} line{lineCount === 1 ? "" : "s"}</span>
        )}
      </div>
    </div>
  );
}

// ============================================================================
//  Main app
// ============================================================================
function FlexCraft() {
  // history: { past:[], present:tree, future:[] }
  const [history, setHistory] = useState(() => ({
    past: [],
    present: initialTree(),
    future: [],
  }));
  const tree = history.present;

  const [selectedId, setSelectedId] = useState(null);
  const [dropTarget, setDropTarget] = useState(null);
  const [tab, setTab] = useState("css"); // code drawer: css | html
  const [codeEditing, setCodeEditing] = useState(false); // freeform whole-panel edit
  const [codeDraft, setCodeDraft] = useState("");        // textarea contents while editing
  const [theme, setTheme] = useState("dark");
  const [mobilePane, setMobilePane] = useState("canvas"); // canvas|add|style|code
  const [showBoxModel, setShowBoxModel] = useState(false);
  const [showLines, setShowLines] = useState(false);
  const [hidePills, setHidePills] = useState(false);
  const [syncDims, setSyncDims] = useState(false);
  const [drawerHeight, setDrawerHeight] = useState(170);
  const [leftWidth, setLeftWidth] = useState(210);
  const [rightWidth, setRightWidth] = useState(290);
  const [leftCollapsed, setLeftCollapsed] = useState(false);
  const [rightCollapsed, setRightCollapsed] = useState(false);
  const [isDragging, setIsDragging] = useState(false);
  const [showTooltip, setShowTooltip] = useState(true); // hover readout, on by default
  const [hoverInfo, setHoverInfo] = useState(null); // { node, rect, x, y }
  // Keybinding for the hover tooltip. `tipKey` is a descriptor:
  //   { kind:'modifier'|'key', value:'Control'|'Shift'|'Alt'|'Meta'|<key> }
  // Pressing the bound key TOGGLES the tooltip on/off, exactly like clicking the
  // toolbar button. (Modifiers toggle on keydown too — a tap of Ctrl flips it.)
  const [tipKey, setTipKey] = useState({ kind: "modifier", value: "Control" });
  const [bindingKey, setBindingKey] = useState(false); // "press a key…" capture mode
  const [rapidAdd, setRapidAdd] = useState(false);
  const dragState = useRef(null);
  const importInputRef = useRef(null);

  // Track drag in progress at the window level (drag events bubble, so one pair
  // of listeners catches every drag regardless of which element started it).
  // Drives dropzone sizing: zones are zero-size normally and only expand while
  // dragging — so the canvas renders TRUE flexbox (gap:0 is really 0) and the
  // 8px dropzones no longer inflate the layout. (Bug found via devtools: the
  // "gap" that wouldn't go to zero was actually the fixed-size div.fc-dropzone.)
  useEffect(() => {
    const start = () => setIsDragging(true);
    const stop = () => setIsDragging(false);
    window.addEventListener("dragstart", start);
    window.addEventListener("dragend", stop);
    window.addEventListener("drop", stop);
    return () => {
      window.removeEventListener("dragstart", start);
      window.removeEventListener("dragend", stop);
      window.removeEventListener("drop", stop);
    };
  }, []);

  // commit a new tree, pushing the old one onto the undo stack
  const commit = useCallback((producer) => {
    setHistory((h) => {
      const next =
        typeof producer === "function" ? producer(h.present) : producer;
      if (next === h.present) return h;
      return { past: [...h.past, h.present], present: next, future: [] };
    });
  }, []);

  const undo = useCallback(() => {
    setHistory((h) => {
      if (!h.past.length) return h;
      const prev = h.past[h.past.length - 1];
      return {
        past: h.past.slice(0, -1),
        present: prev,
        future: [h.present, ...h.future],
      };
    });
  }, []);
  const redo = useCallback(() => {
    setHistory((h) => {
      if (!h.future.length) return h;
      const [next, ...rest] = h.future;
      return { past: [...h.past, h.present], present: next, future: rest };
    });
  }, []);

  // keyboard: cmd/ctrl-z, shift for redo
  useEffect(() => {
    const onKey = (e) => {
      const mod = e.metaKey || e.ctrlKey;
      if (mod && e.key.toLowerCase() === "z") {
        e.preventDefault();
        e.shiftKey ? redo() : undo();
      }
    };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, [undo, redo]);

  // Tooltip keybinding. Two modes:
  //  · capture mode (bindingKey): the next keypress becomes the new binding.
  //  · normal mode: pressing the bound key toggles the tooltip on/off, same as
  //    the toolbar button. Modifiers count as a "press" on their own keydown.
  const MOD_NAMES = { Control: "Control", Shift: "Shift", Alt: "Alt", Meta: "Meta" };
  useEffect(() => {
    const onDown = (e) => {
      // Capture mode: record whatever was pressed, then exit capture.
      if (bindingKey) {
        e.preventDefault();
        if (MOD_NAMES[e.key]) {
          setTipKey({ kind: "modifier", value: MOD_NAMES[e.key] });
        } else if (e.key === "Escape") {
          // Escape cancels rebinding without changing the current key.
        } else {
          setTipKey({ kind: "key", value: e.key.length === 1 ? e.key.toLowerCase() : e.key });
        }
        setBindingKey(false);
        return;
      }
      // Normal mode: did the bound key just go down? Ignore auto-repeat so a
      // held key doesn't flap the toggle.
      if (e.repeat) return;

      // GUARD (applies to ALL shortcuts below): never fire while the user is
      // typing in a field or editing element text inline. Checked here, before
      // the tooltip key, so even a letter-bound tooltip key yields to typing.
      const tag = (e.target && e.target.tagName) || "";
      const inCE =
        (e.target && e.target.isContentEditable) ||
        (e.target && e.target.closest && e.target.closest('[contenteditable="true"]'));
      const typing = tag === "INPUT" || tag === "TEXTAREA" || inCE;

      const tipMatches =
        tipKey.kind === "modifier"
          ? MOD_NAMES[e.key] === tipKey.value
          : (e.key.length === 1 ? e.key.toLowerCase() : e.key) === tipKey.value;
      if (tipMatches && !(typing && tipKey.kind === "key")) {
        // Don't preventDefault for bare modifiers (would swallow other combos);
        // only for our own regular-key binding. (A modifier tooltip key like
        // Ctrl still works while editing; a letter-bound one yields to typing.)
        if (tipKey.kind === "key") e.preventDefault();
        setShowTooltip((v) => !v);
        return; // tooltip key wins if it happens to collide with a letter below
      }

      // Fixed letter shortcuts for the overlay toggles. Suppressed when typing
      // in a field / editing text, or while modifier combos are held (so we
      // don't hijack browser shortcuts like Ctrl-L). Bare lowercase letters only.
      if (typing || e.ctrlKey || e.metaKey || e.altKey) return;
      switch (e.key.toLowerCase()) {
        case "b": setShowBoxModel((v) => !v); break;   // box model
        case "l": setShowLines((v) => !v); break;      // flex lines
        case "p": setHidePills((v) => !v); break;      // name pills
        case "r": setSyncDims((v) => !v); break;       // sync width/height
        default: break;
      }
    };
    window.addEventListener("keydown", onDown);
    return () => window.removeEventListener("keydown", onDown);
  }, [tipKey, bindingKey]);


  const selected = useMemo(
    () => (selectedId ? findNode(tree, selectedId) : null),
    [tree, selectedId]
  );
  const selectedParent = useMemo(
    () => (selectedId ? findParent(tree, selectedId) : null),
    [tree, selectedId]
  );

  const setStyle = useCallback(
    (patch) => {
      if (!selectedId) return;
      commit((t) => updateStyles(t, selectedId, patch));
    },
    [selectedId, commit]
  );

  // Live resize from edge handles. A drag fires many pointermove events; if each
  // pushed onto the undo stack we'd get hundreds of micro-steps. So we coalesce:
  // the FIRST update of a drag snapshots history, the rest just replace present.
  // `resizeActive` tracks whether we're mid-drag; it resets on pointerup.
  const resizeActive = useRef(false);
  useEffect(() => {
    const end = () => {
      resizeActive.current = false;
    };
    window.addEventListener("pointerup", end);
    return () => window.removeEventListener("pointerup", end);
  }, []);

  const onResize = useCallback((id, patch) => {
    setHistory((h) => {
      const next = updateStyles(h.present, id, patch);
      if (next === h.present) return h;
      if (!resizeActive.current) {
        // First move of this drag → snapshot the pre-drag tree onto history.
        resizeActive.current = true;
        return { past: [...h.past, h.present], present: next, future: [] };
      }
      // Subsequent moves → replace present in place, no new history entry.
      return { ...h, present: next };
    });
  }, []);

  // Commit edited text for a leaf node (one undo entry per edit). mapTree keeps
  // the tree immutable; only the target node's `text` changes.
  const onText = useCallback((id, text) => {
    commit((t) => mapTree(t, (n) => (n.id === id ? { ...n, text } : n)));
  }, [commit]);

  // ---- site export (A: download one runnable .html · C: copy full document) -
  const [siteMsg, setSiteMsg] = useState(null); // transient feedback for export/import
  const [pendingExport, setPendingExport] = useState(null); // "download" | "copy" while the border prompt is open
  const flashMsg = useCallback((m) => {
    setSiteMsg(m);
    setTimeout(() => setSiteMsg(null), 3500);
  }, []);

  // ---- FREEFORM whole-panel code editing (experimental) --------------------
  // Reparse the ENTIRE panel on commit (never per keystroke). Guardrails (b+c):
  //  (c) reject if the edit doesn't yield a usable result — keep current tree;
  //  (b) whatever DOES apply goes through one atomic commit() → single undo.

  // CSS whole-panel: reparse all `.class { … }` rules and reapply to matching
  // nodes by class (the export class is `${tag}-${id}`). Properties beyond the
  // tool's vocabulary are KEPT. Unmatched rules are ignored (reported).
  const onCommitCssAll = useCallback((text) => {
    // parse every rule, keeping ALL props (not just KNOWN ones)
    const clean = (text || "").replace(/\/\*[\s\S]*?\*\//g, "");
    const ruleRe = /\.([A-Za-z0-9_-]+)\s*\{([^}]*)\}/g;
    const byClass = {};
    let m, ruleCount = 0;
    while ((m = ruleRe.exec(clean))) {
      ruleCount += 1;
      const { styles } = parseDeclsToStyles("{" + m[2] + "}");
      byClass[m[1]] = styles;
    }
    if (ruleCount === 0) {                       // (c) nothing usable → reject
      flashMsg("No CSS rules found — kept current styles");
      return false;
    }
    let applied = 0;
    commit((t) =>                                // (b) one atomic commit
      mapTree(t, (n) => {
        const cls = `${n.tag}-${n.id}`;
        if (cls in byClass) { applied += 1; return { ...n, styles: byClass[cls] }; }
        return n;
      })
    );
    flashMsg(`Applied CSS to ${applied} element${applied === 1 ? "" : "s"}`);
    return true;
  }, [commit, flashMsg]);

  // HTML whole-panel: rebuild the WHOLE tree from edited markup via parseImport
  // (using the current CSS for styling). This is the "rewrite structure / add
  // custom elements" path — bounded by what the tree can represent (divs, class,
  // text, nesting). Re-ids nodes, so selection resets.
  const onCommitHtmlAll = useCallback((text) => {
    const r = parseImport(text, exportCss(tree));
    if (!r.tree) {                               // (c) parse failed → reject
      flashMsg(r.error || "Couldn't parse HTML — kept current layout");
      return false;
    }
    commit(() => r.tree);                        // (b) one atomic commit
    setSelectedId(null);
    const skipped = r.skippedProps.length
      ? ` · skipped ${[...new Set(r.skippedProps)].slice(0, 4).join(", ")}`
      : "";
    flashMsg(`Rebuilt ${r.count} element${r.count === 1 ? "" : "s"} from HTML${skipped}`);
    return true;
  }, [commit, flashMsg, tree]);

  // Produce the output (download or copy) from a given tree.
  const doExport = useCallback((mode, srcTree) => {
    const doc = buildStandaloneSite(exportHtml(srcTree), exportCss(srcTree));
    if (mode === "copy") {
      navigator.clipboard?.writeText(doc);
      flashMsg("Copied full runnable HTML to clipboard");
      return;
    }
    // (A) try a Blob download; fall back to clipboard if the sandbox blocks it.
    try {
      const blob = new Blob([doc], { type: "text/html" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "flexcraft-layout.html";
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      flashMsg("Downloaded flexcraft-layout.html");
    } catch (err) {
      navigator.clipboard?.writeText(doc);
      flashMsg("Download blocked — copied full HTML to clipboard instead");
    }
  }, [flashMsg]);

  // Add a 1px solid blue border to every element that doesn't already have one
  // (don't clobber deliberate per-element borders). Returns a NEW tree.
  const withBordersAll = useCallback((t) =>
    mapTree(t, (n) =>
      (n.styles.borderWidth ?? 0) > 0
        ? n
        : { ...n, styles: { ...n.styles, borderWidth: 1, borderStyle: "solid", borderColor: "blue" } }
    ), []);

  // Public entry points: open the border prompt, remembering which output mode.
  const exportSite = useCallback(() => setPendingExport("download"), []);
  const copySite = useCallback(() => setPendingExport("copy"), []);

  // Resolve the prompt. "all" exports a bordered COPY without touching the
  // editor (borders live only in the output file); "current" exports as-is.
  const resolveExport = useCallback((choice) => {
    const mode = pendingExport;
    setPendingExport(null);
    if (!mode) return;
    if (choice === "all") {
      doExport(mode, withBordersAll(tree)); // bordered copy — editor unchanged
    } else if (choice === "current") {
      doExport(mode, tree);
    }
    // choice === "cancel" → do nothing
  }, [pendingExport, tree, withBordersAll, doExport]);

  // ---- import (FlexCraft-shaped HTML, or HTML + CSS) ------------------------
  // Honest scope: this reliably round-trips OUR exports (flat class→rule CSS,
  // class on each element). Foreign files import what's understood and report
  // what was skipped, rather than crashing or silently mangling.
  const importFiles = useCallback(
    (htmlStr, cssStr) => {
      const result = parseImport(htmlStr, cssStr);
      if (!result.tree) {
        flashMsg(result.error || "Couldn't parse that file");
        return;
      }
      commit(() => result.tree);
      setSelectedId(null);
      const skipped = result.skippedProps.length
        ? ` · skipped ${result.skippedProps.length} unsupported prop${result.skippedProps.length === 1 ? "" : "s"}: ${[...new Set(result.skippedProps)].slice(0, 5).join(", ")}`
        : "";
      flashMsg(`Imported ${result.count} element${result.count === 1 ? "" : "s"}${skipped}`);
    },
    [commit, flashMsg]
  );

  const onImportPick = useCallback(
    (e) => {
      const files = Array.from(e.target.files || []);
      if (!files.length) return;
      const htmlFile = files.find((f) => /\.html?$/i.test(f.name)) || files[0];
      const cssFile = files.find((f) => /\.css$/i.test(f.name));
      const readFile = (f) =>
        new Promise((res) => {
          const r = new FileReader();
          r.onload = () => res(r.result);
          r.onerror = () => res("");
          r.readAsText(f);
        });
      Promise.all([htmlFile ? readFile(htmlFile) : "", cssFile ? readFile(cssFile) : ""]).then(
        ([h, c]) => importFiles(h, c)
      );
      e.target.value = ""; // allow re-importing the same file
    },
    [importFiles]
  );

  const startDrawerResize = useCallback((e) => {
    e.preventDefault();
    const startY = e.clientY;
    const startH = drawerHeight;
    const onMove = (ev) => {
      const dy = ev.clientY - startY; // down = positive → smaller drawer
      const next = Math.min(560, Math.max(60, Math.round(startH - dy)));
      setDrawerHeight(next);
    };
    const onUp = () => {
      window.removeEventListener("pointermove", onMove);
      window.removeEventListener("pointerup", onUp);
    };
    window.addEventListener("pointermove", onMove);
    window.addEventListener("pointerup", onUp);
  }, [drawerHeight]);

  // Side-panel width resizers. The left panel's grip is on its RIGHT edge, so
  // dragging right (+dx) grows it. The right panel's grip is on its LEFT edge,
  // so dragging left (−dx) grows it — hence the inverted sign. Clamped to sane
  // bounds; overflow inside the panel is fine (user explicitly OK'd it).
  const startLeftResize = useCallback((e) => {
    e.preventDefault();
    const startX = e.clientX;
    const startW = leftWidth;
    const onMove = (ev) => {
      const dx = ev.clientX - startX;
      setLeftWidth(Math.min(420, Math.max(120, Math.round(startW + dx))));
    };
    const onUp = () => {
      window.removeEventListener("pointermove", onMove);
      window.removeEventListener("pointerup", onUp);
    };
    window.addEventListener("pointermove", onMove);
    window.addEventListener("pointerup", onUp);
  }, [leftWidth]);

  const startRightResize = useCallback((e) => {
    e.preventDefault();
    const startX = e.clientX;
    const startW = rightWidth;
    const onMove = (ev) => {
      const dx = ev.clientX - startX;
      setRightWidth(Math.min(460, Math.max(160, Math.round(startW - dx))));
    };
    const onUp = () => {
      window.removeEventListener("pointermove", onMove);
      window.removeEventListener("pointerup", onUp);
    };
    window.addEventListener("pointermove", onMove);
    window.addEventListener("pointerup", onUp);
  }, [rightWidth]);

  // Reset a single property to its factory default for this element's type.
  // If the property isn't part of the factory defaults, fall back to "auto".
  const resetProp = useCallback(
    (key) => {
      if (!selected) return;
      // Border longhands reset as a group → clear the whole border.
      if (key === "borderWidth" || key === "borderStyle" || key === "borderColor") {
        setStyle({ borderWidth: undefined, borderStyle: undefined, borderColor: undefined });
        return;
      }
      const def = defaultsFor(selected);
      const value = key in def ? def[key] : "auto";
      setStyle({ [key]: value });
    },
    [selected, setStyle]
  );

  // Reset the whole element's styles to its factory defaults (preserving any
  // structural styles the factory doesn't manage, like the root's minHeight).
  const resetElement = useCallback(() => {
    if (!selected) return;
    const def = defaultsFor(selected);
    commit((t) =>
      mapTree(t, (n) =>
        n.id === selected.id ? { ...n, styles: { ...def } } : n
      )
    );
  }, [selected, commit]);

  const onDropNew = useCallback(
    (parentId, idx, factory) => {
      const node = factory();
      commit((t) => insertNode(t, parentId, idx, node));
      // Rapid-add: keep the container (parent) selected for continuous drops.
      setSelectedId(rapidAdd ? parentId : node.id);
    },
    [commit, rapidAdd]
  );

  const onDropMove = useCallback(
    (parentId, idx, id) => {
      commit((t) => {
        const moving = findNode(t, id);
        if (!moving) return t;
        if (findNode(moving, parentId)) return t; // can't drop into own subtree
        const [without, removed] = removeNode(t, id);
        if (!removed) return t;
        const parent = findNode(without, parentId);
        return insertNode(
          without,
          parentId,
          Math.min(idx, parent.children.length),
          removed
        );
      });
    },
    [commit]
  );

  const deleteSelected = () => {
    if (!selectedId || selectedId === tree.id) return;
    commit((t) => removeNode(t, selectedId)[0]);
    setSelectedId(null);
  };
  const duplicateSelected = () => {
    if (!selectedId || selectedId === tree.id) return;
    let newId = null;
    commit((t) => {
      const [next, id] = duplicateNode(t, selectedId);
      newId = id;
      return next;
    });
    if (newId) setSelectedId(newId);
  };
  const convertToContainer = () => selected && setStyle(makeContainer().styles);

  // tap palette item: append to selected container (or root). In RAPID-ADD mode
  // we keep the CONTAINER selected instead of selecting the new child, so you
  // can fire off additions continuously without re-clicking the container.
  const addToCanvas = (factory) => {
    const target =
      selected && selected.styles.display === "flex" ? selected : tree;
    const node = factory();
    commit((t) => insertNode(t, target.id, target.children.length, node));
    setSelectedId(rapidAdd ? target.id : node.id);
    setMobilePane("canvas");
  };

  const palette = [
    { label: "Flex container", factory: makeContainer, hint: "display:flex", icon: "▦" },
    { label: "Box", factory: makeBox, hint: "a flex item", icon: "▢" },
  ];

  const cssText = useMemo(() => exportCss(tree), [tree]);
  const htmlText = useMemo(() => exportHtml(tree), [tree]);
  const cssSegs = useMemo(() => exportCssSegments(tree), [tree]);
  const htmlSegs = useMemo(() => exportHtmlSegments(tree), [tree]);

  const isFlexItem =
    selected && selectedParent && selectedParent.styles.display === "flex";
  const isContainer = selected && selected.styles.display === "flex";

  // ---- sub-renders (shared between desktop panes and mobile tabs) ----------
  const PalettePanel = (
    <div className="fc-palette-inner">
      <div className="fc-palette-head">Elements</div>
      {palette.map((p) => (
        <div
          key={p.label}
          draggable
          onDragStart={(e) => {
            dragState.current = { kind: "new", factory: p.factory };
            e.dataTransfer.effectAllowed = "copy";
          }}
          onDragEnd={() => {
            dragState.current = null;
            setDropTarget(null);
          }}
          onClick={() => addToCanvas(p.factory)}
          className="fc-palette-item"
        >
          <span className="fc-palette-icon">{p.icon}</span>
          <div>
            <div className="fc-palette-name">{p.label}</div>
            <code className="fc-palette-hint">{p.hint}</code>
          </div>
        </div>
      ))}
      {/* Rapid-add: when on, adding keeps the container selected so you can
          append items continuously instead of re-selecting each time. Only
          meaningful when a container (or root) is the active add target. */}
      {(isContainer || !selected) && (
        <button
          className={"fc-rapid-toggle" + (rapidAdd ? " is-on" : "")}
          onClick={() => setRapidAdd((v) => !v)}
          title="Keep the container selected after adding, for rapid additions"
        >
          <span className="fc-rapid-pin">{rapidAdd ? "⊙" : "○"}</span>
          <span>
            Rapid add{" "}
            <b>{rapidAdd ? "ON" : "OFF"}</b>
            {rapidAdd && (
              <span className="fc-rapid-target">
                → {(selected && selected.styles.display === "flex" ? selected.label : "Root")}
              </span>
            )}
          </span>
        </button>
      )}
      <div className="fc-palette-head" style={{ marginTop: 18 }}>
        Layers
      </div>
      <div className="fc-layers">
        <LayerRow
          node={tree}
          depth={0}
          selectedId={selectedId}
          onSelect={(id) => {
            setSelectedId(id);
            setMobilePane("style");
          }}
        />
      </div>
      <div className="fc-palette-head" style={{ marginTop: 18 }}>
        Shortcuts
      </div>
      <div className="fc-shortcut-row">
        <div className="fc-shortcut-label">
          Hover info
          <span className="fc-shortcut-sub">press to toggle</span>
        </div>
        <button
          className={"fc-keycap" + (bindingKey ? " is-binding" : "")}
          onClick={() => setBindingKey((v) => !v)}
          title="Click, then press a key to rebind"
        >
          {bindingKey ? "press a key…" : keyLabel(tipKey)}
        </button>
      </div>
      <div className="fc-shortcut-list">
        {[
          { k: "B", label: "Box model", on: showBoxModel },
          { k: "L", label: "Flex lines", on: showLines },
          { k: "P", label: "Name pills", on: hidePills },
          { k: "R", label: "Sync W/H", on: syncDims },
        ].map((s) => (
          <div className={"fc-shortcut-mini" + (s.on ? " is-on" : "")} key={s.k}>
            <span className={"fc-keycap fc-keycap-static" + (s.on ? " is-on" : "")}>{s.k}</span>
            <span>{s.label}</span>
          </div>
        ))}
      </div>
      <div className="fc-palette-note">
        Drag onto the canvas (desktop) or <b>tap</b> to drop into the selected
        container. Drag existing elements to the glowing gaps to reorder.
      </div>
    </div>
  );

  // Helper: per-control reset wiring. `modified` lights the ↺; `onReset` fires it.
  const rp = (key) =>
    selected
      ? { modified: !isDefaultValue(selected, key), onReset: () => resetProp(key) }
      : {};

  // Measure the selected element's actual rendered size from the DOM, so the
  // width/height "fixed" toggle seeds with the real current size (e.g. 1000×500)
  // instead of a constant. Read at render time via the data-node-id attribute.
  const measuredSize = (() => {
    if (!selected || typeof document === "undefined") return {};
    const el = document.querySelector(`[data-node-id="${selected.id}"]`);
    if (!el) return {};
    const r = el.getBoundingClientRect();
    return { w: r.width, h: r.height };
  })();

  // Hover readout: on mouse move over the canvas, find the nearest node element
  // under the cursor, measure it, and stash its tree node + rect + pointer pos.
  // Suppressed during a drag (tooltip would just be in the way). Cleared on leave.
  const onCanvasHover = useCallback(
    (e) => {
      if (!showTooltip || isDragging) {
        if (hoverInfo) setHoverInfo(null);
        return;
      }
      const elt = e.target.closest && e.target.closest("[data-node-id]");
      if (!elt) {
        if (hoverInfo) setHoverInfo(null);
        return;
      }
      const id = elt.getAttribute("data-node-id");
      const node = findNode(tree, id);
      if (!node) return;
      const rect = elt.getBoundingClientRect();
      setHoverInfo({ node, rect, x: e.clientX, y: e.clientY });
    },
    [showTooltip, isDragging, hoverInfo, tree]
  );
  const onCanvasLeave = useCallback(() => {
    if (hoverInfo) setHoverInfo(null);
  }, [hoverInfo]);

  const PropsPanel = !selected ? (
    <div className="fc-empty">
      <div className="fc-empty-mark">↖</div>
      <p>Select an element to edit its flex properties.</p>
    </div>
  ) : (
    <div className="fc-props-inner">
      <div className="fc-prop-head">
        <div>
          <div className="fc-prop-title">{selected.label}</div>
          <code className="fc-prop-id">
            .{selected.tag}-{selected.id}
          </code>
        </div>
        <div className="fc-prop-actions">
          <button className="fc-icon-btn" title="Reset to defaults" onClick={resetElement}>
            ↺
          </button>
          {selected.id !== tree.id && (
            <>
              <button className="fc-icon-btn" title="Duplicate" onClick={duplicateSelected}>
                ⧉
              </button>
              <button className="fc-icon-btn is-danger" title="Delete" onClick={deleteSelected}>
                ✕
              </button>
            </>
          )}
        </div>
      </div>

      {isContainer ? (
        <section>
          <div className="fc-section-label">
            Container <span className="fc-tag-pill">display: flex</span>
