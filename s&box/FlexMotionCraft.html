<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>FlexMotionCraft — animation & transition designer</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #0d0f14; }
  #root { height: 100%; }
  #boot {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    font-family: ui-monospace, monospace; color: #8b91a3; font-size: 13px; text-align: center;
    padding: 24px; line-height: 1.6;
  }
</style>
<script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
<div id="root"></div>
<div id="boot">Loading FlexMotionCraft&hellip;<br/><span style="font-size:11px">(needs internet on first load to fetch React from CDN)</span></div>

<script type="text/babel" data-presets="react">
document.getElementById('boot').remove();
const { useState, useRef, useCallback, useMemo, useEffect, useReducer } = React;

/* ============================================================================
   FlexMotionCraft — animation, transition & SVG attribute designer
   ----------------------------------------------------------------------------
   Companion tool to FlexCraft. Takes FlexCraft's HTML + CSS output (or any
   HTML + CSS pair) and layers transitions, keyframe animations, and SVG
   attribute animation on top. Exports the original HTML unchanged + an
   augmented CSS file.

   Data model per element:
     { id, tag, className, label, depth, svgAttrs:{} }
   Animations stored separately:
     transitions: { [elementId]: { property, duration, easing, delay } }
     keyframes:   { [animId]: { name, elementId, stops:[{offset,props:{}}] } }
   ============================================================================ */

// ── EASING PRESETS ──────────────────────────────────────────────────────────
const EASINGS = [
  { value: "linear",                        label: "linear" },
  { value: "ease",                          label: "ease" },
  { value: "ease-in",                       label: "ease-in" },
  { value: "ease-out",                      label: "ease-out" },
  { value: "ease-in-out",                   label: "ease-in-out" },
  { value: "cubic-bezier(0.34,1.56,0.64,1)", label: "spring" },
  { value: "cubic-bezier(0.87,0,0.13,1)",   label: "sharp" },
  { value: "steps(4,end)",                  label: "steps(4)" },
  { value: "__steps_custom__",              label: "steps (custom)…" },
  { value: "__cubic_custom__",              label: "cubic-bezier (custom)…" },
];

// Cubic-bezier curve data for the EasingCurve visualizer
const EASING_CURVES = {
  "linear":       [[0,0],[0.33,0.33],[0.66,0.66],[1,1]],
  "ease":         [[0,0],[0.25,0.1],[0.25,1],[1,1]],
  "ease-in":      [[0,0],[0.42,0],[1,1],[1,1]],
  "ease-out":     [[0,0],[0,0],[0.58,1],[1,1]],
  "ease-in-out":  [[0,0],[0.42,0],[0.58,1],[1,1]],
  "cubic-bezier(0.34,1.56,0.64,1)": [[0,0],[0.34,1.56],[0.64,1],[1,1]],
  "cubic-bezier(0.87,0,0.13,1)":    [[0,0],[0.87,0],[0.13,1],[1,1]],
};

// ── PROPERTY DEFINITIONS ─────────────────────────────────────────────────────
// Each property has a type that determines what sub-controls appear.
// Types: color | opacity | px | transform | shadow | filter | text
const PROP_DEFS = {
  "all":            { type:"text",      default:"" },          // CSS "all" keyword shorthand
  "opacity":        { type:"opacity",   default:"1" },
  "transform":      { type:"transform", default:"none" },
  "background-color":{ type:"color",   default:"#ffffff" },
  "color":          { type:"color",     default:"#000000" },
  "border-color":   { type:"color",     default:"#000000" },
  "width":          { type:"px",        default:"100",  min:0,   max:2000 },
  "height":         { type:"px",        default:"100",  min:0,   max:2000 },
  "padding":        { type:"px",        default:"0",    min:0,   max:200  },
  "margin":         { type:"px",        default:"0",    min:-200,max:200  },
  "border-radius":  { type:"px",        default:"0",    min:0,   max:200  },
  "box-shadow":     { type:"shadow",    default:"0px 0px 0px 0px #000000" },
  "font-size":      { type:"px",        default:"16",   min:1,   max:200  },
  "letter-spacing": { type:"px",        default:"0",    min:-10, max:50   },
  "filter":         { type:"filter",    default:"none" },
};
const ANIMATABLE_PROPS = Object.keys(PROP_DEFS);

const SVG_ANIMATABLE = [
  "fill","stroke","stroke-width","stroke-dasharray","stroke-dashoffset",
  "opacity","r","cx","cy","x","y","width","height","rx","ry",
];

// ── HTML PARSER ─────────────────────────────────────────────────────────────

// Detect whether a file is a combined HTML document (has <style> in <head>)
// vs bare markup. Returns { isCombined, bodyHtml, extractedCss }.
function splitCombinedHtml(rawStr) {
  const parser = new DOMParser();
  const doc = parser.parseFromString(rawStr, "text/html");

  // Collect all <style> blocks from <head>
  const styleEls = Array.from(doc.head.querySelectorAll("style"));
  const extractedCss = styleEls.map(s => s.textContent).join("\n").trim();
  const isCombined = styleEls.length > 0;

  // Body inner HTML is the markup we animate
  const bodyHtml = doc.body.innerHTML.trim();

  return { isCombined, bodyHtml, extractedCss };
}

function parseHtmlElements(bodyHtml) {
  const parser = new DOMParser();
  // Wrap bare markup in a full doc so DOMParser is happy
  const doc = parser.parseFromString(`<html><body>${bodyHtml}</body></html>`, "text/html");
  const elements = [];
  let seq = 0;

  function walk(node, depth) {
    if (node.nodeType !== 1) return; // elements only
    const tag = node.tagName.toLowerCase();
    if (["html","head","body","script","style","meta","link","title"].includes(tag)) {
      Array.from(node.children).forEach(c => walk(c, depth));
      return;
    }
    const className = node.className || "";
    const id = node.id || "";
    const label = id
      ? `#${id}`
      : className
        ? `.${className.trim().split(/\s+/)[0]}`
        : tag;

    elements.push({
      uid: `el-${seq++}`,
      tag,
      className,
      elId: id,
      label,
      depth,
      isSvg: tag === "svg" || (node.namespaceURI && node.namespaceURI.includes("svg")),
      isSvgChild: !!(node.closest && node.closest("svg")),
    });
    Array.from(node.children).forEach(c => walk(c, depth + 1));
  }

  const body = doc.body;
  Array.from(body.children).forEach(c => walk(c, 0));
  return elements;
}

// ── CSS PARSER ───────────────────────────────────────────────────────────────
function parseCssRules(cssStr) {
  // Returns array of { selector, declarations }
  const clean = cssStr.replace(/\/\*[\s\S]*?\*\//g, "");
  const rules = [];
  const re = /([^{]+)\{([^}]*)\}/g;
  let m;
  while ((m = re.exec(clean)) !== null) {
    const selector = m[1].trim();
    if (selector.startsWith("@")) continue; // skip @keyframes etc for now
    rules.push({ selector, declarations: m[2].trim() });
  }
  return rules;
}

// ── CSS EXPORT ───────────────────────────────────────────────────────────────
function buildAugmentedCss(originalCss, transitions, keyframeAnims) {
  let out = originalCss.trimEnd() + "\n\n/* ── MotionCraft additions ── */\n";

  // Group transition rules by selector.
  // Each rule: { selector, property, baseValue, targetValue, trigger, duration, easing, delay }
  const transBySel    = {}; // selector → [transition shorthand strings]
  const baseBySel     = {}; // selector → { prop: baseValue }
  const targetBySel   = {}; // triggerSelector → { prop: targetValue }

  for (const rules of Object.values(transitions)) {
    const ruleArr = Array.isArray(rules) ? rules : (rules ? [rules] : []);
    for (const t of ruleArr) {
      if (t.disabled) continue;  // rule is disabled — skip CSS emission
      if (!t.property) continue;
      const sel = t.selector && t.selector.trim() ? t.selector.trim() : null;
      if (!sel) continue;

      // transition declaration on the base selector
      if (!transBySel[sel]) transBySel[sel] = [];
      const tVal = t.property + " " + (t.duration||300) + "ms " + (t.easing||"ease")
        + (t.delay ? " " + t.delay + "ms" : "");
      transBySel[sel].push(tVal);

      // base value on plain selector
      const baseV = t.baseValue || t.value || "";
      const propDefault = PROP_DEFS[t.property]?.default ?? "";
      if (baseV && baseV !== "" && baseV !== propDefault) {
        if (!baseBySel[sel]) baseBySel[sel] = {};
        baseBySel[sel][t.property] = baseV;
      }

      // target value on trigger selector
      const targetV = t.targetValue || "";
      if (targetV && targetV !== "" && targetV !== propDefault) {
        const trigger = t.trigger === " custom"
          ? (t.customTrigger || ":hover") : (t.trigger || ":hover");
        // Trigger is either a pseudo-class (:hover) or a sibling class (.is-open)
        const triggerSel = trigger.startsWith(".")
          ? sel + trigger        // .div-n3.is-open
          : sel + trigger;       // .div-n3:hover
        if (!targetBySel[triggerSel]) targetBySel[triggerSel] = {};
        targetBySel[triggerSel][t.property] = targetV;
      }
    }
  }

  // Emit transition declarations
  for (const [sel, vals] of Object.entries(transBySel)) {
    out += "\n" + sel + " {\n  transition: " + vals.join(", ") + ";\n}\n";
  }
  // Emit base state values
  for (const [sel, props] of Object.entries(baseBySel)) {
    if (!Object.keys(props).length) continue;
    out += "\n" + sel + " {\n";
    for (const [p, v] of Object.entries(props)) out += "  " + p + ": " + v + ";\n";
    out += "}\n";
  }
  // Emit trigger state values
  for (const [trigSel, props] of Object.entries(targetBySel)) {
    if (!Object.keys(props).length) continue;
    out += "\n" + trigSel + " {\n";
    for (const [p, v] of Object.entries(props)) out += "  " + p + ": " + v + ";\n";
    out += "}\n";
  }

  // Keyframe animations
  for (const anim of Object.values(keyframeAnims)) {
    if (anim.disabled) continue;  // disabled — skip
    if (!anim.name || anim.stops.length < 2) continue;
    out += `\n@keyframes ${anim.name} {\n`;
    for (const stop of anim.stops) {
      out += `  ${stop.offset}% {\n`;
      for (const [prop, val] of Object.entries(stop.props)) {
        if (val) out += `    ${prop}: ${val};\n`;
      }
      out += `  }\n`;
    }
    out += `}\n`;
    if (anim.selector) {
      const dir      = anim.direction  || "normal";
      const fill     = anim.fillMode   || "both";
      const iter     = anim.iterationCount || 1;
      const play     = anim.playState  || "running";
      const shorthand = anim.name + " " + anim.duration + "ms " + anim.easing
        + " " + iter + " " + dir + " " + fill;
      out += anim.selector + " {\n  animation: " + shorthand + ";\n";
      if (play === "paused") out += "  animation-play-state: paused;\n";
      out += "}\n";
    }
  }

  return out;
}

// ── UID ──────────────────────────────────────────────────────────────────────
let _seq = 1;
const uid = () => `mc${_seq++}`;

// ── CONTROL PRIMITIVES ───────────────────────────────────────────────────────
function FieldLabel({ label, children }) {
  return (
    <div className="mc-field">
      <div className="mc-field-label">{label}</div>
      {children}
    </div>
  );
}

function Seg({ value, options, onChange }) {
  return (
    <div className="mc-segmented">
      {options.map(o => {
        const v = typeof o === "string" ? o : o.value;
        const l = typeof o === "string" ? o : o.label;
        return (
          <button key={v}
            className={"mc-seg-btn" + (value === v ? " is-active" : "")}
            onClick={() => onChange(v)}
          >{l}</button>
        );
      })}
    </div>
  );
}

// Slider that uses input[range] but does NOT jump on mousedown —
// value only commits on change (drag), not on the initial click.
function Slider({ label, value, min, max, step = 1, suffix = "", onChange }) {
  const [dragging, setDragging] = useState(false);
  const [local, setLocal] = useState(value);

  useEffect(() => { if (!dragging) setLocal(value); }, [value, dragging]);

  return (
    <FieldLabel label={<>{label} <span className="mc-field-val">{local}{suffix}</span></>}>
      <input type="range" className="mc-range"
        min={min} max={max} step={step}
        value={local}
        onMouseDown={() => setDragging(true)}
        onChange={e => { setLocal(Number(e.target.value)); }}
        onMouseUp={e => { setDragging(false); onChange(Number(e.target.value)); }}
        onTouchEnd={e => { setDragging(false); onChange(Number(local)); }}
      />
    </FieldLabel>
  );
}

function Select({ label, value, options, onChange }) {
  return (
    <FieldLabel label={label}>
      <select className="mc-select" value={value} onChange={e => onChange(e.target.value)}>
        {options.map(o => {
          const v = typeof o === "string" ? o : o.value;
          const l = typeof o === "string" ? o : o.label;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </FieldLabel>
  );
}

function TextInput({ label, value, onChange, placeholder }) {
  return (
    <FieldLabel label={label}>
      <input className="mc-text-input" type="text"
        value={value} placeholder={placeholder || ""}
        onChange={e => onChange(e.target.value)}
      />
    </FieldLabel>
  );
}

function CollapsibleSection({ title, id, collapsed, onToggle, children, first }) {
  const isCollapsed = collapsed.has(id);
  return (
    <div className={"mc-section" + (first ? " mc-section-first" : "")}>
      <button className="mc-section-hd" onClick={() => onToggle(id)}>
        <span className="mc-section-arrow">{isCollapsed ? "▶" : "▼"}</span>
        {title}
      </button>
      {!isCollapsed && <div className="mc-section-body">{children}</div>}
    </div>
  );
}

// ── ELEMENT TREE ─────────────────────────────────────────────────────────────
function ElementTree({ elements, selectedUid, onSelect }) {
  if (!elements.length) return (
    <div className="mc-empty">
      <div className="mc-empty-icon">⬆</div>
      <p>Import HTML + CSS files<br/>to begin</p>
    </div>
  );
  return (
    <div className="mc-tree">
      {elements.map(el => (
        <button key={el.uid}
          className={"mc-tree-row" + (selectedUid === el.uid ? " is-active" : "")}
          style={{ paddingLeft: 10 + el.depth * 14 }}
          onClick={() => onSelect(el.uid)}
        >
          <span className="mc-tree-icon">
            {el.isSvg ? "◈" : el.isSvgChild ? "◇" : el.tag === "div" ? "▦" : "▢"}
          </span>
          <span className="mc-tree-tag">{el.tag}</span>
          <span className="mc-tree-label">{el.label}</span>
        </button>
      ))}
    </div>
  );
}

// ── PROPERTY VALUE EDITOR ────────────────────────────────────────────────────
// Shows property-appropriate sub-controls based on PROP_DEFS type.
function PropValueEditor({ property, value, onChange }) {
  const def = PROP_DEFS[property] || { type:"text", default:"" };

  if (def.type === "color") {
    const hex = value && value.match(/^#[0-9a-fA-F]{3,6}$/) ? value : def.default;
    return (
      <div className="mc-prop-value-row">
        <input type="color" className="mc-canvas-color" value={hex}
          onChange={e => onChange(e.target.value)} />
        <input className="mc-text-input" style={{flex:1}} value={value}
          onChange={e => onChange(e.target.value)} placeholder={def.default} />
      </div>
    );
  }

  if (def.type === "opacity") {
    const num = parseFloat(value) || 1;
    return (
      <div>
        <div className="mc-prop-value-row">
          <span className="mc-field-val" style={{minWidth:30}}>{num}</span>
          <input type="range" className="mc-range" style={{flex:1}}
            min={0} max={1} step={0.05} value={num}
            onChange={e => onChange(e.target.value)} />
        </div>
      </div>
    );
  }

  if (def.type === "px") {
    const num = parseInt(value) || parseInt(def.default) || 0;
    return (
      <div>
        <div className="mc-prop-value-row">
          <span className="mc-field-val" style={{minWidth:40}}>{num}px</span>
          <input type="range" className="mc-range" style={{flex:1}}
            min={def.min} max={def.max} step={1} value={num}
            onChange={e => onChange(e.target.value + "px")} />
        </div>
        <input className="mc-text-input" style={{marginTop:4}} value={value}
          onChange={e => onChange(e.target.value)} placeholder={def.default + "px"} />
      </div>
    );
  }

  if (def.type === "transform") {
    const parseTransform = (v) => {
      const r = { translateX:"0", translateY:"0", rotate:"0", rotateX:"0", rotateY:"0",
                  scaleX:"1", scaleY:"1", skewX:"0", skewY:"0" };
      if (!v || v === "none") return r;
      const tx  = v.match(/translateX\(([\d.-]+[^)]*)\)/);   if (tx)  r.translateX = tx[1];
      const ty  = v.match(/translateY\(([\d.-]+[^)]*)\)/);   if (ty)  r.translateY = ty[1];
      const rot = v.match(/(?<!rotate[XY])rotate\(([\d.-]+[^)]*)\)/); if (rot) r.rotate = rot[1];
      const rx  = v.match(/rotateX\(([\d.-]+[^)]*)\)/);      if (rx)  r.rotateX = rx[1];
      const ry  = v.match(/rotateY\(([\d.-]+[^)]*)\)/);      if (ry)  r.rotateY = ry[1];
      const sx  = v.match(/scaleX\(([\d.]+)\)/);             if (sx)  r.scaleX = sx[1];
      const sy  = v.match(/scaleY\(([\d.]+)\)/);             if (sy)  r.scaleY = sy[1];
      const skx = v.match(/skewX\(([\d.-]+[^)]*)\)/);        if (skx) r.skewX = skx[1];
      const sky = v.match(/skewY\(([\d.-]+[^)]*)\)/);        if (sky) r.skewY = sky[1];
      return r;
    };
    const buildTransform = (p) => {
      const bits = [];
      if (p.translateX !== "0" && p.translateX !== "0px") bits.push("translateX(" + p.translateX + ")");
      if (p.translateY !== "0" && p.translateY !== "0px") bits.push("translateY(" + p.translateY + ")");
      if (p.rotate  !== "0" && p.rotate  !== "0deg") bits.push("rotate("  + p.rotate  + ")");
      if (p.rotateX !== "0" && p.rotateX !== "0deg") bits.push("rotateX(" + p.rotateX + ")");
      if (p.rotateY !== "0" && p.rotateY !== "0deg") bits.push("rotateY(" + p.rotateY + ")");
      if (p.scaleX !== "1") bits.push("scaleX(" + p.scaleX + ")");
      if (p.scaleY !== "1") bits.push("scaleY(" + p.scaleY + ")");
      if (p.skewX !== "0" && p.skewX !== "0deg") bits.push("skewX(" + p.skewX + ")");
      if (p.skewY !== "0" && p.skewY !== "0deg") bits.push("skewY(" + p.skewY + ")");
      return bits.length ? bits.join(" ") : "none";
    };
    const parts  = parseTransform(value);
    const update = (key, val) => onChange(buildTransform({ ...parts, [key]: val }));

    const TRANSLATE_FIELDS = [
      { key:"translateX", label:"X",       unit:"px",  min:-500, max:500,  step:1    },
      { key:"translateY", label:"Y",       unit:"px",  min:-500, max:500,  step:1    },
    ];
    const ROTATE_FIELDS = [
      { key:"rotate",  label:"rotate Z", unit:"deg", min:-360, max:360,  step:1    },
      { key:"rotateX", label:"rotate X", unit:"deg", min:-360, max:360,  step:1    },
      { key:"rotateY", label:"rotate Y", unit:"deg", min:-360, max:360,  step:1    },
    ];
    const SCALE_FIELDS = [
      { key:"scaleX", label:"scale X", unit:"",    min:0,    max:5,    step:0.05 },
      { key:"scaleY", label:"scale Y", unit:"",    min:0,    max:5,    step:0.05 },
    ];
    const SKEW_FIELDS = [
      { key:"skewX", label:"skew X",  unit:"deg", min:-180, max:180,  step:1    },
      { key:"skewY", label:"skew Y",  unit:"deg", min:-180, max:180,  step:1    },
    ];

    const renderGroup = (label, fields) => (
      <div className="mc-transform-group">
        <div className="mc-transform-group-label">{label}</div>
        {fields.map(f => (
          <div key={f.key} className="mc-transform-row">
            <span className="mc-transform-label">{f.label}</span>
            <input type="range" className="mc-range" style={{flex:1}}
              min={f.min} max={f.max} step={f.step}
              value={parseFloat(parts[f.key]) || 0}
              onChange={e => update(f.key, e.target.value + f.unit)} />
            <span className="mc-field-val" style={{minWidth:44, textAlign:"right"}}>
              {parseFloat(parts[f.key]) || 0}{f.unit}
            </span>
          </div>
        ))}
      </div>
    );
    return (
      <div className="mc-transform-grid">
        {renderGroup("translate", TRANSLATE_FIELDS)}
        {renderGroup("rotate", ROTATE_FIELDS)}
        {renderGroup("scale", SCALE_FIELDS)}
        {renderGroup("skew", SKEW_FIELDS)}
      </div>
    );
  }

  if (def.type === "shadow") {
    // Simple shadow: offsetX offsetY blur spread color
    const parseShadow = (v) => {
      if (!v || v === "none") return { x:0, y:0, blur:0, spread:0, color:"#000000" };
      const m = v.match(/([-\d.]+)px\s+([-\d.]+)px\s+([\d.]+)px\s+([\d.]+)px\s+(#[0-9a-fA-F]+)/);
      return m ? { x:Number(m[1]), y:Number(m[2]), blur:Number(m[3]), spread:Number(m[4]), color:m[5] } : { x:0, y:0, blur:0, spread:0, color:"#000000" };
    };
    const s = parseShadow(value);
    const update = (k, v) => {
      const n = { ...s, [k]: v };
      onChange(`${n.x}px ${n.y}px ${n.blur}px ${n.spread}px ${n.color}`);
    };
    return (
      <div className="mc-transform-grid">
        {[
          { key:"x",      label:"X",      min:-100, max:100 },
          { key:"y",      label:"Y",      min:-100, max:100 },
          { key:"blur",   label:"blur",   min:0,    max:100 },
          { key:"spread", label:"spread", min:-50,  max:100 },
        ].map(f => (
          <div key={f.key} className="mc-transform-row">
            <span className="mc-transform-label">{f.label}</span>
            <input type="range" className="mc-range" style={{flex:1}}
              min={f.min} max={f.max} step={1} value={s[f.key]}
              onChange={e => update(f.key, Number(e.target.value))} />
            <span className="mc-field-val" style={{minWidth:30, textAlign:"right"}}>{s[f.key]}</span>
          </div>
        ))}
        <div className="mc-transform-row">
          <span className="mc-transform-label">color</span>
          <input type="color" className="mc-canvas-color" value={s.color}
            onChange={e => update("color", e.target.value)} />
        </div>
      </div>
    );
  }

  if (def.type === "filter") {
    // blur | brightness | contrast | saturate
    const parseFilter = (v) => {
      const r = { blur:0, brightness:100, contrast:100, saturate:100 };
      if (!v || v === "none") return r;
      const bl = v.match(/blur\(([\d.]+)px\)/); if (bl) r.blur = parseFloat(bl[1]);
      const br = v.match(/brightness\(([\d.]+)%\)/); if (br) r.brightness = parseFloat(br[1]);
      const co = v.match(/contrast\(([\d.]+)%\)/); if (co) r.contrast = parseFloat(co[1]);
      const sa = v.match(/saturate\(([\d.]+)%\)/); if (sa) r.saturate = parseFloat(sa[1]);
      return r;
    };
    const buildFilter = (p) => {
      const bits = [];
      if (p.blur > 0) bits.push(`blur(${p.blur}px)`);
      if (p.brightness !== 100) bits.push(`brightness(${p.brightness}%)`);
      if (p.contrast !== 100) bits.push(`contrast(${p.contrast}%)`);
      if (p.saturate !== 100) bits.push(`saturate(${p.saturate}%)`);
      return bits.length ? bits.join(" ") : "none";
    };
    const f = parseFilter(value);
    const update = (k, v) => onChange(buildFilter({ ...f, [k]: v }));
    return (
      <div className="mc-transform-grid">
        {[
          { key:"blur",       label:"blur",       min:0,   max:40,  unit:"px" },
          { key:"brightness", label:"brightness", min:0,   max:200, unit:"%" },
          { key:"contrast",   label:"contrast",   min:0,   max:200, unit:"%" },
          { key:"saturate",   label:"saturate",   min:0,   max:200, unit:"%" },
        ].map(f2 => (
          <div key={f2.key} className="mc-transform-row">
            <span className="mc-transform-label">{f2.label}</span>
            <input type="range" className="mc-range" style={{flex:1}}
              min={f2.min} max={f2.max} step={1} value={f[f2.key]}
              onChange={e => update(f2.key, Number(e.target.value))} />
            <span className="mc-field-val" style={{minWidth:40, textAlign:"right"}}>{f[f2.key]}{f2.unit}</span>
          </div>
        ))}
      </div>
    );
  }

  // Fallback: plain text input
  return (
    <input className="mc-text-input" value={value}
      onChange={e => onChange(e.target.value)} placeholder={def.default} />
  );
}

// ── EASING SELECTOR ──────────────────────────────────────────────────────────
// Smart easing picker: shows cubic-bezier 4-point input or steps config
// when the user picks those options. Wraps the plain <Select> for all others.
function EasingSelector({ value, onChange }) {
  // Determine which mode we are in
  const isCustomCubic = value && value.startsWith("cubic-bezier") &&
    !EASINGS.some(e => e.value === value && e.value !== "__cubic_custom__");
  const isCustomSteps = value && value.startsWith("steps") &&
    value !== "steps(4,end)";
  const isPreset = !isCustomCubic && !isCustomSteps;

  // Dropdown value — map back to sentinel if custom
  const dropdownVal = isCustomCubic ? "__cubic_custom__"
    : isCustomSteps ? "__steps_custom__"
    : value;

  // Parse cubic-bezier points from current value
  const parseCBParts = (v) => {
    const m = v && v.match(/cubic-bezier\(([\d.-]+),([\d.-]+),([\d.-]+),([\d.-]+)\)/);
    return m ? [m[1], m[2], m[3], m[4]] : ["0.25","0.1","0.25","1"];
  };
  const [cbParts, setCbParts] = React.useState(() => parseCBParts(value));

  // Parse steps from current value
  const parseStepsParts = (v) => {
    const m = v && v.match(/steps\((\d+),(\w+)\)/);
    return m ? { count: m[1], dir: m[2] } : { count: "4", dir: "end" };
  };
  const [stepsParts, setStepsParts] = React.useState(() => parseStepsParts(value));

  const handleDropdown = (v) => {
    if (v === "__cubic_custom__") {
      onChange("cubic-bezier(" + cbParts.join(",") + ")");
    } else if (v === "__steps_custom__") {
      onChange("steps(" + stepsParts.count + "," + stepsParts.dir + ")");
    } else {
      onChange(v);
    }
  };

  const updateCb = (idx, val) => {
    const next = [...cbParts];
    next[idx] = val;
    setCbParts(next);
    onChange("cubic-bezier(" + next.join(",") + ")");
  };

  const updateSteps = (k, v) => {
    const next = { ...stepsParts, [k]: v };
    setStepsParts(next);
    onChange("steps(" + next.count + "," + next.dir + ")");
  };

  return (
    <div>
      <select className="mc-select" value={dropdownVal} onChange={e => handleDropdown(e.target.value)}>
        {EASINGS.map(o => <option key={o.value} value={o.value}>{o.label}</option>)}
      </select>

      {(isCustomCubic || dropdownVal === "__cubic_custom__") && (
        <div className="mc-cb-editor">
          <div className="mc-cb-title">cubic-bezier(x1, y1, x2, y2)</div>
          <div className="mc-cb-grid">
            {["x1","y1","x2","y2"].map((lbl, i) => (
              <div key={lbl} className="mc-cb-field">
                <label className="mc-cb-label">{lbl}</label>
                <input type="number" className="mc-text-input mc-cb-input"
                  min={-2} max={2} step={0.01}
                  value={cbParts[i]}
                  onChange={e => updateCb(i, e.target.value)} />
                <input type="range" className="mc-range"
                  min={-2} max={2} step={0.01}
                  value={parseFloat(cbParts[i]) || 0}
                  onChange={e => updateCb(i, e.target.value)} />
              </div>
            ))}
          </div>
          <div className="mc-cb-preview">
            <EasingCurve easing={"cubic-bezier(" + cbParts.join(",") + ")"} />
            <div className="mc-cb-value">cubic-bezier({cbParts.join(", ")})</div>
          </div>
        </div>
      )}

      {(isCustomSteps || dropdownVal === "__steps_custom__") && (
        <div className="mc-cb-editor">
          <div className="mc-cb-title">steps(count, direction)</div>
          <div className="mc-steps-grid">
            <div className="mc-cb-field">
              <label className="mc-cb-label">count</label>
              <input type="number" className="mc-text-input mc-cb-input"
                min={1} max={20} step={1}
                value={stepsParts.count}
                onChange={e => updateSteps("count", e.target.value)} />
            </div>
            <div className="mc-cb-field">
              <label className="mc-cb-label">direction</label>
              <select className="mc-select" value={stepsParts.dir}
                onChange={e => updateSteps("dir", e.target.value)}>
                {["start","end","none","both"].map(d => <option key={d} value={d}>{d}</option>)}
              </select>
            </div>
          </div>
          <div className="mc-cb-value">steps({stepsParts.count}, {stepsParts.dir})</div>
        </div>
      )}
    </div>
  );
}

// ── SINGLE TRANSITION RULE EDITOR ─────────────────────────────────────────────
// Trigger options for the transition — what CSS state causes the change
const TRIGGERS = [
  { value: ":hover",   label: ":hover" },
  { value: ":focus",   label: ":focus" },
  { value: ":active",  label: ":active" },
  { value: ":checked", label: ":checked" },
  { value: ".is-open", label: ".is-open (class)" },
  { value: ".is-active", label: ".is-active (class)" },
  { value: ".is-visible", label: ".is-visible (class)" },
  { value: " custom",  label: "custom…" },
];

function TransitionRuleEditor({ rule, uniqueSelectors, onUpdate, onRemove, onCopy }) {
  // open state lives in the rule object so it survives navigation away and back
  const open    = rule.open !== false;  // default open
  const setOpen = (val) => onUpdate({ ...rule, open: typeof val === "function" ? val(open) : val });
  const RULE_DEFAULTS = { property:"opacity", duration:300, easing:"ease", delay:0,
    baseValue:"", targetValue:"", trigger:":hover", customTrigger:"" };

  const set = patch => onUpdate({ ...rule, ...patch });
  const reset = key => set({ [key]: RULE_DEFAULTS[key] });

  // Effective trigger string
  const trigger = rule.trigger === " custom"
    ? (rule.customTrigger || ":hover")
    : (rule.trigger || ":hover");

  const summary = `${rule.selector || "?"} · ${rule.property || "?"} · ${trigger}`;

  const isDisabled = !!rule.disabled;
  const isLocked   = !!rule.locked;

  return (
    <div className={"mc-anim-card" + (isDisabled ? " mc-rule-disabled" : "") + (isLocked ? " mc-rule-locked" : "")} style={{marginBottom:10}}>
      {/* ── Header with minimize toggle ── */}
      <div className="mc-anim-card-hd" onClick={() => setOpen(o => !o)} style={{cursor:"pointer"}}>
        <span className="mc-anim-arrow">{open ? "▼" : "▶"}</span>
        <span className="mc-anim-name" style={{opacity: isDisabled ? 0.4 : 1}}>{summary}</span>
        {/* disable toggle */}
        <button className={"mc-rule-icon-btn" + (isDisabled ? " is-on" : "")}
          title={isDisabled ? "Enable rule" : "Disable rule"}
          onClick={e => { e.stopPropagation(); set({ disabled: !isDisabled }); }}>
          {isDisabled ? "○" : "●"}
        </button>
        {/* lock toggle */}
        <button className={"mc-rule-icon-btn" + (isLocked ? " is-locked" : "")}
          title={isLocked ? "Unlock rule" : "Lock rule (prevents deletion)"}
          onClick={e => { e.stopPropagation(); set({ locked: !isLocked }); }}>
          {isLocked ? "🔒" : "🔓"}
        </button>
        {/* copy */}
        <button className="mc-rule-copy-btn" title="Copy rule"
          onClick={e => { e.stopPropagation(); onCopy(rule); }}>⧉</button>
        {/* delete — blocked when locked */}
        <button className="mc-anim-del" title={isLocked ? "Unlock first to delete" : "Delete rule"}
          style={{opacity: isLocked ? 0.3 : 1, cursor: isLocked ? "not-allowed" : "pointer"}}
          onClick={e => { e.stopPropagation(); if (!isLocked) onRemove(); }}>✕</button>
      </div>

      {open && (
        <div className="mc-anim-body">

          {/* SELECTOR */}
          <FieldLabel label="selector">
            <select className="mc-select" value={rule.selector}
              onChange={e => set({ selector: e.target.value })}>
              {uniqueSelectors.map(o => <option key={o.value} value={o.value}>{o.label}</option>)}
            </select>
          </FieldLabel>

          {/* PROPERTY */}
          <FieldLabel label={
            <span className="mc-field-row">
              <span>property</span>
              <button className="mc-reset-btn" onClick={() => reset("property")}>↺</button>
            </span>
          }>
            <select className="mc-select" value={rule.property}
              onChange={e => set({ property: e.target.value, baseValue:"", targetValue:"" })}>
              {ANIMATABLE_PROPS.map(p => <option key={p} value={p}>{p}</option>)}
            </select>
          </FieldLabel>

          {/* TWO-STATE: base → target */}
          <div className="mc-two-state">
            <div className="mc-state-col">
              <div className="mc-state-label">base value</div>
              <PropValueEditor property={rule.property} value={rule.baseValue || ""}
                onChange={v => set({ baseValue: v })} />
            </div>
            <div className="mc-state-arrow">→</div>
            <div className="mc-state-col">
              <div className="mc-state-label">target value</div>
              <PropValueEditor property={rule.property} value={rule.targetValue || ""}
                onChange={v => set({ targetValue: v })} />
            </div>
          </div>

          {/* TRIGGER */}
          <FieldLabel label="trigger">
            <select className="mc-select" value={rule.trigger || ":hover"}
              onChange={e => set({ trigger: e.target.value })}>
              {TRIGGERS.map(t => <option key={t.value} value={t.value}>{t.label}</option>)}
            </select>
          </FieldLabel>
          {rule.trigger === " custom" && (
            <FieldLabel label="custom trigger selector">
              <input className="mc-text-input" value={rule.customTrigger || ""}
                placeholder=".my-class or :focus-within"
                onChange={e => set({ customTrigger: e.target.value })} />
            </FieldLabel>
          )}

          {/* TIMING */}
          <div className="mc-field">
            <div className="mc-field-label">
              <span className="mc-field-row">duration
                <span className="mc-field-val" style={{marginLeft:6}}>{rule.duration}ms</span>
              </span>
              <button className="mc-reset-btn" onClick={() => reset("duration")}>↺</button>
            </div>
            <input type="range" className="mc-range" min={50} max={3000} step={50}
              value={rule.duration} onChange={e => set({ duration: Number(e.target.value) })} />
          </div>

          <FieldLabel label={
            <span className="mc-field-row">
              <span>easing</span>
              <button className="mc-reset-btn" onClick={() => reset("easing")}>↺</button>
            </span>
          }>
            <EasingSelector value={rule.easing} onChange={v => set({ easing: v })} />
          </FieldLabel>

          <div className="mc-field">
            <div className="mc-field-label">
              <span className="mc-field-row">delay
                <span className="mc-field-val" style={{marginLeft:6}}>{rule.delay}ms</span>
              </span>
              <button className="mc-reset-btn" onClick={() => reset("delay")}>↺</button>
            </div>
            <input type="range" className="mc-range" min={0} max={2000} step={50}
              value={rule.delay} onChange={e => set({ delay: Number(e.target.value) })} />
          </div>

          <div className="mc-easing-preview">
            <div className="mc-easing-label">easing curve</div>
            <EasingCurve easing={rule.easing} />
          </div>

        </div>
      )}
    </div>
  );
}

// ── TRANSITIONS PANEL ────────────────────────────────────────────────────────
// transitions[elementUid] is now an ARRAY of rule objects:
//   { id, selector, property, value, duration, easing, delay }
// The ADD button appends a new rule. Each rule is independently editable.
// Clicking a MotionCraft CSS line loads it back into a new rule.
function TransitionsPanel({ selected, transitions, onChange, elements, clipboard, setClipboard }) {
  if (!selected) return <div className="mc-empty"><p>Select an element to add transitions</p></div>;

  const uid = selected.uid;
  const autoSelector = selected.className
    ? `.${selected.className.trim().split(/\s+/)[0]}`
    : selected.elId ? `#${selected.elId}` : selected.tag;

  // clipboard state lifted to main app — see ruleClipboard

  // rules is always an array
  const rules = Array.isArray(transitions[uid]) ? transitions[uid]
    : transitions[uid] ? [transitions[uid]]   // migrate old single-object format
    : [];

  const setRules = newRules => onChange(uid, newRules);

  const addRule = () => {
    setRules([...rules, {
      id: `r${Date.now()}`,
      selector: autoSelector, property: "opacity",
      value: "",   // blank until user sets it — prevents premature :hover emission
      duration: 300, easing: "ease", delay: 0,
    }]);
  };

  // Copy: save the rule to clipboard (strip id so paste always gets a fresh one)
  const copyRule = (rule) => {
    const { id, ...rest } = rule;
    setClipboard(rest);
  };

  // Paste: append a clone with a fresh id, selector swapped to current element
  const pasteRule = () => {
    if (!clipboard) return;
    setRules([...rules, {
      ...clipboard,
      id: `r${Date.now()}`,
      selector: autoSelector,  // default to current element — user can change it
    }]);
  };

  const updateRule = (idx, patch) => {
    setRules(rules.map((r, i) => i === idx ? { ...r, ...patch } : r));
  };

  const removeRule = idx => setRules(rules.filter((_, i) => i !== idx));

  // Build unique selector options from the element tree
  const seen = new Set();
  const uniqueSelectors = elements.map(el => {
    const sel = el.className ? `.${el.className.trim().split(/\s+/)[0]}`
      : el.elId ? `#${el.elId}` : el.tag;
    return { value: sel, label: `${el.tag} ${sel}` };
  }).filter(o => seen.has(o.value) ? false : seen.add(o.value));

  return (
    <div>
      <div className="mc-panel-intro">
        Transitions on <code className="mc-code-inline">{selected.label}</code>
      </div>

      <div className="mc-trans-actions">
        <button className="mc-add-btn mc-add-btn-inline" onClick={addRule}>+ Add rule</button>
        {clipboard && (
          <button className="mc-paste-btn" onClick={pasteRule}
            title={`Paste: ${clipboard.property} (${clipboard.duration}ms ${clipboard.easing})`}>
            ⧉ Paste · <span className="mc-paste-hint">{clipboard.property}</span>
          </button>
        )}
      </div>

      {rules.length === 0 && (
        <div className="mc-hint">No rules yet. Click "+ Add rule" to start.</div>
      )}

      {rules.map((rule, idx) => (
        <TransitionRuleEditor key={rule.id || idx}
          rule={rule}
          uniqueSelectors={uniqueSelectors}
          onUpdate={patch => updateRule(idx, patch)}
          onRemove={() => removeRule(idx)}
          onCopy={copyRule}
        />
      ))}
    </div>
  );
}

// ── EASING CURVE PREVIEW ─────────────────────────────────────────────────────
function EasingCurve({ easing }) {
  // Parse custom cubic-bezier string into control points, fallback to presets
  const parseCubic = (str) => {
    const m = str && str.match(/cubic-bezier\(([\d.-]+),([\d.-]+),([\d.-]+),([\d.-]+)\)/);
    if (m) return [[0,0],[parseFloat(m[1]),parseFloat(m[2])],[parseFloat(m[3]),parseFloat(m[4])],[1,1]];
    return null;
  };
  const pts = parseCubic(easing) || EASING_CURVES[easing] || EASING_CURVES["ease"];
  const W = 80, H = 80, PAD = 8;
  const x = t => PAD + t * (W - PAD*2);
  const y = t => H - PAD - t * (H - PAD*2);
  const p0 = pts[0], p1 = pts[1], p2 = pts[2], p3 = pts[3];
  const d = `M${x(p0[0])},${y(p0[1])} C${x(p1[0])},${y(p1[1])} ${x(p2[0])},${y(p2[1])} ${x(p3[0])},${y(p3[1])}`;

  return (
    <svg width={W} height={H} viewBox={`0 0 ${W} ${H}`} className="mc-curve-svg">
      <line x1={PAD} y1={H-PAD} x2={W-PAD} y2={PAD} stroke="var(--line)" strokeWidth="1" strokeDasharray="2,2"/>
      <line x1={x(p0[0])} y1={y(p0[1])} x2={x(p1[0])} y2={y(p1[1])} stroke="var(--accent-soft)" strokeWidth="1"/>
      <line x1={x(p3[0])} y1={y(p3[1])} x2={x(p2[0])} y2={y(p2[1])} stroke="var(--accent-soft)" strokeWidth="1"/>
      <path d={d} fill="none" stroke="var(--accent)" strokeWidth="2" strokeLinecap="round"/>
      <circle cx={x(p1[0])} cy={y(p1[1])} r="2.5" fill="var(--accent)"/>
      <circle cx={x(p2[0])} cy={y(p2[1])} r="2.5" fill="var(--accent)"/>
    </svg>
  );
}

// ── KEYFRAMES PANEL ──────────────────────────────────────────────────────────
function KeyframesPanel({ selected, keyframeAnims, onAdd, onUpdate, onRemove, elements, kfClipboard, setKfClipboard }) {
  const myAnims = Object.values(keyframeAnims).filter(a => a.elementUid === (selected && selected.uid));

  const addAnim = () => {
    const id = uid();
    const name = `anim-${id}`;
    onAdd(id, {
      id, name, elementUid: selected.uid,
      selector: selected.className ? `.${selected.className.trim().split(/\s+/)[0]}` : selected.tag,
      duration: 600, easing: "ease-in-out", iterationCount: 1, fillMode: "both",
      disabled: false, locked: false,
      stops: [
        { offset: 0,   props: { opacity: "0", transform: "translateY(10px)" } },
        { offset: 100, props: { opacity: "1", transform: "translateY(0)" } },
      ],
    });
  };

  const copyAnim = (anim) => {
    const { id, ...rest } = anim;
    setKfClipboard(rest);
  };

  const pasteAnim = () => {
    if (!kfClipboard) return;
    const newId = uid();
    const autoSel = selected.className
      ? `.${selected.className.trim().split(/\s+/)[0]}`
      : selected.tag;
    onAdd(newId, {
      ...kfClipboard,
      id: newId,
      name: `${kfClipboard.name}-copy`,
      elementUid: selected.uid,
      selector: autoSel,
    });
  };

  if (!selected) return <div className="mc-empty"><p>Select an element to add keyframe animations</p></div>;

  return (
    <div>
      <div className="mc-panel-intro">
        Keyframes on <code className="mc-code-inline">{selected.label}</code>
      </div>
      <div className="mc-trans-actions">
        <button className="mc-add-btn mc-add-btn-inline" onClick={addAnim}>+ Add animation</button>
        {kfClipboard && (
          <button className="mc-paste-btn" onClick={pasteAnim}
            title={`Paste: ${kfClipboard.name}`}>
            ⧉ Paste · <span className="mc-paste-hint">{kfClipboard.name}</span>
          </button>
        )}
      </div>

      {myAnims.map(anim => (
        <KeyframeEditor key={anim.id} anim={anim} onUpdate={onUpdate} onRemove={onRemove}
          animElements={elements} onCopy={copyAnim} />
      ))}

      {myAnims.length === 0 && (
        <div className="mc-hint">No animations yet. Click "+ Add animation" to start.</div>
      )}
    </div>
  );
}

function KeyframeEditor({ anim, onUpdate, onRemove, animElements, onCopy }) {
  // open state lives in the anim object so it survives navigation away and back
  const open    = anim.open !== false;  // default open
  const setOpen = (val) => onUpdate(anim.id, { ...anim, open: typeof val === "function" ? val(open) : val });
  const set = patch => onUpdate(anim.id, { ...anim, ...patch });
  const isDisabled = !!anim.disabled;
  const isLocked   = !!anim.locked;
  const setStop = (idx, patch) => {
    const stops = anim.stops.map((s, i) => i === idx ? { ...s, ...patch } : s);
    set({ stops });
  };
  const setStopProp = (idx, prop, val) => {
    const stops = anim.stops.map((s, i) =>
      i === idx ? { ...s, props: { ...s.props, [prop]: val } } : s
    );
    set({ stops });
  };
  const addStop = () => {
    const offsets = anim.stops.map(s => s.offset);
    // Find biggest gap and insert in middle
    let bestGap = 0, bestIdx = 0;
    for (let i = 0; i < offsets.length - 1; i++) {
      const gap = offsets[i+1] - offsets[i];
      if (gap > bestGap) { bestGap = gap; bestIdx = i; }
    }
    const newOffset = Math.round((offsets[bestIdx] + offsets[bestIdx+1]) / 2);
    const stops = [...anim.stops];
    stops.splice(bestIdx + 1, 0, { offset: newOffset, props: {} });
    set({ stops });
  };
  const removeStop = idx => {
    if (anim.stops.length <= 2) return;
    set({ stops: anim.stops.filter((_, i) => i !== idx) });
  };

  return (
    <div className={"mc-anim-card" + (isDisabled ? " mc-rule-disabled" : "") + (isLocked ? " mc-rule-locked" : "")}>
      <div className="mc-anim-card-hd" onClick={() => setOpen(o => !o)}>
        <span className="mc-anim-arrow">{open ? "▼" : "▶"}</span>
        <span className="mc-anim-name" style={{opacity: isDisabled ? 0.4 : 1}}>{anim.name}</span>
        <button className={"mc-rule-icon-btn" + (isDisabled ? " is-on" : "")}
          title={isDisabled ? "Enable" : "Disable"}
          onClick={e => { e.stopPropagation(); set({ disabled: !isDisabled }); }}>
          {isDisabled ? "○" : "●"}
        </button>
        <button className={"mc-rule-icon-btn" + (isLocked ? " is-locked" : "")}
          title={isLocked ? "Unlock" : "Lock (prevents deletion)"}
          onClick={e => { e.stopPropagation(); set({ locked: !isLocked }); }}>
          {isLocked ? "🔒" : "🔓"}
        </button>
        {onCopy && (
          <button className="mc-rule-copy-btn" title="Copy animation"
            onClick={e => { e.stopPropagation(); onCopy(anim); }}>⧉</button>
        )}
        <button className="mc-anim-del" title={isLocked ? "Unlock first to delete" : "Delete"}
          style={{opacity: isLocked ? 0.3 : 1, cursor: isLocked ? "not-allowed" : "pointer"}}
          onClick={e => { e.stopPropagation(); if (!isLocked) onRemove(anim.id); }}>✕</button>
      </div>
      {open && (
        <div className="mc-anim-body">
          <TextInput label="name" value={anim.name} onChange={v => set({ name: v })} />
          <FieldLabel label="selector">
            <select className="mc-select" value={anim.selector} onChange={e => set({ selector: e.target.value })}>
              {(animElements || []).map(el => {
                const sel = el.className ? `.${el.className.trim().split(/\s+/)[0]}` : el.elId ? `#${el.elId}` : el.tag;
                return <option key={sel} value={sel}>{el.tag} {sel}</option>;
              })}
            </select>
          </FieldLabel>

          <Slider label="duration" value={anim.duration} min={100} max={5000} step={100} suffix="ms"
            onChange={v => set({ duration: v })} />

          <FieldLabel label="easing"><EasingSelector value={anim.easing} onChange={v => set({ easing: v })} /></FieldLabel>

          <FieldLabel label="iterations">
            <div style={{ display:"flex", gap:6 }}>
              <input className="mc-text-input" style={{ width:60 }}

                placeholder="1"
                onChange={e => set({ iterationCount: Number(e.target.value) || 1 })}
              />
              <button
                className={"mc-pill-btn" + (anim.iterationCount === "infinite" ? " is-on" : "")}
                onClick={() => set({ iterationCount: anim.iterationCount === "infinite" ? 1 : "infinite" })}
              >∞</button>
            </div>
          </FieldLabel>

          <Select label="direction" value={anim.direction || "normal"}
            options={[
              {value:"normal",           label:"normal"},
              {value:"reverse",          label:"reverse"},
              {value:"alternate",        label:"alternate"},
              {value:"alternate-reverse",label:"alternate-reverse"},
            ]}
            onChange={v => set({ direction: v })} />

          <Select label="fill mode" value={anim.fillMode} options={["none","forwards","backwards","both"]}
            onChange={v => set({ fillMode: v })} />

          <Select label="play state" value={anim.playState || "running"}
            options={[{value:"running",label:"running"},{value:"paused",label:"paused"}]}
            onChange={v => set({ playState: v })} />

          <div className="mc-stops-head">
            <span>stops</span>
            <button className="mc-add-stop-btn" onClick={addStop}>+ stop</button>
          </div>

          {anim.stops.map((stop, idx) => (
            <StopEditor key={idx} stop={stop} idx={idx}
              onSetOffset={v => setStop(idx, { offset: v })}
              onSetProp={(prop, val) => setStopProp(idx, prop, val)}
              onRemove={() => removeStop(idx)}
              canRemove={anim.stops.length > 2}
            />
          ))}
        </div>
      )}
    </div>
  );
}

function StopEditor({ stop, idx, onSetOffset, onSetProp, onRemove, canRemove }) {
  const [propInput, setPropInput] = useState("");
  const [valInput, setValInput] = useState("");

  const addProp = () => {
    if (!propInput.trim()) return;
    onSetProp(propInput.trim(), valInput.trim());
    setPropInput(""); setValInput("");
  };

  return (
    <div className="mc-stop">
      <div className="mc-stop-hd">
        <span className="mc-stop-pct">{stop.offset}%</span>
        <input type="range" className="mc-range mc-stop-range"
          min={0} max={100} value={stop.offset}
          onChange={e => onSetOffset(Number(e.target.value))}
        />
        {canRemove && <button className="mc-stop-del" onClick={onRemove}>✕</button>}
      </div>
      <div className="mc-stop-props">
        {Object.entries(stop.props).map(([prop, val]) => (
          <div key={prop} className="mc-stop-prop-row">
            <code className="mc-prop-name">{prop}</code>
            <input className="mc-text-input mc-prop-val"
              value={val}
              onChange={e => onSetProp(prop, e.target.value)}
            />
            <button className="mc-stop-del" onClick={() => {
              const props = { ...stop.props };
              delete props[prop];
              Object.keys(props).forEach(k => onSetProp(k, props[k]));
              onSetProp(prop, undefined);
            }}>✕</button>
          </div>
        ))}
        <div className="mc-add-prop-row">
          <select className="mc-select mc-prop-sel"
            value={propInput}
            onChange={e => setPropInput(e.target.value)}
          >
            <option value="">property…</option>
            {ANIMATABLE_PROPS.map(p => <option key={p} value={p}>{p}</option>)}
          </select>
          <input className="mc-text-input mc-prop-val"
            placeholder="value…"
            value={valInput}
            onChange={e => setValInput(e.target.value)}
            onKeyDown={e => e.key === "Enter" && addProp()}
          />
          <button className="mc-add-prop-btn" onClick={addProp}>+</button>
        </div>
      </div>
    </div>
  );
}

// ── PREVIEW CANVAS ────────────────────────────────────────────────────────────
function PreviewCanvas({ htmlStr, cssStr, augmentedCss, playing, iframeRef, canvasBg, canvasOpacity }) {

  // ── Structural doc: HTML + base CSS + injected script ──────────────────────
  // This is the FULL document. Only changes when the HTML structure, base CSS,
  // background, or opacity change — NOT when augmentedCss changes.
  // Rebuilding this reloads the iframe; we avoid that for CSS-only edits.
  const structuralDoc = useMemo(() => {
    if (!htmlStr) return "";
    const highlightScript = `<script>
(function() {
  function applyHighlight(cls) {
    var prev = document.querySelector('[data-mc-selected]');
    if (prev) { prev.removeAttribute('data-mc-selected'); prev.style.outline=''; prev.style.outlineOffset=''; }
    if (!cls) return;
    var el = document.querySelector('.' + cls);
    if (el) { el.setAttribute('data-mc-selected','1'); el.style.outline='2px solid #e8b04b'; el.style.outlineOffset='2px'; }
  }
  var _paused = false;
  function setPauseAll(p) {
    _paused = p;
    var style = document.getElementById('mc-pause-style');
    if (!style) { style = document.createElement('style'); style.id = 'mc-pause-style'; document.head.appendChild(style); }
    style.textContent = p ? '* { animation-play-state: paused !important; }' : '';
  }
  window.addEventListener('message', function(e) {
    if (e.data && e.data.type === 'mc-select') applyHighlight(e.data.className);
    if (e.data && e.data.type === 'mc-playpause') setPauseAll(!_paused);
    // Live CSS patch — update the MotionCraft additions <style> tag without reloading
    if (e.data && e.data.type === 'mc-css') {
      var s = document.getElementById('mc-additions-style');
      if (!s) { s = document.createElement('style'); s.id = 'mc-additions-style'; document.head.appendChild(s); }
      s.textContent = e.data.css || '';
    }
  });
  document.addEventListener('click', function(e) {
    var el = e.target;
    while (el && el !== document.body) {
      if (el.className && typeof el.className === 'string' && el.className.trim()) {
        window.parent.postMessage({ type: 'mc-click', className: el.className.trim() }, '*');
        applyHighlight(el.className.trim().split(' ')[0]);
        break;
      }
      el = el.parentElement;
    }
  });
})();
<\/script>`;
    var bgStyle = "background: " + (canvasBg || "transparent") + " !important; opacity: " + (canvasOpacity !== undefined ? canvasOpacity : 1) + ";";
    // augmentedCss is intentionally NOT inlined here — it gets injected live via postMessage.
    // We include an empty <style id="mc-additions-style"> as the target slot.
    return "<!DOCTYPE html><html><head><meta charset=\"UTF-8\"/>\n<style>\n*, *::before, *::after { box-sizing: border-box; }\n" + (cssStr || "") + "\n/* ── MotionCraft preview overrides ── */\nhtml, body { margin: 0; padding: 16px; " + bgStyle + " }\n</style>\n<style id=\"mc-additions-style\"></style></head><body>" + htmlStr + highlightScript + "</body></html>";
  }, [htmlStr, cssStr, canvasBg, canvasOpacity]); // ← augmentedCss deliberately excluded

  // ── Load structural doc into iframe ────────────────────────────────────────
  useEffect(() => {
    if (!iframeRef.current) return;
    iframeRef.current.srcdoc = structuralDoc;
  }, [structuralDoc]);

  // ── Replay: reload structural doc then re-inject CSS ───────────────────────
  useEffect(() => {
    if (!playing || !iframeRef.current) return;
    iframeRef.current.srcdoc = "";
    requestAnimationFrame(() => { if (iframeRef.current) iframeRef.current.srcdoc = structuralDoc; });
  }, [playing]);

  // ── After every iframe load: re-inject CSS + re-apply highlight ────────────
  // Runs after both full reloads and replay. Hooks must all be before early return.
  useEffect(() => {
    const iframe = iframeRef.current;
    if (!iframe) return;
    const onLoad = () => {
      // Small delay so the injected script's message listener is registered
      setTimeout(() => {
        try {
          // Re-inject the MotionCraft CSS additions
          const css = iframe._mcAugmentedCss || "";
          iframe.contentWindow.postMessage({ type: "mc-css", css }, "*");
          // Re-apply selection highlight
          const sel = iframe._mcSelectedClass || null;
          if (sel) iframe.contentWindow.postMessage({ type: "mc-select", className: sel }, "*");
        } catch(e) {}
      }, 60);
    };
    iframe.addEventListener("load", onLoad);
    return () => iframe.removeEventListener("load", onLoad);
  }, [iframeRef]);

  // ── Live CSS injection: patch additions without reloading ──────────────────
  // When augmentedCss changes, push it straight into the iframe via postMessage.
  // This is the key change — no srcdoc reset, no highlight loss.
  useEffect(() => {
    const iframe = iframeRef.current;
    if (!iframe) return;
    iframe._mcAugmentedCss = augmentedCss; // store for post-reload re-injection
    try {
      iframe.contentWindow.postMessage({ type: "mc-css", css: augmentedCss || "" }, "*");
    } catch(e) {}
  }, [augmentedCss]);

  if (!htmlStr) return (
    <div className="mc-canvas-empty">
      <div className="mc-canvas-empty-icon">◈</div>
      <p>Import a FlexCraft export or HTML+CSS pair to preview</p>
    </div>
  );

  return (
    <iframe ref={iframeRef} className="mc-iframe" sandbox="allow-same-origin allow-scripts" title="preview" />
  );
}

// ── CSS CODE VIEW (segments + highlight + scroll) ────────────────────────────
// Builds segments from the CSS text: one segment per rule block, keyed by
// the first class name in the selector so it matches element className.
function buildCssSegments(cssText) {
  if (!cssText) return [];
  const segments = [];
  const re = /([^{]+\{[^}]*\})/g;
  let m;
  while ((m = re.exec(cssText)) !== null) {
    const block = m[1];
    // Extract first class name from selector e.g. ".div-n3" → "div-n3"
    const selMatch = block.match(/\.([^\s,{:]+)/);
    const key = selMatch ? selMatch[1] : null;
    segments.push({ key, text: block.trim() });
  }
  return segments;
}

// Parse a transition rule text block back into rule objects for loading into UI
function parseTransitionBlock(blockText) {
  const rules = [];
  const selMatch = blockText.match(/^([^{]+)\{/);
  const selector = selMatch ? selMatch[1].trim() : "";
  const transMatch = blockText.match(/transition:\s*([^;]+);/);
  if (!transMatch) return rules;
  // Each comma-separated transition shorthand: property duration easing delay
  const parts = transMatch[1].split(",").map(s => s.trim()).filter(Boolean);
  for (const part of parts) {
    const tokens = part.split(/\s+/);
    const property = tokens[0] || "opacity";
    const duration = parseInt(tokens[1]) || 300;
    const easing   = tokens[2] || "ease";
    const delay    = parseInt(tokens[3]) || 0;
    if (ANIMATABLE_PROPS.includes(property)) {
      rules.push({ id: "r" + Date.now() + Math.random(),
        selector, property, value: PROP_DEFS[property]?.default || "",
        duration, easing, delay });
    }
  }
  return rules;
}

function CssCodeView({ cssText, selectedClass, onEdit, onLoadRules, motionMarker }) {
  const hlRef = useRef(null);
  const segments = useMemo(() => buildCssSegments(cssText), [cssText]);

  useEffect(() => {
    if (hlRef.current) hlRef.current.scrollIntoView({ block: "nearest", behavior: "smooth" });
  }, [selectedClass]);

  // Determine which segments are MotionCraft-added (after the marker)
  let afterMarker = false;

  return (
    <pre className="mc-css-code mc-css-code-view" onDoubleClick={onEdit}
      title="Double-click to edit">
      <code>
        {segments.length === 0 && <span className="mc-css-mut">{"/* nothing yet */"}</span>}
        {segments.map((seg, i) => {
          if (seg.text.includes("MotionCraft additions")) afterMarker = true;
          const isSel = seg.key && selectedClass && selectedClass.split(/\s+/).includes(seg.key);
          const isMC  = afterMarker && seg.text.includes("transition:");
          return (
            <React.Fragment key={i}>
              {i > 0 && "\n\n"}
              <span ref={isSel ? hlRef : null}
                className={(isSel ? "mc-css-hl" : "") + (isMC ? " mc-css-mc-rule" : "")}
                title={isMC ? "Click to load into UI" : undefined}
                onClick={isMC && onLoadRules ? () => {
                  const rules = parseTransitionBlock(seg.text);
                  if (rules.length) onLoadRules(rules);
                } : undefined}
              >
                {seg.text}
              </span>
            </React.Fragment>
          );
        })}
      </code>
    </pre>
  );
}
